- date: 2025-11
  title: A multimodal whole-slide foundation model for pathology
  url: https://www.nature.com/articles/s41591-025-03982-3
  doi: 10.1038/s41591-025-03982-3
  venue: Nat. Med.
  authors:
    first:
      name: Tong Ding
      scholar: https://scholar.google.com/citations?user=Vwt2ZVYAAAAJ&hl=en
    last:
      name: Faisal Mahmood
      scholar: https://scholar.google.com/citations?user=9MsdbKoAAAAJ&hl=en
  model:
    name: TITAN
    repo: https://github.com/mahmoodlab/TITAN
    weights: https://huggingface.co/MahmoodLab/TITAN
    params_note: >-
      48.5M is the slide encoder and excludes the frozen CONCH v1.5 patch encoder, so it is
      not comparable with tile-encoder counts such as Virchow's 632M. The released
      checkpoint on HuggingFace reports a safetensors total of 158,866,176, which is a
      different scope -- that file also carries the text encoder and multimodal decoder used
      for zero-shot and report generation, and ships the patch encoder separately as
      conch_v1_5_pytorch_model.bin. The repo is gated, so its config.json and model card
      could not be read to confirm the split.
  # _source: PMC12618242 -- "TITAN and TITANV, with 48.5 million and 42.1 million
  # parameters, outperform heavier slide encoders PRISM and GigaPath, with 99.0 million and
  # 86.3 million parameters". Unchanged.
  params: 48.5M
  # Excludes the frozen CONCH v1.5 patch encoder -- see model.params_note.
  params_scope: slide enc.
  pretraining_short: iBOT → CoCa
  training_slides: 336K
  backbone: ViT slide encoder (Transformer-based Image and Text Alignment Network) over CONCH v1.5 patch features
  # _source: PMC12618242 -- "we apply the iBOT framework for vision-only pretraining of
  # TITAN on the 2D feature grid" (stage 1) and "we use contrastive captioners (CoCa) as the
  # pretraining strategy" (stages 2-3).
  # CHANGED from [self-supervised, contrastive, CLIP]: the paper's single CLIP mention is
  # about zero-shot inference ("we adopted the method described in CLIP to use the
  # similarities between a given slide and the text prompts"), not pretraining.
  pretraining: [self-supervised, iBOT, CoCa, contrastive]
  pretraining_detail: >-
    Three stages: iBOT self-supervised pretraining on a 2D grid of patch features, then
    CoCa alignment against synthetic ROI captions generated by the PathChat pathology
    copilot, then alignment against whole-slide pathology reports.
  data:
    description: Whole-slide images with paired pathology reports and synthetic captions
    scale:
      # _source: PMC12618242 -- "an internal dataset (termed Mass-340K) consisting of
      # 335,645 WSIs and 182,862 medical reports"
      whole_slide_images: 335645
      pathology_reports: 182862
      # _source: PMC12618242 -- "we pretrain TITANV with 423,122 pairs of 8,192 x 8,192
      # pixels ROIs and synthetic captions"
      synthetic_captions: 423122
  tasks: [classification, subtyping, retrieval, report generation, survival prediction]
  tasks_detail: >-
    Slide-level representation without fine-tuning, rare disease recognition, cancer
    outcome prediction and pathology report generation.
  modalities: [histopathology, text]
  # ALL FIVE ROWS REPLACED. The previous rows were the relative gains the running text
  # quotes; these are the absolute values from the supplementary tables, read from
  # SUPPL 41591_2025_3982_MOESM1_ESM.pdf (Supplementary Tables 1-127).
  # Fetched two ways with identical MD5 d4a3f8e4186b48a1a16fea1377a0b5b2: the EPMC
  # supplementaryFiles zip for PMC12618242, and
  # https://static-content.springer.com/esm/art%3A10.1038%2Fs41591-025-03982-3/MediaObjects/41591_2025_3982_MOESM1_ESM.pdf
  performance:
    # _source: SUPPL Supplementary Table 22 (linear probing, tumour subtype C = 32,
    # TCGA-UT-8K), logistic regression column: TITAN 0.832+/-0.0056, PRISM 0.774+/-0.0062.
    - benchmark: TCGA-UT-8K, linear probe tumour subtyping (32 classes)
      metric: balanced accuracy
      value: "0.832"
      note: logistic regression, +/- 0.0056; next-best slide encoder PRISM 0.774
    # _source: SUPPL Supplementary Table 24 (linear probing, OncoTree code C = 108, OT108).
    - benchmark: OT108, linear probe OncoTree classification (108 classes)
      metric: balanced accuracy
      value: "0.587"
      note: logistic regression, +/- 0.0103; next-best slide encoder PRISM 0.508
    # _source: SUPPL Supplementary Table 97 (zero-shot, tumour subtype C = 32, TCGA-UT-8K):
    # TITAN 0.761+/-0.0063 bal. acc., 0.989 AUROC; PRISM 0.536+/-0.0061.
    - benchmark: TCGA-UT-8K, zero-shot tumour subtyping (32 classes)
      metric: balanced accuracy
      value: "0.761"
      note: +/- 0.0063; AUROC 0.989; PRISM 0.536
    # _source: SUPPL Supplementary Table 117 (slide retrieval, rare cancer C = 43,
    # Rare-Cancer): TITAN Top-1 0.539+/-0.0100, Top-3 0.725, Top-5 0.804; PRISM Top-1 0.449.
    - benchmark: Rare-Cancer slide retrieval (43 rare types in a 186-class database)
      metric: Top-1 accuracy
      value: "0.539"
      note: +/- 0.0100; Top-5 0.804; next-best slide encoder PRISM 0.449
    # _source: SUPPL Supplementary Table 64 (disease-specific survival, c-index, six TCGA
    # cohorts), "Avg." row: TITAN 0.716, TITANV 0.711, CHIEF 0.691.
    - benchmark: Disease-specific survival, six TCGA cohorts
      metric: concordance index (mean over cohorts)
      value: "0.716"
      note: next-best model CHIEF 0.691, the +3.62% quoted in the running text
  verify:
    - >-
      Supplementary tables in this PDF are captioned BELOW the table, so "Supplementary
      Table N" is the block preceding the caption line, and a naive caption-then-table read
      shifts every result by one table. Established three ways: the EBRAINS class-prompt
      list sits above the Table 94 caption that names it; Table 64's c-index average
      (0.716 vs CHIEF 0.691) reproduces the running text's "+3.62%"; and Table 117's Acc@K
      and MVAcc@K columns reproduce the running text's "+14.8%" and "+18.1%" over PRISM.
      Anyone re-reading this supplement should re-check that mapping before quoting a number.
    - >-
      Absolute figures for the two headline gains the abstract leads with could not be
      pinned to a single table and were left out: the "+8.4%" linear-probe figure is an
      average over many subtyping tasks, and the "+56.52%" zero-shot figure is an average
      over several multiclass tasks. The per-task absolutes above are exact.
  added: {date: 2026-08, by: Leo Yin}
- date: 2025-11
  title: SMMILe enables accurate spatial quantification in digital pathology using multiple-instance learning
  url: https://www.nature.com/articles/s43018-025-01060-8
  doi: 10.1038/s43018-025-01060-8
  venue: Nat. Cancer
  authors:
    first:
      name: Zeyu Gao
      scholar: https://scholar.google.com/citations?hl=zh-CN&user=CeP6dkcAAAAJ
    last:
      name: Mireia Crispin-Ortuzar
      scholar: https://scholar.google.com/citations?hl=en&user=TRZzLJgAAAAJ
  model:
    name: SMMILe
    repo: https://github.com/ZeyuGaoAi/SMMILe
    # _source: PMC12727519 main text and SUPPL 43018_2025_1060_MOESM1_ESM.pdf sec. 7 +
    # Supplementary Table 10. Verified: 1.2M is the MIL head only.
    params_note: >-
      The paper reports SMMILe's own cost as "1.50 GFLOPS, 1.20 M parameters" for
      1,024-dimension patch embeddings; the frozen ResNet-50/CONCH patch encoder is
      not counted, so this is not comparable to a tile-encoder parameter count.
  # _source: PMC12727519 -- "SMMILe's compute cost (1.50 GFLOPS, 1.20 M parameters) for
  # 1,024-dimension patch embeddings was comparable to baselines such as ABMIL (0.71
  # GFLOPS, 0.79 M) and TransMIL (2.70 GFLOPS, 2.67 M)".
  # Corroborated by SUPPL Supplementary Table 10 ("SMMILe 1.50 1.20M 18.30MB") and by
  # supplementary sec. 7 "Computational Cost", which states the same figures in prose and
  # confirms the exclusion: the comparison is against the ABMIL and TransMIL heads at a
  # fixed patch embedding dimension of 1024. AGREE. Unchanged.
  params: 1.2M
  # Excludes the frozen ResNet-50/CONCH patch encoder -- see model.params_note.
  params_scope: MIL head
  pretraining_short: none — frozen ResNet-50 / CONCH
  # The 3,850 slides are the whole benchmark; SMMILe is trained and tested on them
  # under cross-validation, so this is not a held-out pretraining corpus.
  training_slides: 3.9K (cross-validated)
  backbone: >-
    ResNet-50 and CONCH patch encoders with an instance-based multiple-instance-learning
    architecture using superpatch and refinement modules
  pretraining: [weakly supervised]
  pretraining_detail: >-
    Feature extraction with pretrained encoders (ImageNet ResNet-50, pathology
    foundation model CONCH), then weakly supervised MIL training with slide-level labels.
  data:
    description: 8 datasets covering 6 cancer types
    scale:
      # _source: EPMC abstract (PMID 41258398) -- "evaluate it across 6 cancer types, 3
      # highly diverse classification tasks and 8 datasets involving 3,850 whole-slide
      # images". All three unchanged, now verified.
      whole_slide_images: 3850
      datasets: 8
      cancer_types: 6
  tasks: [classification, detection, subtyping, grading]
  tasks_detail: >-
    WSI-level classification and patch-level spatial quantification, including metastasis
    detection, subtype prediction and grading.
  modalities: [histopathology]
  performance:
    # _source (rows 1-3): PMC12727519 -- "SMMILe achieves AUC scores of 94.11%, 90.92% and
    # 92.75% on the Ovarian, Prostate and Gastric Endoscopy datasets, respectively,
    # exceeding the second-best methods by margins of 2.20%, 2.90% and 11.18%".
    # Corroborated value-by-value against SUPPL Supplementary Table 2 (WSI classification,
    # macro AUC %, ResNet-50 block), which also supplies the standard deviations. AGREE.
    - benchmark: Ovarian (UBC-OCEAN)
      metric: macro AUC
      value: "94.11%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings; +/- 1.13, second-best +2.20
    - benchmark: Prostate
      metric: macro AUC
      value: "90.92%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings; +/- 2.68, second-best +2.90
    - benchmark: Gastric Endoscopy (IH-ESD)
      metric: macro AUC
      value: "92.75%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings; +/- 3.59, second-best +11.18
    # _source: SUPPL Supplementary Table 6 (spatial quantification, macro F1 %, ResNet-50
    # block, Breast row): SMMILe 66.47+/-10.21, DSMIL 42.91+/-19.53.
    # CHANGED from the relative row "+23.56%": the main text's claim that SMMILe
    # "outperforms DSMIL by 23.56% in spatial F1 score" is exactly 66.47 - 42.91, which both
    # identifies the table and corroborates the absolute pair.
    - benchmark: Breast (Camelyon16), spatial quantification
      metric: spatial macro F1
      value: "66.47%"
      note: >-
        ImageNet ResNet-50 patch embeddings; +/- 10.21, second-best method DSMIL 42.91%,
        the 23.56-point gap quoted in the running text
  verify:
    - >-
      Supplementary tables in this PDF are captioned BELOW the table, so "Supplementary
      Table N" is the block preceding the caption line. Confirmed here by the spatial F1
      row: the main text's 23.56-point gap equals 66.47 - 42.91 in the block above the
      Table 6 caption.
  added: {date: 2026-08, by: Leo Yin}
- date: 2025-07
  title: Real-world deployment of a fine-tuned pathology foundation model for lung cancer biomarker detection
  # _source: bibliographic fields from scripts/fetch_meta.py (Crossref). The month is
  #          the 9 July 2025 advance publication; the print issue is Nat Med 31(9):
  #          3002-3010 (September), which is deliberately not used here.
  url: https://www.nature.com/articles/s41591-025-03780-x
  doi: 10.1038/s41591-025-03780-x
  venue: Nat. Med.
  authors:
    first:
      name: Gabriele Campanella
      # _source: no Google Scholar profile is registered in the author's own ORCID
      #          record, 0000-0001-6299-1311 (researcher-urls is empty; the record does
      #          confirm the name). Left null rather than guessed -- see the verify note.
      scholar: null
    last:
      name: Chad Vanderbilt
      # _source: no Google Scholar profile is registered in the author's own ORCID
      #          record, 0000-0002-8114-0237 (researcher-urls is empty; the record does
      #          confirm the name). Left null rather than guessed -- see the verify note.
      scholar: null
  model:
    # _source: Results, "Silent trial supports the clinical use of EAGLE"; the authors
    #          name the deployed model EAGLE throughout, and both released artifacts
    #          carry that name.
    name: EAGLE
    # _source: article Code availability -- "Code used in this work is available via
    #          GitHub at https://github.com/chadvanderbilt/EAGLE". The account is the
    #          last author's own, and the repository README opens with this paper's
    #          full citation, so it is the authors' own artifact.
    repo: https://github.com/chadvanderbilt/EAGLE
    # _source: article Data availability -- "Model checkpoints are publicly available
    #          via HuggingFace at https://huggingface.co/MCCPBR/EAGLE". The repo holds
    #          tile_model.pth (13.6 GB) and slide_model.pth (17.4 MB).
    weights: https://huggingface.co/MCCPBR/EAGLE
    # _source: https://huggingface.co/api/models/MCCPBR/EAGLE -> cardData.license, the
    #          licence on the checkpoints the paper points to. Note the GitHub repo is
    #          under a separate custom MSK "EAGLE Terms of Use" (academic and
    #          non-commercial, no redistribution), which GitHub reports as NOASSERTION.
    license: CC-BY-NC-SA-4.0
  # _source: Methods, "EAGLE-EGFR prediction model" -- "The proposed model consists of
  #          (1) a 1.1-billion-parameter vision transformer (ViT-g) that encodes
  #          high-resolution (20x magnification, 0.5 um per pixel) 224-pixel patches
  #          into a 1,536-feature vector". The authors' own model card repeats it and
  #          names the component: "a 1.1 billion parameter vision transformer (ViT-g)
  #          ... The tile encoder was initialized with GigaPath". This is the authors'
  #          figure for the encoder they fine-tuned in this paper, not a number carried
  #          across from the Prov-GigaPath paper. No total for the full stack is stated.
  params: 1.1B
  params_scope: tile enc.
  pretraining_short: none — Prov-GigaPath, fine-tuned
  # The MSKCC training split only. The 1,742-slide validation set, the 765-slide
  # threshold-calibration set, the 1,484 external slides and the 315 slides scored in
  # the prospective silent trial are all held out and live in data.scale.
  training_slides: 5.17K
  # _source: Methods as quoted above, plus the authors' repository README -- "We
  #          fine-tuned the tile-level encoder of Prov-GigaPath and used Gated MIL
  #          attention (Ilse et al. 2019) as slide-level aggregator to predict EGFR
  #          mutational status in lung adenocarcinoma."
  backbone: >-
    Prov-GigaPath ViT-g tile encoder (1.1B), fine-tuned end to end rather than frozen,
    embedding 224-pixel patches at 20x / 0.5 microns per pixel into 1,536 features; a
    gated multiple-instance-learning attention aggregator pools every patch in a slide
    into one slide-level representation, and a linear classifier outputs the probability
    of an EGFR mutation
  pretraining: [weakly supervised]
  # _source: Methods, "EAGLE-EGFR prediction model" -- "During training, the encoder was
  #          initialized with Prov-GigaPath, a public state-of-the-art pathology
  #          foundation model. The full model was then trained end to end using the
  #          parallelization strategy described by Campanella et al. ... For each slide,
  #          6,624 tissue patches were sampled at each training step and divided across
  #          23 GPUs for encoding (96 patches per GPU) ... the model was trained on 24
  #          NVIDIA H100-80GB GPUs for 20 epochs in around 9.28 h."
  pretraining_detail: >-
    This work pre-trains nothing of its own. The tile encoder is initialized from the
    public Prov-GigaPath pathology foundation model, and the whole stack -- encoder,
    gated MIL attention aggregator and linear classifier -- is then trained end to end
    from slide-level EGFR mutation labels alone, with no patch-level annotation. Encoding
    is sharded across 23 GPUs in 16-bit precision so the encoder can be optimized jointly
    with the aggregator; 6,624 patches are sampled per slide per step, 20 epochs on 24
    NVIDIA H100-80GB GPUs in about 9.28 h. Inference runs on a single GPU.
  data:
    # _source: abstract -- "we assembled a large international clinical dataset of
    #          digital lung adenocarcinoma slides (N = 8,461)"; Methods, "Whole-slide
    #          images and sequencing datasets" for the per-cohort composition, assays
    #          and scanners.
    description: >-
      H&E whole-slide images of lung adenocarcinoma from four clinical cohorts -- MSKCC
      (training, validation, threshold calibration and the prospective silent trial),
      Mount Sinai Health System, Sahlgrenska University Hospital and the Technical
      University of Munich -- plus public TCGA-LUAD for external testing. Every slide is
      paired with targeted-NGS ground truth for EGFR: MSK-IMPACT at MSKCC, Oncomine
      Comprehensive v3 at MSHS, Oncomine Focus at SUH, TruSight Oncology 500 at TUM, and
      TCGA whole-exome calls clinically annotated through OncoKB. Slides were digitized
      on Aperio AT2 and GT450, Philips Ultrafast, Pramana and Hamamatsu NanoZoomer S210
      scanners, so scanner variability is part of the evaluation.
    # _source: abstract for the 8,461 total; Methods, "MSKCC" -- "divided into the
    #          training dataset (4,867 patients, 5,174 slides), validation dataset
    #          (1,640 patients, 1,742 slides), dataset for calibrating clinical threshold
    #          (764 patients, 765 slides, 397 primary) and the slides processed in real
    #          time for the silent trial (315 patients or slides, 197 primary)"; Results,
    #          "External validation is consistent with internal results" -- "an overall
    #          AUC of 0.870 on 1,484 slides".
    scale:
      whole_slide_images: 8461
      training_slides: 5174
      training_patients: 4867
      internal_validation_slides: 1742
      external_validation_slides: 1484
      threshold_calibration_slides: 765
      prospective_silent_trial_slides: 315
      prospective_silent_trial_primary_slides: 197
  tasks: [biomarker prediction, mutation prediction]
  # _source: Results and Methods, "Real-time EGFR prediction clinical pipeline" -- the
  #          IRT pipeline runs two hourly watcher applications that detect newly scanned
  #          LUAD slides whose block was sent for molecular testing, transfer them to GPU
  #          infrastructure and score them immediately; "The assisted workflow was
  #          deployed IRT starting in May 2024 as part of a silent trial that lasted 4
  #          months, from May to August 2024."
  tasks_detail: >-
    Binary prediction of EGFR mutation status in lung adenocarcinoma directly from an H&E
    whole-slide image, against targeted sequencing as ground truth. Validated
    retrospectively at MSKCC, then externally across three hospitals, five scanner models
    and TCGA, with stratifications by primary versus metastatic site, tissue area, EGFR
    variant class and slide artifact. Deployed in a 4-month prospective silent trial at
    MSKCC (May-August 2024) in which slides were picked up automatically on an hourly
    cadence and scored in real time beside the Idylla PCR rapid test. The score drives an
    AI-assisted screening workflow: below a tuned NPV threshold or above a tuned PPV
    threshold the sample skips rapid testing, otherwise the rapid test confirms it.
  modalities: [histopathology]
  performance:
    # _source: all five rows from the published full text, read both via Europe PMC
    #          (PMC12443599 fullTextXML) and via nature.com, which agree. Row 1 =
    #          Results, "Fine-tuning foundation model performance": "The performance of
    #          the trained model was assessed on the internal validation set that
    #          includes 1,742 slides. Overall, the model achieved an AUC of 0.847 ...
    #          Model performance is more accurate in primary samples (AUC 0.90) than in
    #          metastatic specimens (AUC 0.75)."
    - benchmark: MSKCC internal retrospective validation (1,742 slides)
      metric: AUC
      value: "0.847"
      note: 0.90 on primary samples against 0.75 on metastatic specimens
    # _source: Results, "External validation is consistent with internal results": "an
    #          overall AUC of 0.870 on 1,484 slides ... The MSHS cohort showed AUCs of
    #          0.870 (N = 294), 0.877 (N = 241) and 0.884 (N = 259) ... On the SUH cohort
    #          the model achieved an AUC of 0.772 (N = 95), whereas on the TUM cohort the
    #          model achieved an AUC of 0.808 (N = 76). Finally, on the full TCGA cohort,
    #          the AUC was 0.860 (N = 519)."
    - benchmark: External retrospective validation, three hospitals plus TCGA (1,484 slides)
      metric: AUC
      value: "0.870"
      note: >-
        MSHS 0.870 / 0.877 / 0.884 on Philips Ultrafast, Aperio GT450 and Pramana scans
        of the same slides; SUH 0.772; TUM 0.808; TCGA-LUAD 0.860, rising to 0.918 once
        slides with morphology-obscuring artifacts are dropped
    # _source: Results, "Silent trial supports the clinical use of EAGLE": "On the
    #          samples analyzed (N = 197), EAGLE obtained an AUC of 0.890 using the final
    #          MSK-IMPACT results as the ground truth"; and, for the pretrial figure,
    #          "model performance is higher in primary samples (N = 374, AUC 0.896)".
    - benchmark: Prospective silent trial, MSKCC primary samples, May-August 2024 (N = 197)
      metric: AUC
      value: "0.890"
      note: >-
        MSK-IMPACT as ground truth; the retrospective pretrial primary cohort (N = 374)
        gave 0.896, and the full pretrial cohort (N = 765) 0.853
    # _source: Results, "Silent trial supports the clinical use of EAGLE": "In the most
    #          stringent setting, the assisted workflow achieved an NPV, PPV and rapid
    #          test reduction of 0.971, 1.0 and 18% respectively. In the least stringent
    #          setting, these metrics were equal to 0.963, 0.984 and 43%." Confirmed
    #          against Table 1 (silent trial rows, thresholds 0.004/0.999 and
    #          0.038/0.995).
    - benchmark: AI-assisted EGFR screening workflow, silent trial (least stringent thresholds)
      metric: rapid-test reduction / NPV / PPV
      value: "43% / 0.963 / 0.984"
      note: >-
        the most stringent operating point gives 18% / 0.971 / 1.000; both threshold
        pairs were fixed on the pretrial cohort, not on the trial cohort, and both sit
        inside the non-inferiority region for the Idylla rapid test
    # _source: Results, "Silent trial supports the clinical use of EAGLE": "We observed
    #          that EAGLE results are available with a median TAT from the time of
    #          molecular accession of 0.74 h (44 min), while Idylla has a median TAT of
    #          48.78 h and MSK-IMPACT has a median TAT of 435.26 h."
    - benchmark: Median turnaround time from molecular accession, silent trial
      metric: hours
      value: "0.74 vs 48.78 vs 435.26"
      note: >-
        EAGLE 0.74 h (44 min), Idylla PCR rapid test 48.78 h, MSK-IMPACT NGS 435.26 h.
        Methods report a median 68 s to process one slide on a single RTX 3090.
  verify:
    - >-
      params 1.1B covers the ViT-g tile encoder only, which is why params_scope is set.
      The authors state the figure twice -- in this paper's Methods and on their own
      HuggingFace model card, which calls it "the tile encoder" -- so it is not carried
      across from the Prov-GigaPath paper. Neither source gives a total for the released
      stack (tile encoder plus gated MIL attention aggregator plus linear classifier).
      Do not add the aggregator in, and do not infer a count from the 13.6 GB
      tile_model.pth checkpoint.
    - >-
      authors.first.scholar and authors.last.scholar left null. Both ORCID records
      (0000-0001-6299-1311 Campanella, 0000-0002-8114-0237 Vanderbilt) confirm the names
      but register no researcher-urls at all, so there was no author-controlled link to
      a Scholar profile to verify against. Not guessed.
    - >-
      The authors' HuggingFace model card, last modified 2025-05-10 and therefore
      predating publication, quotes a silent-trial AUC of 0.896. The published paper
      reports 0.890 for the prospective silent trial (N = 197) and 0.896 for the
      retrospective pretrial primary cohort (N = 374). The published figures are the ones
      recorded here.
    - >-
      Two different licences cover the two artifacts: the HuggingFace checkpoints are
      CC-BY-NC-SA-4.0 (recorded in model.license) while the GitHub repository ships a
      custom MSK "EAGLE Terms of Use" restricting use to academic and non-commercial
      work and forbidding redistribution. Anyone reusing the code should read the repo
      terms rather than assume the weights licence applies.
    - >-
      All five access routes in add-paper.md were worked and four returned content.
      (1) nature.com with a browser User-Agent served the complete open-access article,
      Results and Methods included. (2) Springer supplements MOESM1 (Supplementary
      Information, read with pdftotext) and MOESM2 downloaded; MOESM3 and MOESM4 return
      403 and do not exist. The supplement carries cohort demographics and the
      per-stratification tables but states no parameter count. (3) Europe PMC returned
      isOpenAccess Y with a full-text deposit at PMC12443599, whose fullTextXML supplied
      Methods and Table 1; every headline number was cross-checked against the nature.com
      copy and the two agree. (4) The authors' own GitHub repo and HuggingFace model card
      were both read and are named in the paper's Code and Data availability sections.
      (5) OpenAlex and Semantic Scholar list only the published version plus the PMC
      deposit -- there is no medRxiv, bioRxiv or arXiv preprint of this paper, so nothing
      here is read off a preprint.
