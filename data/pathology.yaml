# Pathology -- histopathology, whole-slide imaging and computational pathology.
#
# Source of truth for pathology.md. After editing, run:
#     python scripts/build.py
# CI will reject the PR if the generated markdown is out of date.
#
# Field reference: CONTRIBUTING.md

- date: 2026-07
  title: End-to-end multimodal pathology foundation model with clinical dialogue
  url: https://www.nature.com/articles/s41591-026-04521-4
  doi: 10.1038/s41591-026-04521-4
  venue: Nat. Med.
  authors:
    first:
      name: Eugene Vorontsov
      scholar: https://scholar.google.com/citations?user=5o1gS_sAAAAJ&hl=en
    last:
      name: Siqi Liu
      scholar: https://scholar.google.com/citations?hl=en&user=ADyo_cAAAAAJ
  model:
    name: PRISM2
    weights: https://huggingface.co/paige-ai/Prism2
    # _source: https://huggingface.co/api/models/paige-ai/Prism2 -> cardData.license
    #          (same value on paige-ai/Prism2-survival); the paper's Code availability
    #          section names both Hugging Face repos as the official weight release.
    license: CC-BY-NC-ND-4.0
  # _source: https://www.nature.com/articles/s41591-026-04521-4 (Discussion, OA full
  #          text): "It is the largest model (4.6 billion parameters) trained on the
  #          most comprehensive dataset to date". CONFIRMED -- was previously flagged
  #          UNCONFIRMED. See the verify note for the second-source disagreement.
  params: 4.6B
  # _source: https://www.nature.com/articles/s41591-026-04521-4 (Methods, "Model
  #          architecture"): perceiver slide encoder (one cross-attention block +
  #          six self-attention layers, 256 latent queries) 541M params, attention
  #          pooler 79M, two-layer MLP adapter 29M, Phi-3 Mini "a 3.8-bilion-parameter
  #          decoder-only LLM", BioGPT as the contrastive language encoder, Virchow2
  #          tile embeddings at 0.5 microns-per-pixel.
  backbone: >-
    Virchow2 tile encoder, Perceiver slide encoder (541M, plus a 79M attention pooler),
    BioGPT language encoder and a Phi-3 Mini 3.8B decoder-only LLM reached through a
    29M-parameter MLP adapter
  pretraining: [contrastive, next-token prediction]
  # _source: https://www.nature.com/articles/s41591-026-04521-4 (Methods, "Training"):
  #          stage 1 updates slide encoder, attention pooler, LLM adapter and BioGPT
  #          with Phi-3 Mini frozen; stage 2 discards the contrastive objective, freezes
  #          the slide encoder and fine-tunes the LLM adapter and Phi-3 Mini.
  pretraining_detail: >-
    Two-stage language-supervised multimodal pre-training: contrastive slide-report
    alignment against BioGPT text embeddings plus an autoregressive dialogue objective,
    then a second stage in which the contrastive objective is dropped, the slide encoder
    is frozen and Phi-3 Mini is fine-tuned. Trained on 56 A100 40GB GPUs in bf16.
  data:
    description: H&E whole-slide images with paired clinical reports, converted into question-answer pairs
    # _source: https://www.nature.com/articles/s41591-026-04521-4 (Methods, "Data"):
    #          "The training data comprise 685,507 specimens collected from 200,692
    #          patients ... totaling 685,507 reports and 2,350,518 slides"; and
    #          (Methods, "Dialogue data"): "we create 685,000 report rewrites for as
    #          many specimens and 14 million question-answer pairs". All four existing
    #          counts verified exactly against the published Methods.
    scale:
      whole_slide_images: 2350518
      specimens: 685507
      patients: 200692
      qa_pairs: 14000000
  # _source: `grading` and `question answering` added -- Fig. 4a evaluates PANDA-SI /
  #          PANDA-MI prostate grading and IMP-CRS colorectal grading, and prompt-based
  #          inference is literally yes/no and multiple-choice question answering
  #          (https://www.nature.com/articles/s41591-026-04521-4, Results).
  tasks: [detection, subtyping, grading, biomarker prediction, survival prediction, question answering, report generation]
  tasks_detail: >-
    Prompt-based cancer detection and subtyping via yes/no and multiple-choice question
    answering; diagnostic, biomarker and survival prediction by linear probing on the
    base and diagnostic embeddings; staging and grading on external public data;
    pathology report completion following CAP guidelines.
  modalities: [histopathology, text]
  performance:
    # _source: all five rows from https://www.nature.com/articles/s41591-026-04521-4
    #          (Results, OA full text). Row 1 = "For pan-cancer detection, PRISM2
    #          diagnostic embeddings (0.967 AUC) substantially outperform both PRISM2
    #          base (0.956 AUC) and all other embeddings (0.947 AUC with PRISM, 0.931
    #          AUC with TITAN)."
    - benchmark: MSK pan-cancer detection (linear probing)
      metric: AUC
      value: "0.967"
      note: >-
        diagnostic embedding; 0.956 with the base embedding, 0.947 with PRISM and 0.931
        with TITAN. Drop on rare cancers is modest, 0.967 to 0.957.
    # _source: "PRISM2 survival embeddings outperform the survival specialist model
    #          (Fig. 4b), especially for MSK CRC RFS (0.809 versus 0.773 concordance
    #          index (C-index))."
    - benchmark: MSK colorectal cancer recurrence-free survival
      metric: C-index
      value: "0.809"
      note: >-
        PRISM2 survival embeddings, versus 0.773 for a survival specialist model trained
        from scratch on the same 225,597-case survival dataset
    # _source: "with PRISM2 diagnostic and base (0.881 and 0.888) significantly
    #          (P < 0.05) outperforming PRISM (0.852) and TITAN (0.641)."
    - benchmark: CAMELYON17 tumour staging (external, five-fold across source institutions)
      metric: quadratic weighted kappa
      value: "0.888 / 0.881"
      note: base / diagnostic embeddings, versus 0.852 for PRISM and 0.641 for TITAN
    # _source: "PRISM2 diagnostic embeddings significantly (P < 0.05) outperformed all
    #          other embeddings, achieving 0.862 quadratic weighted (compared to 0.836
    #          with base, 0.841 with PRISM and 0.750 with TITAN)."
    - benchmark: PANDA-SI prostate cancer grading (external, cross-institution transfer)
      metric: quadratic weighted kappa
      value: "0.862"
      note: diagnostic embedding; 0.836 base, 0.841 PRISM, 0.750 TITAN
    # _source: "average AUCs on MSK TCGA tasks are highest for PRISM2 base embeddings,
    #          the next-best-performing models are close: 0.846 (versus 0.854) AUC with
    #          COBRA on MSK and 0.781 (versus 0.784) AUC on TCGA with TITAN."
    - benchmark: Biomarker prediction, 10 tissue-specific MSK datasets (linear probing)
      metric: mean AUC
      value: "0.854"
      note: >-
        PRISM2 base embedding; next best is COBRA at 0.846. On the seven overlapping
        TCGA biomarkers PRISM2 base reaches 0.784 against 0.781 for TITAN.
  verify:
    - >-
      params 4.6B is the paper's own figure, quoted in the Discussion and consistent
      with the per-component counts in the Methods. The authors' released checkpoint
      totals 4.47B because it omits training-only components; the paper's figure is
      the one recorded.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-04
  title: PRET is a few-shot system for pan-cancer recognition without example training
  url: https://www.nature.com/articles/s43018-026-01141-2
  doi: 10.1038/s43018-026-01141-2
  venue: Nat. Cancer
  authors:
    first:
      name: Yi Li
      scholar: https://scholar.google.com/citations?user=qGsK180AAAAJ&hl=en
    last:
      name: Xiaomeng Li
      scholar: https://scholar.google.com/citations?user=uVTzPpoAAAAJ&hl=en
  model:
    name: PRET
    repo: https://github.com/xmed-lab/PRET
    # _source: https://www.nature.com/articles/s43018-026-01141-2 (Code availability,
    #          free on the paywalled page): "All the involved model weights and Python
    #          packages are available online. Our work is publicly available from GitHub".
    #          The GitHub README names the Hugging Face mirror as the original release
    #          ("This repo is originally relased at (HF Code)"), and that repo carries
    #          model.pth. License from https://huggingface.co/api/models/yili7eli/PRET
    #          cardData.license and the Apache-2.0 block at the end of the README.
    weights: https://huggingface.co/yili7eli/PRET
    license: Apache-2.0
  # params: deliberately absent. No source states a count -- see the verify note.
  # _source: PRET Supplementary Information PDF, "Algorithms of PRET / Feature extractor
  #          based on pathological foundation models" (43018_2026_1141_MOESM1_ESM.pdf,
  #          linked from the article page): "the default foundation model proposed by
  #          Zhang et al. is trained via DINO in a self-supervised manner on TCGA without
  #          labels using the backbone network of ViT-S/8". Six components confirmed by
  #          Extended Data Fig. 1a: "extractor, tagger, miner, classifier, aggregator,
  #          and post processor".
  backbone: >-
    Default feature extractor is a DINO-pretrained ViT-S/8 pathology encoder; PRET adds
    an in-context tagger, in-context classifier, instance miner, attention aggregator
    and postprocessor
  pretraining: [DINO, self-supervised]
  # _source: same Supplementary Information section -- "we do not fine-tune these
  #          parameters, since fixed parameters ensure that the model is flexible".
  #          Extendable to UNI, GPFM, CONCH, TITAN, mSTAR and Prov-GigaPath (Fig. 2e).
  pretraining_detail: >-
    Training-free for downstream tasks; the feature extractor holds all model parameters
    and is never fine-tuned. The default encoder was pretrained self-supervised with DINO
    on unlabelled TCGA pathology images, and the framework also runs on UNI, GPFM, CONCH,
    TITAN, mSTAR and Prov-GigaPath.
  data:
    description: >-
      No task-specific training images for PRET itself. Evaluated on 4,484 WSIs across
      23 benchmarks. The paper does not state a numeric TCGA pretraining image count for
      the default encoder.
    scale:
      evaluation_wsi: 4484
      benchmarks: 23
  tasks: [detection, subtyping, segmentation, classification]
  tasks_detail: Cancer screening, cancer subtyping, tumour segmentation, lymph node metastasis detection.
  modalities: [histopathology]
  performance:
    # _source rows 1-3: published abstract, https://www.nature.com/articles/s43018-026-01141-2
    #          (also PMID 41933183 via Europe PMC). Full text is paywalled; these are the
    #          numbers the authors lead with and the only ones stated outside figures.
    - benchmark: 23 international benchmarks (4,484 WSIs)
      metric: AUC
      value: ">97%"
      note: reached on 15 of the 23 benchmarks; PRET outperforms existing approaches across 20 tasks
    - benchmark: 23 international benchmarks (4,484 WSIs)
      metric: maximum improvement over existing approaches
      value: "36.76%"
      note: abstract does not state which metric the improvement is measured in
    - benchmark: Lymph node metastasis detection, 8 slide examples
      metric: comparison against pathologists
      value: "outperforms 11 pathologists"
      note: >-
        abstract calls this clinical-grade diagnostic performance but gives no underlying
        AUC; the per-benchmark figures live in Figs. 4 and 5, which are behind the paywall
    # _source: PRET Supplementary Table 2 ("Slide label visual prompt for pan-cancer
    #          screening and subtyping tasks with multiple metrics"),
    #          43018_2026_1141_MOESM1_ESM.pdf. 8-shot Average row: PRET 93.8+-1.9 AUC,
    #          MI-SimpleShot 90.9+-2.2, KNN-Mean 90.9+-2.4, KNN-Max 83.5+-5.4,
    #          MI-Prototype 64.1+-7.8.
    - benchmark: Pan-cancer screening and subtyping, 11 datasets, slide-label prompt, 8-shot
      metric: mean AUC
      value: "93.8% (+-1.9)"
      note: >-
        Supplementary Table 2, mean over ESCC, PTC, CRC, GC, LC, BC, lymphoma, ESCA, SARC,
        RCC and NSCLC; best baselines MI-SimpleShot and KNN-Mean both reach 90.9%
  verify:
    - >-
      params not published. The free Supplementary Information was read in full and
      states no count; the Methods are paywalled, there is no PMC deposit, no preprint,
      and the repo and gated HuggingFace release expose only an architecture name.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-03
  title: Confounding factors and biases abound when predicting molecular biomarkers from histological images
  url: https://www.nature.com/articles/s41551-026-01616-8
  doi: 10.1038/s41551-026-01616-8
  venue: Nat. Biomed. Eng.
  authors:
    first:
      name: Muhammad Dawood
      scholar: https://scholar.google.com/citations?hl=en&user=a-szm64AAAAJ
    last:
      name: Fayyaz ul Amir Afsar Minhas
      scholar: https://scholar.google.com/citations?hl=en&user=cQ6eO_kAAAAJ
  model:
    name: HistBiases
    repo: https://github.com/imuhdawood/HistBiases
  # params: correctly absent. Confirmed by full-text search -- see the verify note.
  backbone: >-
    Benchmarking study rather than a new model. Evaluates CLAM, SlideGraph-infinity and
    TITAN, with CTransPath and ShuffleNet patch encoders.
  pretraining: [self-supervised, weakly supervised]
  # _source: https://www.nature.com/articles/s41551-026-01616-8 (Results and Methods, OA
  #          full text): "ShuffleNet pretrained on ImageNet as a patch-level encoder to
  #          extract the 1,024-dimensional feature representation"; "a 768-dimensional
  #          self-supervised feature representation ... using CTransPath (a transformer-based
  #          self-supervised model trained on histology images)".
  pretraining_detail: >-
    CTransPath pretrained on histology via self-supervised learning, giving 768-dimensional
    patch features; ShuffleNet pretrained on ImageNet, giving 1,024-dimensional patch
    features; TITAN trained on 330,000 image-text pairs.
  data:
    # _source: same article, Discussion: "significant interdependencies among molecular
    #          factors across tissue types and datasets (TCGA, METABRIC, MSK and DFCI)";
    #          Results: "we retrospectively analysed n = 8,221 patients with breast cancer
    #          (BRCA), colorectal cancer (CRC), endometrial cancer (UCEC) and lung cancer
    #          across four cohorts". Both existing values verified verbatim.
    description: >-
      H&E WSIs from TCGA, METABRIC, MSK and DFCI. Weakly supervised models trained on
      TCGA and validated on CPTAC and ABCTB.
    scale:
      patients: 8221
  tasks: [biomarker prediction, mutation prediction, benchmarking]
  tasks_detail: >-
    Molecular biomarker and gene mutation prediction from WSIs, plus a
    confounding/stratification analysis against biomarker interdependency, grade and TMB.
  modalities: [histopathology]
  performance:
    # _source rows 1-4: https://www.nature.com/articles/s41551-026-01616-8, OA full text.
    # Row 1: "In BRCA, CLAM with CTransPath features predicts receptor status with average
    #        AUROCs of 0.87 and 0.90 for ER and 0.79 and 0.78 for PR, in cross-validation
    #        (TCGA-BRCA) and independent validation (ABCTB) cohorts, respectively."
    - benchmark: TCGA-BRCA (cross-validation) and ABCTB (independent validation)
      metric: AUROC, ER status
      value: "0.87 / 0.90"
      note: CLAM with CTransPath features; the same models reach 0.79 / 0.78 for PR
    # Row 2: "SlideGraph-infinity predicts colorectal tumours' MSI status ... with an AUROC
    #        of 0.88 (0.873-0.886). However, when the same patient set is divided into
    #        hypermutated and non-hypermutated subgroups ... the AUROC for MSI status
    #        prediction drops to 0.72 within each subgroup."
    - benchmark: TCGA-CRC, MSI status
      metric: AUROC, whole cohort vs stratified subgroups
      value: "0.88 -> 0.72"
      note: >-
        SlideGraph-infinity; 0.88 (0.873-0.886) over the whole cohort falls to 0.72
        within both the hypermutated and the non-hypermutated subgroup
    # Row 3: "In BRCA, grade-based ER and PR classifiers achieved AUROCs of 0.76 and 0.70
    #        in the TCGA-BRCA cohort and 0.79 and 0.71 in the ABCTB cohort ... Grade also
    #        predicts TP53 mutations with an AUROC of 0.75, nearly matching the 0.81
    #        achieved by weakly supervised ML models." Fig. 6 caption confirms the
    #        classifier is "a support vector machine classifier trained to predict a
    #        biomarker/gene mutation from one-hot encoded histological grades".
    - benchmark: TCGA-BRCA, grade-only baseline
      metric: AUROC
      value: "ER 0.76, PR 0.70, TP53 0.75"
      note: >-
        SVM on one-hot pathologist-assigned grade; the weakly supervised TP53 predictor
        reaches only 0.81, so the added value of the ML model is modest. ABCTB gives
        0.79 for ER and 0.71 for PR.
    # Row 4 REPLACES the previous "TCGA-BRCA, PR status stratified by CDH1 / 0.79 -> 0.50"
    #        row, which is not supported anywhere in the full text -- see the verify note.
    # _source: "WSI-based models infer BRAF and TP53 mutations in colorectal tumours
    #          (TCGA-CRC) from WSIs with high confidence, achieving AUROCs 0.774
    #          (0.764-0.785) and 0.717 (0.711-0.722) ... the TP53 predictor AUROC drops to
    #          0.50 for high TMB cases."
    - benchmark: TCGA-CRC, TP53 mutation stratified by tumour mutational burden
      metric: AUROC, whole cohort vs high-TMB subgroup
      value: "0.717 -> 0.50"
      note: >-
        0.717 (0.711-0.722) over the cohort falls to chance in high-TMB cases; the BRAF
        predictor falls from 0.774 (0.764-0.785) to 0.65 in low-TMB cases
  note: Benchmarking and bias study, not a new foundation model.
  verify:
    - >-
      params correctly absent: this is a benchmarking study and the word "parameter"
      does not occur in the full text, the Supplementary Information, the figures or
      the Peer Review File. It reports feature dimensions, never model sizes.
    - >-
      a previous record carried a row reading "PR status stratified by CDH1, 0.79 ->
      0.50". It conflated two results -- the paper names CDH1 only for the ER
      predictor, and that 0.50 belongs to TP53 under TMB stratification. Removed and
      replaced with the sourced version.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-02
  title: >-
    Classification accuracy of a hierarchical molecular inference-based deep-learning
    system for CNS tumour diagnosis: a multi-institutional, retrospective study
  url: https://www.thelancet.com/journals/lanonc/article/PIIS1470-2045(25)00661-8/abstract
  doi: 10.1016/S1470-2045(25)00661-8
  venue: Lancet Oncol.
  authors:
    first: {name: H. Lalchungnunga}
    last: {name: Kenneth Aldape}
  model:
    name: Neuropath-AI
    weights: https://methylscape.ccr.cancer.gov/
  # params: deliberately absent. No source states a count -- see the verify note.
  # _source: this line has been rewritten to only what is sourced. Published abstract
  #          (PMID 41643698, Europe PMC): the model was "trained ... to infer molecular
  #          features from whole slide images and to use these to predict tumour types
  #          with associated confidence scores", against reference labels "determined by
  #          DNA methylation-based tumour classification to match one of 52 tumour types".
  #          Authors' own SNO 2025 abstract (PMC12601992, open in PMC): "We trained
  #          pan-CNS tumor models to predict DNA methylation and gene expression from
  #          whole-slide images (WSIs). These molecular predictions were then used in a
  #          hierarchical machine learning framework, termed Neuropath-AI, to predict nine
  #          broad tumor families and 52 tumor types". The previous record's "UNI large
  #          vision transformer plus MLPs and ensemble classifiers (random forest, SVM,
  #          KNN, logistic regression)" could not be confirmed -- see the verify note.
  backbone: >-
    Hierarchical molecular inference: deep-learning models predict DNA methylation and
    gene expression from H&E whole-slide images, and a hierarchical classifier maps those
    predictions to nine tumour families and 52 terminal CNS tumour types
  pretraining: [self-supervised]
  pretraining_detail: >-
    WSI-pretrained encoder followed by molecular inference-based hierarchical
    classification.
  data:
    # _source: published abstract (PMID 41643698): "The Neuropath-AI model was trained on
    #          5835 samples from the National Cancer Institute (NCI; USA), the Children's
    #          Brain Tumor Network (USA), and the Digital Brain Tumour Atlas (Austria)";
    #          "The test cohort comprised 5516 samples ... from the NCI, Northwestern
    #          Medicine (USA), University of Pittsburgh Medical Center (USA), and
    #          University College London (UK)"; "52 tumour types".
    # The key was `whole_slide_images: 5835`, which the abstract does not support -- it
    # counts samples, not slides. Renamed and the test cohort and type count added.
    description: >-
      Multi-institutional retrospective CNS tumour cohort. Training data from the NCI,
      the Children's Brain Tumor Network and the Digital Brain Tumour Atlas; test data
      from the NCI, Northwestern Medicine, UPMC and University College London, drawn from
      laboratory archives between May 17, 2024 and May 13, 2025.
    scale:
      training_samples: 5835
      test_samples: 5516
      tumour_types: 52
  tasks: [classification, mutation prediction, gene expression prediction]
  tasks_detail: >-
    CNS tumour family-level classification, 52 terminal CNS tumour types, IDH mutation
    prediction, inferred gene expression and DNA methylation.
  modalities: [histopathology]
  performance:
    # _source: all four rows from the published structured abstract, PMID 41643698, read
    #          via Europe PMC (https://www.ebi.ac.uk/europepmc/webservices/rest/search
    #          ?query=DOI:"10.1016/S1470-2045(25)00661-8"&resultType=core). Findings:
    #          "Family-level classifications were reached in 5299 (96%) of 5516 samples.
    #          Predictions to one of the terminal classifications with at least moderate
    #          confidence were reached for 4772 (87%) samples. The single highest-scoring
    #          classification matched the reference label in 3817 ... (80% [95% CI 79-81])
    #          of 4772 samples (balanced accuracy 66% [95% CI 63-70]). The two
    #          highest-scoring classifications contained the reference label in 4103 ...
    #          (86% [95% CI 85-87]) of 4772 samples (balanced accuracy 75% [95% CI 71-78])."
    #          Corroborated by the authors' SNO 2025 abstract (PMC12601992): "moderate-
    #          confidence (and above) predictions for 87% of test samples, for which it
    #          achieved a diagnostic accuracy of 80% for the top-1 prediction and 86%
    #          accuracy for a top-2 predictions".
    # The previous record split top-1/top-2 accuracy and balanced accuracy across five
    # rows and omitted the 96% family-level coprimary endpoint; folded to four rows.
    - benchmark: Multi-institutional CNS tumour test cohort (5,516 samples)
      metric: family-level sample coverage
      value: "96%"
      note: family-level classifications reached in 5,299 of 5,516 samples
    - benchmark: Multi-institutional CNS tumour test cohort (5,516 samples)
      metric: terminal-classification sample coverage
      value: "87%"
      note: 4,772 samples reached a terminal classification at moderate confidence or better
    - benchmark: Multi-institutional CNS tumour test cohort (4,772 covered samples)
      metric: top-1 prediction accuracy
      value: "80%"
      note: 3,817 of 4,772 samples, 95% CI 79-81; balanced accuracy 66% (95% CI 63-70)
    - benchmark: Multi-institutional CNS tumour test cohort (4,772 covered samples)
      metric: top-2 prediction accuracy
      value: "86%"
      note: 4,103 of 4,772 samples, 95% CI 85-87; balanced accuracy 75% (95% CI 71-78)
  verify:
    - >-
      params not published in any reachable source. The Lancet full text is behind
      Cloudflare, there is no PMC deposit, no preprint and no code release; the
      authors' SNO 2025 abstract (PMC12601992) states none either.
    - >-
      backbone is narrowed to what the published abstract supports. The previous
      record named UNI, MLP submodules and an ensemble of random forest, SVM, KNN
      and logistic regression, none of which appears in any reachable source.
      Restore with a citation if someone reads the Methods.
    - >-
      trained on 5,835 samples per the Lancet Oncology abstract, which is what this
      record uses. The authors' SNO 2025 abstract says 5,715; the peer-reviewed
      figure takes precedence.
    - >-
      model.weights points at a login-gated NIH analysis service, not a weight
      download. The abstract promises public release with no artifact yet.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-02
  title: Knowledge-enhanced pretraining for vision-language pathology foundation model on cancer diagnosis
  url: https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00058-9
  doi: 10.1016/j.ccell.2026.01.019
  venue: Cancer Cell
  authors:
    first: {name: Xiao Zhou}
    last:
      name: Weidi Xie
      scholar: https://scholar.google.com/citations?user=Vtrqj4gAAAAJ&hl=zh-CN
  model:
    name: KEEP
    repo: https://github.com/MAGIC-AI4Med/KEEP
    # _source: https://huggingface.co/api/models/Astaxanthin/KEEP
    weights: https://huggingface.co/Astaxanthin/KEEP
    params_note: >-
      414M is the released checkpoint's own total, not a figure from the paper: the
      HuggingFace API reports safetensors total 414,210,816 for Astaxanthin/KEEP and the
      model page renders "Model size 0.4B params". It covers both towers (ViT-L/16 vision
      encoder plus the BERT-family text encoder) at F32. Neither the Cancer Cell abstract
      nor the arXiv preprint states a parameter count anywhere.
  # _source: https://huggingface.co/api/models/Astaxanthin/KEEP (safetensors total
  # 414,210,816) and https://huggingface.co/Astaxanthin/KEEP ("Model size 0.4B params")
  params: 414M
  # _source: ARXIV 2412.13126v2 methods -- "KEEP consists of a vision encoder based on the
  # backbone of ViT-L-16 and a text encoder based on the architecture of PubMedBERT. We
  # adopt UNI to initialize the image encoder ... the text encoder of KEEP is initialized
  # by the pre-trained knowledge encoder."
  # Corroborated by HF config.json: vision hidden 1024 / 24 layers / patch 16 / img 224,
  # text model_type bert, hidden 768 / 12 layers / vocab 30522.
  # Replaces the vaguer "ViT-L/16 vision encoder with a BERT text encoder".
  backbone: >-
    ViT-L/16 vision encoder initialised from UNI, paired with a PubMedBERT text encoder
    initialised from a disease-knowledge encoder
  # _source: pretraining terms -- ARXIV 2412.13126v2 methods. "CLIP" dropped: the preprint
  # never calls the objective CLIP (its only CLIP mention is a BioCLIP citation for the
  # hierarchical disease chains); the loss is a group-level metric-learning objective.
  pretraining: [contrastive]
  pretraining_detail: >-
    Knowledge-enhanced vision-language pretraining. A BERT-family knowledge encoder is
    first trained by metric learning over a disease knowledge graph, then used to align
    visual and textual representations within hierarchical semantic spaces, so alignment
    happens at the level of a semantic group rather than a single noisy image-text pair.
  data:
    # _source: EPMC abstract (PMID 41720085), which matches the arXiv v2 abstract verbatim
    description: >-
      Pathology image-text pairs from OpenPath and Quilt-1M, reorganized into
      semantically structured groups aligned with disease ontology hierarchies
    scale:
      # _source: EPMC abstract -- "143,000 semantically structured groups"
      semantic_groups: 143000
      # _source: EPMC abstract -- "a comprehensive disease knowledge graph encompassing
      # 11,454 diseases and 139,143 attributes"
      diseases: 11454
      disease_attributes: 139143
  tasks: [segmentation, detection, subtyping, retrieval, classification]
  tasks_detail: >-
    Zero-shot slide-level cancer region segmentation, cancer detection and subtyping;
    tile-level cross-modal retrieval and zero-shot image classification.
  modalities: [histopathology, text]
  performance:
    # _source: GH README "What is KEEP?" -- "an average sensitivity of 89.8% for cancer
    # detection across 7 cancer types".
    # Cross-check ARXIV 2412.13126v2 results: "it achieves an average sensitivity of 0.898
    # (at 0.95 specificity) in tumor detection across 7 cancer types". AGREE. The
    # specificity operating point comes from the preprint sentence.
    - benchmark: Zero-shot cancer detection, 7 CPTAC cohorts
      metric: average sensitivity at 0.95 specificity
      value: "0.898"
      note: reported by the authors as 89.8% in the repository README
    # _source: GH README, "Zero-shot Cancer Subtyping (BACC)" table, EBRAINS row: KEEP
    # 0.456 vs CONCH 0.371.
    # Cross-check ARXIV v2: "surpasses CONCH by 8.5 points in balanced accuracy for
    # subtyping 30 rare brain cancers" -- 0.456 - 0.371 = 0.085. AGREE exactly.
    - benchmark: EBRAINS, zero-shot subtyping (30 rare brain cancer types)
      metric: balanced accuracy
      value: "0.456"
      note: next-best model CONCH 0.371
    # _source: GH README, "Zero-shot Cancer Region Segmentation (DICE)" table, AGGC22 row:
    # KEEP 0.530 vs CONCH 0.449.
    # Cross-check ARXIV v2: "an average DICE score improvement of 6.8 and 8.1 points over
    # ... CONCH on the CAMELYON16 and AGGC22 datasets" -- 0.530 - 0.449 = 0.081. AGREE exactly.
    - benchmark: AGGC22, zero-shot cancer region segmentation
      metric: DICE
      value: "0.530"
      note: next-best model CONCH 0.449; before post-processing
    # _source: GH README, same segmentation table, CAMELYON16 row: KEEP 0.361 vs CONCH 0.292.
    # Cross-check ARXIV v2 gives the gap as 6.8 points; the README rows differ by 6.9.
    # MINOR DISAGREEMENT, recorded rather than resolved -- see the note and verify.
    - benchmark: CAMELYON16, zero-shot cancer region segmentation
      metric: DICE
      value: "0.361"
      note: >-
        next-best model CONCH 0.292, a 6.9-point gap; the preprint states 6.8 points, so
        one of the two is rounded differently
  verify:
    - >-
      performance comes from the authors' own GitHub README, cross-checked against
      arXiv 2412.13126v2, whose abstract is byte-identical to the published one. The
      Cancer Cell full text is unreachable -- cell.com and ScienceDirect both answer
      403 and there is no PMC deposit -- so no row was read from it.
    - >-
      the README warns its numbers are updated with each model iteration, so re-read
      them against the Cancer Cell PDF when someone has browser access.
    - >-
      params 414M is the released checkpoint's total from HuggingFace and covers both
      towers. The paper states no count. Not comparable with a tile-encoder-only
      figure such as UNI's 307M.
  added: {date: 2026-08, by: Leo Yin}
