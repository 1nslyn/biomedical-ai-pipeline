  #   (https://huggingface.co/paige-ai/Virchow, "632 million parameters", ViT-H/14).
  params: 632M
  pretraining_short: DINOv2
  # "approximately 1.5 million" in the paper, so the cell is marked approximate.
  training_slides: ~1.5M
  backbone: ViT-H/14
