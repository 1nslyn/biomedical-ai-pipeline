      # _source CONCH supplement Supplementary Data Table 28 -- 0.601 (0.530, 0.675), n = 31
      note: macro-averaged over images; 95% CI 0.530-0.675, n = 31 WSIs
  verify:
    # _source CHANGED: replaces "params 86M is the standard ViT-B/16 configuration..."
    - >-
      params left empty on purpose. The previously recorded 86M was inferred from the
      ViT-B/16 backbone name and is not stated by the authors anywhere reachable: not in
      the Nat. Med. full text (checked via NCBI efetch on PMC11384335), not in the
      Supplementary Information (all 44 Supplementary Data Tables checked -- Tables 33 and
      34 give layer, head and dimension counts but no parameter total), not in the
      github.com/mahmoodlab/CONCH README, and not in the HuggingFace card or config.json
      (MahmoodLab/CONCH is gated, HTTP 401, and ships pytorch_model.bin rather than
      safetensors so HuggingFace publishes no computed count either). The arXiv preprint
      (2307.12914) does not state one. Separately, 86M would have covered only the vision
      tower: CONCH is an image encoder plus a text encoder plus a multimodal decoder, so a
      single ViT-B/16 figure understates the model regardless of its accuracy.
  added: {date: 2026-08, by: Leo Yin}
