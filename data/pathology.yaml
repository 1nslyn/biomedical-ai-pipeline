- date: 2025-11
  title: A multimodal whole-slide foundation model for pathology
  url: https://www.nature.com/articles/s41591-025-03982-3
  doi: 10.1038/s41591-025-03982-3
  venue: Nat. Med.
  authors:
    first:
      name: Tong Ding
      scholar: https://scholar.google.com/citations?user=Vwt2ZVYAAAAJ&hl=en
    last:
      name: Faisal Mahmood
      scholar: https://scholar.google.com/citations?user=9MsdbKoAAAAJ&hl=en
  model:
    name: TITAN
    repo: https://github.com/mahmoodlab/TITAN
    weights: https://huggingface.co/MahmoodLab/TITAN
    params_note: >-
      48.5M is the slide encoder and excludes the frozen CONCH v1.5 patch encoder, so it is
      not comparable with tile-encoder counts such as Virchow's 632M. The released
      checkpoint on HuggingFace reports a safetensors total of 158,866,176, which is a
      different scope -- that file also carries the text encoder and multimodal decoder used
      for zero-shot and report generation, and ships the patch encoder separately as
      conch_v1_5_pytorch_model.bin. The repo is gated, so its config.json and model card
      could not be read to confirm the split.
  # _source: PMC12618242 -- "TITAN and TITANV, with 48.5 million and 42.1 million
  # parameters, outperform heavier slide encoders PRISM and GigaPath, with 99.0 million and
  # 86.3 million parameters". Unchanged.
  params: 48.5M
  backbone: ViT slide encoder (Transformer-based Image and Text Alignment Network) over CONCH v1.5 patch features
  # _source: PMC12618242 -- "we apply the iBOT framework for vision-only pretraining of
  # TITAN on the 2D feature grid" (stage 1) and "we use contrastive captioners (CoCa) as the
  # pretraining strategy" (stages 2-3).
  # CHANGED from [self-supervised, contrastive, CLIP]: the paper's single CLIP mention is
  # about zero-shot inference ("we adopted the method described in CLIP to use the
  # similarities between a given slide and the text prompts"), not pretraining.
  pretraining: [self-supervised, iBOT, CoCa, contrastive]
  pretraining_detail: >-
    Three stages: iBOT self-supervised pretraining on a 2D grid of patch features, then
    CoCa alignment against synthetic ROI captions generated by the PathChat pathology
    copilot, then alignment against whole-slide pathology reports.
  data:
    description: Whole-slide images with paired pathology reports and synthetic captions
    scale:
      # _source: PMC12618242 -- "an internal dataset (termed Mass-340K) consisting of
      # 335,645 WSIs and 182,862 medical reports"
      whole_slide_images: 335645
      pathology_reports: 182862
      # _source: PMC12618242 -- "we pretrain TITANV with 423,122 pairs of 8,192 x 8,192
      # pixels ROIs and synthetic captions"
      synthetic_captions: 423122
  tasks: [classification, subtyping, retrieval, report generation, survival prediction]
  tasks_detail: >-
    Slide-level representation without fine-tuning, rare disease recognition, cancer
    outcome prediction and pathology report generation.
  modalities: [histopathology, text]
  # ALL FIVE ROWS REPLACED. The previous rows were the relative gains the running text
  # quotes; these are the absolute values from the supplementary tables, read from
  # SUPPL 41591_2025_3982_MOESM1_ESM.pdf (Supplementary Tables 1-127).
  # Fetched two ways with identical MD5 d4a3f8e4186b48a1a16fea1377a0b5b2: the EPMC
  # supplementaryFiles zip for PMC12618242, and
  # https://static-content.springer.com/esm/art%3A10.1038%2Fs41591-025-03982-3/MediaObjects/41591_2025_3982_MOESM1_ESM.pdf
  performance:
    # _source: SUPPL Supplementary Table 22 (linear probing, tumour subtype C = 32,
    # TCGA-UT-8K), logistic regression column: TITAN 0.832+/-0.0056, PRISM 0.774+/-0.0062.
    - benchmark: TCGA-UT-8K, linear probe tumour subtyping (32 classes)
      metric: balanced accuracy
      value: "0.832"
      note: logistic regression, +/- 0.0056; next-best slide encoder PRISM 0.774
    # _source: SUPPL Supplementary Table 24 (linear probing, OncoTree code C = 108, OT108).
    - benchmark: OT108, linear probe OncoTree classification (108 classes)
      metric: balanced accuracy
      value: "0.587"
      note: logistic regression, +/- 0.0103; next-best slide encoder PRISM 0.508
    # _source: SUPPL Supplementary Table 97 (zero-shot, tumour subtype C = 32, TCGA-UT-8K):
    # TITAN 0.761+/-0.0063 bal. acc., 0.989 AUROC; PRISM 0.536+/-0.0061.
    - benchmark: TCGA-UT-8K, zero-shot tumour subtyping (32 classes)
      metric: balanced accuracy
      value: "0.761"
      note: +/- 0.0063; AUROC 0.989; PRISM 0.536
    # _source: SUPPL Supplementary Table 117 (slide retrieval, rare cancer C = 43,
    # Rare-Cancer): TITAN Top-1 0.539+/-0.0100, Top-3 0.725, Top-5 0.804; PRISM Top-1 0.449.
    - benchmark: Rare-Cancer slide retrieval (43 rare types in a 186-class database)
      metric: Top-1 accuracy
      value: "0.539"
      note: +/- 0.0100; Top-5 0.804; next-best slide encoder PRISM 0.449
    # _source: SUPPL Supplementary Table 64 (disease-specific survival, c-index, six TCGA
    # cohorts), "Avg." row: TITAN 0.716, TITANV 0.711, CHIEF 0.691.
    - benchmark: Disease-specific survival, six TCGA cohorts
      metric: concordance index (mean over cohorts)
      value: "0.716"
      note: next-best model CHIEF 0.691, the +3.62% quoted in the running text
  verify:
    - >-
      Supplementary tables in this PDF are captioned BELOW the table, so "Supplementary
      Table N" is the block preceding the caption line, and a naive caption-then-table read
      shifts every result by one table. Established three ways: the EBRAINS class-prompt
      list sits above the Table 94 caption that names it; Table 64's c-index average
      (0.716 vs CHIEF 0.691) reproduces the running text's "+3.62%"; and Table 117's Acc@K
      and MVAcc@K columns reproduce the running text's "+14.8%" and "+18.1%" over PRISM.
      Anyone re-reading this supplement should re-check that mapping before quoting a number.
    - >-
      Absolute figures for the two headline gains the abstract leads with could not be
      pinned to a single table and were left out: the "+8.4%" linear-probe figure is an
      average over many subtyping tasks, and the "+56.52%" zero-shot figure is an average
      over several multiclass tasks. The per-task absolutes above are exact.
  added: {date: 2026-08, by: Leo Yin}
- date: 2025-11
  title: SMMILe enables accurate spatial quantification in digital pathology using multiple-instance learning
  url: https://www.nature.com/articles/s43018-025-01060-8
  doi: 10.1038/s43018-025-01060-8
  venue: Nat. Cancer
  authors:
    first:
      name: Zeyu Gao
      scholar: https://scholar.google.com/citations?hl=zh-CN&user=CeP6dkcAAAAJ
    last:
      name: Mireia Crispin-Ortuzar
      scholar: https://scholar.google.com/citations?hl=en&user=TRZzLJgAAAAJ
  model:
    name: SMMILe
    repo: https://github.com/ZeyuGaoAi/SMMILe
    # _source: PMC12727519 main text and SUPPL 43018_2025_1060_MOESM1_ESM.pdf sec. 7 +
    # Supplementary Table 10. Verified: 1.2M is the MIL head only.
    params_note: >-
      The paper reports SMMILe's own cost as "1.50 GFLOPS, 1.20 M parameters" for
      1,024-dimension patch embeddings; the frozen ResNet-50/CONCH patch encoder is
      not counted, so this is not comparable to a tile-encoder parameter count.
  # _source: PMC12727519 -- "SMMILe's compute cost (1.50 GFLOPS, 1.20 M parameters) for
  # 1,024-dimension patch embeddings was comparable to baselines such as ABMIL (0.71
  # GFLOPS, 0.79 M) and TransMIL (2.70 GFLOPS, 2.67 M)".
  # Corroborated by SUPPL Supplementary Table 10 ("SMMILe 1.50 1.20M 18.30MB") and by
  # supplementary sec. 7 "Computational Cost", which states the same figures in prose and
  # confirms the exclusion: the comparison is against the ABMIL and TransMIL heads at a
  # fixed patch embedding dimension of 1024. AGREE. Unchanged.
  params: 1.2M
  backbone: >-
    ResNet-50 and CONCH patch encoders with an instance-based multiple-instance-learning
    architecture using superpatch and refinement modules
  pretraining: [weakly supervised]
  pretraining_detail: >-
    Feature extraction with pretrained encoders (ImageNet ResNet-50, pathology
    foundation model CONCH), then weakly supervised MIL training with slide-level labels.
  data:
    description: 8 datasets covering 6 cancer types
    scale:
      # _source: EPMC abstract (PMID 41258398) -- "evaluate it across 6 cancer types, 3
      # highly diverse classification tasks and 8 datasets involving 3,850 whole-slide
      # images". All three unchanged, now verified.
      whole_slide_images: 3850
      datasets: 8
      cancer_types: 6
  tasks: [classification, detection, subtyping, grading]
  tasks_detail: >-
    WSI-level classification and patch-level spatial quantification, including metastasis
    detection, subtype prediction and grading.
  modalities: [histopathology]
  performance:
    # _source (rows 1-3): PMC12727519 -- "SMMILe achieves AUC scores of 94.11%, 90.92% and
    # 92.75% on the Ovarian, Prostate and Gastric Endoscopy datasets, respectively,
    # exceeding the second-best methods by margins of 2.20%, 2.90% and 11.18%".
    # Corroborated value-by-value against SUPPL Supplementary Table 2 (WSI classification,
    # macro AUC %, ResNet-50 block), which also supplies the standard deviations. AGREE.
    - benchmark: Ovarian (UBC-OCEAN)
      metric: macro AUC
      value: "94.11%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings; +/- 1.13, second-best +2.20
    - benchmark: Prostate
      metric: macro AUC
      value: "90.92%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings; +/- 2.68, second-best +2.90
    - benchmark: Gastric Endoscopy (IH-ESD)
      metric: macro AUC
      value: "92.75%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings; +/- 3.59, second-best +11.18
    # _source: SUPPL Supplementary Table 6 (spatial quantification, macro F1 %, ResNet-50
    # block, Breast row): SMMILe 66.47+/-10.21, DSMIL 42.91+/-19.53.
    # CHANGED from the relative row "+23.56%": the main text's claim that SMMILe
    # "outperforms DSMIL by 23.56% in spatial F1 score" is exactly 66.47 - 42.91, which both
    # identifies the table and corroborates the absolute pair.
    - benchmark: Breast (Camelyon16), spatial quantification
      metric: spatial macro F1
      value: "66.47%"
      note: >-
        ImageNet ResNet-50 patch embeddings; +/- 10.21, second-best method DSMIL 42.91%,
        the 23.56-point gap quoted in the running text
  verify:
    - >-
      Supplementary tables in this PDF are captioned BELOW the table, so "Supplementary
      Table N" is the block preceding the caption line. Confirmed here by the spatial F1
      row: the main text's 23.56-point gap equals 66.47 - 42.91 in the block above the
      Table 6 caption.
  added: {date: 2026-08, by: Leo Yin}
- date: 2025-01
  title: A vision-language foundation model for precision oncology
  url: https://www.nature.com/articles/s41586-024-08378-w
  doi: 10.1038/s41586-024-08378-w
  venue: Nature
  authors:
    first:
      name: Jinxi Xiang
      scholar: https://scholar.google.com/citations?user=Zn-0LioAAAAJ&hl=en
    last:
      name: Ruijiang Li
      scholar: https://scholar.google.com/citations?user=Y89JnCYAAAAJ&hl=en
  model:
    name: MUSK
    repo: https://github.com/lilab-stanford/MUSK
    # _source: https://huggingface.co/api/models/xiangjx/musk (linked from the repo README)
    weights: https://huggingface.co/xiangjx/musk
    # _source: https://huggingface.co/api/models/xiangjx/musk -> cardData.license
    license: CC-BY-NC-ND-4.0
  # _source: Supplementary Table 16 "Model configuration and training recipe of MUSK",
  #   row "Parameters ... Small 72M / Base 222M / Large 675M", in
  #   41586_2024_8378_MOESM1_ESM.pdf. Corroborated in the same supplement's
  #   "Model Capacity" text ("large (675 million parameters, 222G FLOPS)") and in
  #   Supplementary Table 17 ("MUSK-large (675M/222G)"). MUSK-large is the paper's
  #   final model: "in this study, we chose MUSK-large as our final model".
  params: 675M
  # _source: PMC12295649 Methods + Fig. 1 caption + Supplementary Table 16 (Large column)
  backbone: >-
    BEiT-3-style multimodal transformer -- shared self-attention blocks with two
    independent vision and language experts; 24 layers, hidden size 1024, FFN 4096,
    16 attention heads, 384x384 input at 16x16 patches
  pretraining: [MIM, contrastive]
  pretraining_detail: Masked image modelling followed by vision-language contrastive alignment.
  data:
    # _source: PMC12295649 "Multimodal Data Curation for Pretraining"
    description: >-
      50 million TCGA H&E image patches from ~33,000 WSIs and 1 billion text tokens
      from PubMed Central OA articles for masked pretraining, then ~1 million
      image-text pairs from Quilt1M (802k) and PathAsst (207k) for contrastive alignment
    scale:
      # _source: PMC12295649 -- all five counts stated verbatim in Methods/abstract
      image_patches: 50000000
      whole_slide_images: 33000
      patients: 11577
      text_tokens: 1000000000
      articles: 1001800
      image_text_pairs: 1000000
  # _source: PMC12295649 abstract -- "image-to-text and text-to-image retrieval, visual
  #   question answering, image classification, and molecular biomarker prediction ...
  #   melanoma relapse prediction, pan-cancer prognosis prediction, and immunotherapy
  #   response prediction". Previous list omitted the four tasks the entry's own
  #   performance rows report.
  tasks: [retrieval, visual question answering, classification, biomarker prediction, prognosis, survival prediction, treatment response]
  tasks_detail: >-
    Cross-modal retrieval, visual question answering, histopathology image classification
    and molecular biomarker prediction, plus clinical outcome prediction -- melanoma
    relapse, pan-cancer prognosis and immunotherapy response.
  modalities: [histopathology, text]
  performance:
    - benchmark: PathVQA visual question answering
      metric: accuracy
      value: "73.2%"
      note: 95% CI 72.1-74.4
    - benchmark: HER2 status prediction
      metric: AUC
      value: "0.826"
      note: 95% CI 0.813-0.839
    - benchmark: Melanoma 5-year relapse prediction
      metric: AUC
      value: "0.833"
      note: 95% CI 0.818-0.847
    - benchmark: Pan-cancer prognosis, 16 cancer types
      metric: c-index
      value: "0.746"
      note: average; overall stage baseline reported as 0.645
    - benchmark: Immunotherapy response prediction, lung cancer
      metric: AUC
      value: "0.768"
      note: 95% CI 0.724-0.812
  verify:
    - >-
      params 675M is MUSK-large, the released and final model (Supplementary Table 16;
      the repo builds musk_large_patch16_384 for the public checkpoint). The same table
      lists 72M small and 222M base variants -- do not substitute either.
  added: {date: 2026-08, by: Leo Yin}
- date: 2024-09
  title: A pathology foundation model for cancer diagnosis and prognosis prediction
  url: https://www.nature.com/articles/s41586-024-07894-z
  doi: 10.1038/s41586-024-07894-z
  venue: Nature
  authors:
    first:
      name: Xiyue Wang
      scholar: https://scholar.google.com/citations?user=NHt3fUcAAAAJ&hl=en
    last:
      name: Kun-Hsing Yu
      scholar: https://scholar.google.com/citations?user=1ZCJvkgAAAAJ&hl=en
  model:
    name: CHIEF
    repo: https://github.com/hms-dbmi/CHIEF
    # _source: https://github.com/hms-dbmi/CHIEF README -- "Docker images (model weights)
    #   are available at https://hub.docker.com/r/chiefcontainer/chief/"
    weights: https://hub.docker.com/r/chiefcontainer/chief/
    # _source: https://github.com/hms-dbmi/CHIEF README -- "CHIEF is made available under
    #   the GPLv3 License and is available for non-commercial academic purposes."
    license: GPLv3
  # params: deliberately absent -- no parameter count is published by the authors
  #   anywhere reachable. See the verify note below for the routes tried.
  backbone: CTransPath tile encoder with a weakly supervised whole-slide aggregation module
  pretraining: [self-supervised, weakly supervised]
  pretraining_detail: >-
    Two complementary pretraining strategies: unsupervised pretraining for tile-level
    features and weakly supervised pretraining for whole-slide pattern recognition.
  data:
    description: >-
      Unsupervised tile-level pretraining then weakly supervised slide-level
      pretraining, across 14 cohorts and 19 anatomical sites
    scale:
      # _source: PMC12186853 -- "self-supervised pretraining using 15 million pathology
      #   image tiles ... and weakly-supervised pretraining on 60,530 WSIs across 19
      #   anatomical sites". Re-verified this pass; the old verify note asking for these
      #   to be transcribed is stale and has been removed.
      image_tiles: 15000000
      whole_slide_images: 60530
      anatomical_sites: 19
  tasks: [classification, detection, subtyping, prognosis, mutation prediction]
  tasks_detail: >-
    Cancer cell detection, tumour origin identification, molecular profile prediction and
    survival outcome prediction across cancer types.
  modalities: [histopathology]
  performance:
    - benchmark: Cancer cell detection, 15 datasets spanning 11 cancer types
      metric: macro-average AUROC
      value: "0.9397"
    - benchmark: Tumour origin prediction, held-out test sets
      metric: macro-averaged accuracy
      value: "0.895"
    - benchmark: Tumour origin prediction, independent cohorts
      metric: AUROC
      value: "0.9853"
      note: paper reports 0.9853 +/- 0.0245
    - benchmark: MSI-high identification in colorectal cancer
      metric: AUROC
      value: "0.869-0.875"
      note: range across the evaluated cohorts
    - benchmark: Survival prediction, held-out test set
      metric: c-index
      value: "0.74"
      note: average across cancer types
  verify:
    - >-
      params not published in any author source: not the full text, not the
      Supplementary Information, not the reporting summary, not the repo. Do not infer
      one from CTransPath, from its Swin Transformer backbone, or from third-party
      survey papers repeating generic ViT reference configurations.
    - >-
      only embedding widths are documented -- tile and slide-level features are both
      [1, 768]. Recorded so nobody mistakes a width for a model size.
  added: {date: 2026-08, by: Leo Yin}
- date: 2024-07
  title: A foundation model for clinical-grade computational pathology and rare cancers detection
  url: https://www.nature.com/articles/s41591-024-03141-0
  doi: 10.1038/s41591-024-03141-0
  venue: Nat. Med.
  authors:
    first:
      name: Eugene Vorontsov
      scholar: https://scholar.google.com/citations?user=5o1gS_sAAAAJ&hl=en
    last:
      name: Thomas J. Fuchs
      scholar: https://scholar.google.ch/citations?user=zh0Raz8AAAAJ&hl=en
  model:
    name: Virchow
    repo: https://github.com/Paige-AI/paige-ml-sdk
    weights: https://huggingface.co/paige-ai/Virchow
    # _source: https://huggingface.co/api/models/paige-ai/Virchow -> cardData.license
    #   ("apache-2.0"); the model card repeats "Apache 2.0". Access is gated.
    license: Apache-2.0
  # _source: PMC11485232 -- stated twice, verbatim: "Virchow, a 632 million parameter ViT
  #   model" (Results) and "Virchow employs the ViT 'huge' architecture (ViT-H/14), a ViT
  #   with 632 million parameters" (Methods, "Virchow architecture and training").
  #   Corroborated by Supplementary Note 1 Table (row: Virchow | MSKCC | 1.5M | 2B |
  #   ViT-H | 632M | DINOv2) and independently by the HuggingFace model card
  #   (https://huggingface.co/paige-ai/Virchow, "632 million parameters", ViT-H/14).
  params: 632M
  backbone: ViT-H/14
  pretraining: [DINOv2]
  pretraining_detail: Self-supervised DINOv2 pretraining on H&E whole-slide images.
  data:
    description: H&E-stained whole-slide images from a clinical archive
    scale:
      # _source: PMC11485232 -- "approximately 1.5 million H&E stained WSIs acquired from
      #   Memorial Sloan Kettering Cancer Center (MSKCC)"
      whole_slide_images: 1500000
      # _source: PMC11485232 editor summary -- "Trained on 1.5 million whole-slide images
      #   from 100,000 patients"
      patients: 100000
      # _source: PMC11485232 Methods -- "Virchow was trained on 2 billion tiles sampled
      #   randomly with replacement from approximately 13 billion available tissue tiles"
      training_tiles: 2000000000
  tasks: [detection, biomarker prediction, classification]
  tasks_detail: Pan-cancer detection including rare cancers, and biomarker prediction.
  modalities: [histopathology]
  performance:
    - benchmark: Pan-cancer detection across nine common and seven rare cancers
      metric: AUC
      value: "0.950"
      note: specimen level; aggregator trained on Virchow embeddings
    - benchmark: Rare cancer detection
      metric: AUC
      value: "0.937"
      note: seven rare cancer types
    - benchmark: Pan-cancer detection at 95% sensitivity
      metric: specificity
      value: "72.5%"
      note: UNI 68.9%, Phikon 62.9%, CTransPath 52.3%
    # _source: PMC11485232 -- the "(product testing dataset)" qualifier was removed. The
    #   sentence carrying 0.980 does not name a dataset; only the Fig. 3b legend does.
    #   Value and the 0.995 comparison are quoted verbatim from the body text.
    - benchmark: Prostate cancer detection versus the Paige Prostate clinical product
      metric: AUC
      value: "0.980"
      note: >-
        pan-cancer model on Virchow embeddings; surpassed by the FDA-approved Paige
        Prostate specialist model at 0.995 (P < 0.05)
  verify:
    # _source: this note was WRONG and is deleted -- 632M is quoted in the paper, twice.
    #   Replaced with the naming caution below, which was confirmed this pass.
    - >-
      Naming confirmed: this Nat. Med. paper introduces Virchow. Virchow2 is a separate
      later model (arXiv 2408.00738, "Virchow2: Scaling Self-Supervised Mixed
      Magnification Models in Pathology"), and the HuggingFace card for paige-ai/Virchow
      points to it as the newer version. Note the trap: Virchow2 is also a 632 million
      parameter vision transformer, so the matching count is not evidence that the two
      entries have been confused. If the team wants Virchow2 listed, add it as its own
      entry.
  added: {date: 2026-08, by: Leo Yin}
- date: 2024-05
  title: A whole-slide foundation model for digital pathology from real-world data
  url: https://www.nature.com/articles/s41586-024-07441-w
  doi: 10.1038/s41586-024-07441-w
  venue: Nature
  authors:
    first:
      name: Hanwen Xu
      scholar: https://scholar.google.com/citations?user=HwO7L5sAAAAJ&hl=zh-CN
    last:
      name: Hoifung Poon
      scholar: https://scholar.google.com/citations?user=yqqmVbkAAAAJ&hl=en
  model:
    name: Prov-GigaPath
    repo: https://github.com/prov-gigapath/prov-gigapath
    weights: https://huggingface.co/prov-gigapath/prov-gigapath
    # _source CHANGED (added): arXiv:2607.18218 Table 1 + s2.1; github.com/prov-gigapath/prov-gigapath README
    params_note: >-
      Two components, counted separately. The Nature paper and its Supplementary
      Information give no count for the released model; both figures come from the same
      team's follow-up paper (GigaPath-Flash, arXiv:2607.18218), whose Table 1 lists
      "GigaPath | Whole-Slide FM | ViT-g (1B) + LongNet (86M) | Apache-2.0 | Nature,
      2024" and whose section 2.1 calls it "the frozen GigaPath ViT-g (1B) teacher". The
      1B is the tile encoder; the 86M is the LongNet slide encoder. Not comparable with a
      tile-encoder-only count such as UNI's 307M without saying which half you mean.
  # _source CHANGED (was empty): arXiv:2607.18218 Table 1 -- "ViT-g (1B) + LongNet (86M)"
  # corroboration for 86M: arXiv:2411.19666 (TITAN) -- "GigaPath, with ... 86.3 million parameters"
  params: 1B
  # _source https://raw.githubusercontent.com/prov-gigapath/prov-gigapath/main/README.md
  #   -- "the original GigaPath slide encoder (12L/768d over 1536-dim tile embeddings)";
  #      loader arg `gigapath_slide_enc12l768d` with input_dim 1536
  backbone: ViT-g tile encoder with a 12-layer, 768-dim LongNet slide encoder over 1,536-dim tile embeddings
  pretraining: [DINOv2, MAE]
  pretraining_detail: >-
    DINOv2 tile-level pretraining followed by masked autoencoder pretraining with LongNet
    over whole slides.
  data:
    description: Real-world H&E slides from the Providence health network
    scale:
      whole_slide_images: 171189
      # _source PMC11153137 -- "comprising 1,384,860,229 image tiles from 171,189 whole pathology slides"
      image_tiles: 1384860229
  tasks: [classification, subtyping, mutation prediction, biomarker prediction]
  tasks_detail: 26 prediction tasks spanning pathomics and cancer subtyping.
  modalities: [histopathology]
  performance:
    # all four rows re-verified verbatim in PMC11153137 full text
    - benchmark: Digital pathology benchmark (26 tasks)
      metric: tasks at state of the art
      value: "25/26"
      note: significant improvement over the second-best method in 18 tasks
    - benchmark: Cancer subtyping across nine cancer types
      metric: AUROC
      value: "0.903"
      note: average; falls to 0.886 with a randomly initialised LongNet
    - benchmark: LUAD five-gene mutation prediction
      metric: macro-AUROC
      value: "0.626"
      note: average over EGFR, FAT1, KRAS, TP53, LRP1B on Prov-Path
    - benchmark: Pan-cancer tumour mutation burden prediction
      metric: AUROC
      value: "0.708"
      note: average
  verify:
    - >-
      params comes from the same team's GigaPath-Flash paper (arXiv:2607.18218,
      Table 1: "ViT-g (1B) + LongNet (86M)"), not from the Nature paper, which
      states a count only for a smaller 23M ablation. 1B is the tile encoder; the
      slide encoder adds 86M.
    - >-
      do not confuse this with GigaPath-Flash (July 2026), a separate lightweight
      release from the same group at 22M + 21M. If the team wants it catalogued it
      needs its own entry.
  added: {date: 2026-08, by: Leo Yin}
- date: 2024-03
  title: Towards a general-purpose foundation model for computational pathology
  url: https://www.nature.com/articles/s41591-024-02857-3
  doi: 10.1038/s41591-024-02857-3
  venue: Nat. Med.
  authors:
    first:
      name: Richard J. Chen
      scholar: https://scholar.google.com/citations?user=yhGqdMgAAAAJ&hl=en
    last:
      name: Faisal Mahmood
      scholar: https://scholar.google.com/citations?user=9MsdbKoAAAAJ&hl=en
  model:
    name: UNI
    repo: https://github.com/mahmoodlab/UNI
    # _source CHANGED: was https://huggingface.co/MahmoodLab/UNI2-h, which is UNI 2
    #   (ViT-h/14-reg8, released 01/2025) -- a different model from the one this paper
    #   describes. github.com/mahmoodlab/UNI README model table: "UNI | 03/2024 |
    #   ViT-l/16 | HF Link -> huggingface.co/MahmoodLab/uni".
    weights: https://huggingface.co/MahmoodLab/UNI
  # _source CONFIRMED by the paper itself: UNI supplement, Supplementary Data Table 10
  #   "Architecture details of pretrained vision encoders" -- row "UNI | ViT-L/16 | 307M |
  #   133.1 images/sec". Covers the whole released model (UNI is a tile encoder only).
  params: 307M
  backbone: ViT-L/16
  pretraining: [DINOv2]
  pretraining_detail: Self-supervised DINOv2 pretraining on the Mass-100K slide corpus.
  data:
    description: Mass-100K, H&E whole-slide images from Massachusetts General Brigham
    scale:
      whole_slide_images: 100426
      # _source PMC11403354 Methods -- "altogether yielded 100,130,900 images for
      #   pretraining in Mass-100K"
      tissue_patches: 100130900
  tasks: [segmentation, detection, grading, subtyping, biomarker prediction, classification]
  tasks_detail: >-
    34 tasks including nuclear segmentation, primary and metastatic cancer detection,
    cancer grading and subtyping, biomarker screening, molecular subtyping, organ
    transplant assessment and pan-cancer classification.
  modalities: [histopathology]
  performance:
    # all five rows re-verified verbatim in PMC11403354 full text
    - benchmark: Prostate ISUP grading (PANDA)
      metric: quadratic weighted Cohen's kappa
      value: "0.946"
      note: ABMIL on pre-extracted UNI features; +0.014 over REMEDIS
    - benchmark: 32-class pan-cancer tissue classification (TCGA Uniform Tumor)
      metric: balanced accuracy
      value: "65.7%"
      # _source CHANGED (note only): dataset named, margin added, both from PMC11403354
      note: linear probing on pre-extracted features; +4.7% over REMEDIS
    - benchmark: 32-class pan-cancer tissue classification (TCGA Uniform Tumor)
      metric: AUROC
      value: "0.975"
      # _source CHANGED (note only)
      note: linear probing on pre-extracted features; +0.017 over REMEDIS
    - benchmark: Tumor-immune lymphocyte detection (ChampKit)
      metric: AUROC
      value: "0.978"
      # _source CHANGED (note only): "without stain normalization" and the baseline FNR
      #   added, both from PMC11403354
      note: without stain normalisation; UNI FNR 0.193 vs best ChampKit model 0.974 AUROC / 0.246 FNR
    - benchmark: CAMELYON17-WILDS out-of-domain test set
      metric: accuracy
      value: "98.3%"
      note: 97.4% on the OOD validation set; best leaderboard model 95.2% / 96.5%
  verify:
    # _source CHANGED: the old note said "params 307M is the standard ViT-L/16
    #   configuration, not a figure quoted in the paper". That is now wrong -- the paper
    #   does quote it, in the supplement.
    - >-
      params 307M is confirmed against the paper's own Supplementary Data Table 10
      ("Architecture details of pretrained vision encoders"), which lists UNI as
      ViT-L/16, 307M. The same table's other rows agree with counts given verbatim in the
      main text (CTransPath 28,289,038 and REMEDIS 232,230,016 appear as 28M and 232M),
      so the row-to-column alignment of the extracted table is not in doubt. The count
      covers the ViT-L/16 vision encoder, which is the entire released model -- UNI is a
      tile encoder with no slide-level component.
    - >-
      model.weights was corrected from MahmoodLab/UNI2-h to MahmoodLab/UNI. UNI2-h is the
      January 2025 ViT-h/14-reg8 successor, not the model this paper describes; if the
      team wants UNI 2 catalogued it needs its own entry.
  added: {date: 2026-08, by: Leo Yin}
- date: 2024-03
  title: A visual-language foundation model for computational pathology
  url: https://www.nature.com/articles/s41591-024-02856-4
  doi: 10.1038/s41591-024-02856-4
  venue: Nat. Med.
  authors:
    first:
      name: Ming Y. Lu
      scholar: https://scholar.google.com/citations?user=GhzAXmIAAAAJ&hl=en
    last:
      name: Faisal Mahmood
      scholar: https://scholar.google.com/citations?user=9MsdbKoAAAAJ&hl=en
  model:
    name: CONCH
    repo: https://github.com/mahmoodlab/CONCH
    weights: https://huggingface.co/MahmoodLab/CONCH
  # _source CHANGED: was `params: 86M`. Removed -- no authors' source states a count.
  #   See the verify note below for the routes tried.
  params: null
  # _source CONCH supplement, Supplementary Data Tables 33 and 34 (vision: 12 layers,
  #   12 heads, patch size 16, embedding dim 768; language: 24 layers, 12 heads,
  #   embedding dim 768, hidden dim 3,072, vocab 32,000)
  backbone: ViT-B/16 image encoder, 12-layer text encoder and 12-layer multimodal decoder
  pretraining: [iBOT, CoCa]
  pretraining_detail: iBOT visual pretraining followed by CoCa image-text pretraining.
  data:
    description: Pathology image-caption pairs curated from educational sources and PubMed
    scale:
      # _source PMC11384335 Extended Data Fig. 1 caption -- "(n = 1,170,647)"
      image_caption_pairs: 1170647
  tasks: [classification, retrieval, segmentation, captioning]
  tasks_detail: >-
    Tile- and slide-level classification, cross-modal image-to-text and text-to-image
    retrieval, image segmentation and captioning.
  modalities: [histopathology, text]
  performance:
    # _source CHANGED on the three subtyping rows: metric was "accuracy", corrected to
    #   "balanced accuracy". Fig. 2c caption (PMC11384335): "balanced accuracy is reported
    #   for all other tasks", and CONCH supplement Tables 1-3 report each value under a
    #   "Balanced accuracy" column header.
    - benchmark: TCGA BRCA subtyping
      metric: balanced accuracy
      value: "91.3%"
      # _source CONCH supplement Supplementary Data Table 1 -- 0.913 (0.866, 0.960), n = 150
      note: zero-shot with prompt ensembling; 95% CI 86.6-96.0%, n = 150
    - benchmark: TCGA NSCLC subtyping
      metric: balanced accuracy
      value: "90.7%"
      # _source CONCH supplement Supplementary Data Table 3 -- 0.907 (0.859, 0.948), n = 150
      note: zero-shot with prompt ensembling; 95% CI 85.9-94.8%, n = 150
    - benchmark: TCGA RCC subtyping
      metric: balanced accuracy
      value: "90.2%"
      # _source CONCH supplement Supplementary Data Table 2 -- 0.902 (0.860, 0.938), n = 225
      note: zero-shot with prompt ensembling; 95% CI 86.0-93.8%, n = 225
    - benchmark: Text-to-image retrieval
      metric: mean recall
      value: "44.0%"
      # _source PMC11384335 running text for the 44.0% average and the per-dataset 68.8%
      #   and 39.0%; CONCH supplement Tables 22, 24 and 26 for 0.688 / 0.390 / 0.240
      note: zero-shot; paper's average over source A (68.8%), source B (39.0%) and TCGA LUAD (24.0%)
    - benchmark: SICAP zero-shot segmentation
      metric: Dice
      value: "0.601"
      # _source CONCH supplement Supplementary Data Table 28 -- 0.601 (0.530, 0.675), n = 31
      note: macro-averaged over images; 95% CI 0.530-0.675, n = 31 WSIs
  verify:
    # _source CHANGED: replaces "params 86M is the standard ViT-B/16 configuration..."
    - >-
      params left empty on purpose. The previously recorded 86M was inferred from the
      ViT-B/16 backbone name and is not stated by the authors anywhere reachable: not in
      the Nat. Med. full text (checked via NCBI efetch on PMC11384335), not in the
      Supplementary Information (all 44 Supplementary Data Tables checked -- Tables 33 and
      34 give layer, head and dimension counts but no parameter total), not in the
      github.com/mahmoodlab/CONCH README, and not in the HuggingFace card or config.json
      (MahmoodLab/CONCH is gated, HTTP 401, and ships pytorch_model.bin rather than
      safetensors so HuggingFace publishes no computed count either). The arXiv preprint
      (2307.12914) does not state one. Separately, 86M would have covered only the vision
      tower: CONCH is an image encoder plus a text encoder plus a multimodal decoder, so a
      single ViT-B/16 figure understates the model regardless of its accuracy.
  added: {date: 2026-08, by: Leo Yin}
- date: 2023-08
  title: A visual-language foundation model for pathology image analysis using medical Twitter
  url: https://www.nature.com/articles/s41591-023-02504-3
  doi: 10.1038/s41591-023-02504-3
  venue: Nat. Med.
  authors:
    first:
      name: Zhi Huang
      scholar: https://scholar.google.com/citations?user=Sh6TgyQAAAAJ&hl=en
    last:
      name: James Zou
      scholar: https://scholar.google.com/citations?user=23ZXZvEAAAAJ&hl=en
  model:
    name: PLIP
    repo: https://github.com/PathologyFoundation/plip
    weights: https://huggingface.co/vinid/plip
  # params stays empty -- genuinely not published. See the verify note for routes tried.
  # _source CONFIRMED: https://huggingface.co/vinid/plip/raw/main/config.json --
  #   architectures ["CLIPModel"]; vision_config patch_size 32, hidden_size 768,
  #   num_hidden_layers 12, image_size 224; text_config hidden_size 512,
  #   num_hidden_layers 12, num_attention_heads 8; projection_dim 512
  backbone: CLIP ViT-B/32 image encoder with a 12-layer, 512-dim Transformer text encoder
  pretraining: [CLIP, contrastive]
  pretraining_detail: CLIP fine-tuned on the OpenPath image-text corpus.
  data:
    description: OpenPath, pathology images paired with natural-language descriptions sourced from medical Twitter
    scale:
      image_text_pairs: 208414
  tasks: [classification, retrieval]
  tasks_detail: >-
    Zero-shot and transfer-learning classification of pathology images, and cross-modal
    image-to-text retrieval.
  modalities: [histopathology, text]
  performance:
    # both rows verified verbatim against the published Nat. Med. abstract (PMID 37592105)
    - benchmark: Zero-shot classification on four external datasets
      metric: F1
      value: "0.565-0.832"
      # _source CHANGED (note only): per-dataset values now readable in the published
      #   Supplementary Information (41591_2023_2504_MOESM1_ESM.pdf, p2)
      note: >-
        range across Kather colon (0.565), PanNuke (0.656), WSSS4LUAD (0.734) and
        DigestPath (0.832); prior CLIP model scores 0.030-0.481
    - benchmark: Supervised classifier on PLIP embeddings
      metric: F1 improvement
      value: "2.5%"
      note: versus other supervised model embeddings
  verify:
    - >-
      params not published. The Supplementary Information was read in full and contains
      no occurrence of "parameter", "million" or "ViT"; there is no PMC record, the
      HuggingFace card is boilerplate copied from OpenAI's CLIP card, and the bioRxiv
      preprint is Cloudflare-blocked. Do not infer a count from "CLIP ViT-B/32".
    - >-
      performance comes from the published abstract, the highest-authority text
      reachable for this paper. The supplement corroborates the per-dataset endpoints.
  added: {date: 2026-08, by: Leo Yin}
