- date: 2026-02
  title: Knowledge-enhanced pretraining for vision-language pathology foundation model on cancer diagnosis
  url: https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00058-9
  doi: 10.1016/j.ccell.2026.01.019
  venue: Cancer Cell
  authors:
    first: {name: Xiao Zhou}
    last:
      name: Weidi Xie
      scholar: https://scholar.google.com/citations?user=Vtrqj4gAAAAJ&hl=zh-CN
  model:
    name: KEEP
    repo: https://github.com/MAGIC-AI4Med/KEEP
  backbone: ViT-L/16 vision encoder with a BERT text encoder
  pretraining: [contrastive, CLIP]
  pretraining_detail: >-
    Knowledge-enhanced vision-language pretraining using semantic-level alignment via
    metric learning within semantic groups guided by a disease knowledge graph.
  data:
    description: >-
      Pathology image-text pairs from OpenPath and Quilt-1M, reorganized into
      semantically structured groups
    scale:
      semantic_groups: 143000
  tasks: [segmentation, detection, subtyping, retrieval, classification]
  tasks_detail: >-
    Zero-shot slide-level cancer region segmentation, cancer detection and subtyping;
    tile-level cross-modal retrieval and zero-shot image classification.
  modalities: [histopathology, text]
  verify:
    - >-
      Crossref dates this 2026-04 (Cancer Cell 44(4)) against the 2026-02 recorded
      here, which is likely the online-first month. Left at 2026-02; correct it if
      the issue date is what we want.
    - >-
      performance and params not filled -- the abstract states no numeric results (only
      dataset counts: 18 public benchmarks, 4 institutional rare cancer datasets) and no
      parameter count. Retried 2026-08: Europe PMC holds the abstract only and there is
      no PMC deposit; cell.com and ScienceDirect both answer with a bot-verification
      challenge, although OpenAlex lists the article as hybrid open access, so a reader
      with browser access should be able to fill both fields. The arXiv preprint
      2412.13126 carries results tables; do not copy them across without checking they
      survived into this Cancer Cell version.
  added: {date: 2026-08, by: Leo Yin}

- date: 2025-11
  title: SMMILe enables accurate spatial quantification in digital pathology using multiple-instance learning
  url: https://www.nature.com/articles/s43018-025-01060-8
  doi: 10.1038/s43018-025-01060-8
  venue: Nat. Cancer
  authors:
    first:
      name: Zeyu Gao
      scholar: https://scholar.google.com/citations?hl=zh-CN&user=CeP6dkcAAAAJ
    last:
      name: Mireia Crispin-Ortuzar
      scholar: https://scholar.google.com/citations?hl=en&user=TRZzLJgAAAAJ
  model:
    name: SMMILe
    repo: https://github.com/ZeyuGaoAi/SMMILe
    params_note: >-
      The paper reports SMMILe's own cost as "1.50 GFLOPS, 1.20 M parameters" for
      1,024-dimension patch embeddings; the frozen ResNet-50/CONCH patch encoder is
      not counted, so this is not comparable to a tile-encoder parameter count.
  params: 1.2M
  backbone: >-
    ResNet-50 and CONCH patch encoders with an instance-based multiple-instance-learning
    architecture using superpatch and refinement modules
  pretraining: [weakly supervised]
  pretraining_detail: >-
    Feature extraction with pretrained encoders (ImageNet ResNet-50, pathology
    foundation model CONCH), then weakly supervised MIL training with slide-level labels.
  data:
    description: 8 datasets covering 6 cancer types
    scale:
      whole_slide_images: 3850
      datasets: 8
      cancer_types: 6
  tasks: [classification, detection, subtyping, grading]
  tasks_detail: >-
    WSI-level classification and patch-level spatial quantification, including metastasis
    detection, subtype prediction and grading.
  modalities: [histopathology]
  performance:
    - benchmark: Ovarian
      metric: macro AUC
      value: "94.11%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings
    - benchmark: Prostate
      metric: macro AUC
      value: "90.92%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings
    - benchmark: Gastric Endoscopy
      metric: macro AUC
      value: "92.75%"
      note: WSI classification with ImageNet ResNet-50 patch embeddings
    - benchmark: Breast, spatial quantification
      metric: spatial F1 gain over second-best method DSMIL
      value: "+23.56%"
  added: {date: 2026-08, by: Leo Yin}

- date: 2025-11
  title: A multimodal whole-slide foundation model for pathology
  url: https://www.nature.com/articles/s41591-025-03982-3
  doi: 10.1038/s41591-025-03982-3
  venue: Nat. Med.
  authors:
    first:
      name: Tong Ding
      scholar: https://scholar.google.com/citations?user=Vwt2ZVYAAAAJ&hl=en
    last:
      name: Faisal Mahmood
      scholar: https://scholar.google.com/citations?user=9MsdbKoAAAAJ&hl=en
  model:
    name: TITAN
    repo: https://github.com/mahmoodlab/TITAN
    weights: https://huggingface.co/MahmoodLab/TITAN
  params: 48.5M
  backbone: ViT slide encoder (Transformer-based Image and Text Alignment Network) over CONCH v1.5 patch features
  pretraining: [self-supervised, contrastive, CLIP]
  pretraining_detail: >-
    Visual self-supervised pretraining followed by vision-language alignment against
    pathology reports and synthetic captions generated by a pathology multimodal copilot.
  data:
    description: Whole-slide images with paired pathology reports and synthetic captions
    scale:
      whole_slide_images: 335645
      synthetic_captions: 423122
  tasks: [classification, subtyping, retrieval, report generation, survival prediction]
  tasks_detail: >-
    Slide-level representation without fine-tuning, rare disease recognition, cancer
    outcome prediction and pathology report generation.
  modalities: [histopathology, text]
  performance:
    - benchmark: Linear probe, morphological subtyping tasks
      metric: gain over next-best slide model PRISM
      value: "+8.4%"
      note: average over multiclass (balanced accuracy) and binary subtyping (AUROC) tasks
    - benchmark: Zero-shot multiclass classification
      metric: balanced accuracy gain over PRISM
      value: "+56.52%"
      note: binary subtyping AUROC gain reported as +13.8%
    - benchmark: Rare-cancer retrieval
      metric: Accuracy@K gain over PRISM
      value: "+14.8%"
      note: MVAcc@K gain reported as +18.1%
    - benchmark: Disease-specific survival prediction
      metric: concordance index gain over CHIEF
      value: "+3.62%"
  verify:
    - >-
      performance rows are the relative gains over the next-best baseline that the paper
      states in running text. Absolute TITAN scores sit in the figures and supplementary
      tables, which were not readable from the accessible full text -- replace these rows
      with absolute values if someone has the PDF.
    - >-
      params 48.5M is quoted by the paper for TITAN ("TITAN and TITAN V, with 48.5 million
      and 42.1 million parameters"). It is a slide-encoder count and excludes the CONCH
      v1.5 patch encoder, so it is not comparable with tile-encoder counts such as
      Virchow's 632M.
  added: {date: 2026-08, by: Leo Yin}

