      value: "0.937"
      note: seven rare cancer types
    - benchmark: Pan-cancer detection at 95% sensitivity
      metric: specificity
      value: "72.5%"
      note: UNI 68.9%, Phikon 62.9%, CTransPath 52.3%
    # _source: PMC11485232 -- the "(product testing dataset)" qualifier was removed. The
    #   sentence carrying 0.980 does not name a dataset; only the Fig. 3b legend does.
    #   Value and the 0.995 comparison are quoted verbatim from the body text.
    - benchmark: Prostate cancer detection versus the Paige Prostate clinical product
