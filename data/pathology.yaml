  backbone: ViT tile encoder with a LongNet slide-level encoder
  pretraining: [DINOv2, MAE]
  pretraining_detail: >-
    DINOv2 tile-level pretraining followed by masked autoencoder pretraining with LongNet
    over whole slides.
  data:
    description: Real-world H&E slides from the Providence health network
    scale:
      whole_slide_images: 171189
  tasks: [classification, subtyping, mutation prediction, biomarker prediction]
  tasks_detail: 26 prediction tasks spanning pathomics and cancer subtyping.
  modalities: [histopathology]
  performance:
    - benchmark: Digital pathology benchmark (26 tasks)
      metric: tasks at state of the art
      value: "25/26"
      note: significant improvement over the second-best method in 18 tasks
    - benchmark: Cancer subtyping across nine cancer types
      metric: AUROC
      value: "0.903"
      note: average; falls to 0.886 with a randomly initialised LongNet
    - benchmark: LUAD five-gene mutation prediction
      metric: macro-AUROC
      value: "0.626"
      note: average over EGFR, FAT1, KRAS, TP53, LRP1B on Prov-Path
    - benchmark: Pan-cancer tumour mutation burden prediction
      metric: AUROC
      value: "0.708"
      note: average
  verify:
    - >-
      params not filled -- the paper states no parameter count for the released
      Prov-GigaPath. The only count it gives is for a different, smaller model ("a smaller
      version of Prov-GigaPath using 23 million parameters"), and the tile encoder is
      described only as "the ViT model architecture with standard DINOv2 settings". The
      TITAN paper quotes 86.3M for GigaPath's slide encoder; that is a third-party figure
      and was deliberately not carried across.
  added: {date: 2026-08, by: Leo Yin}

