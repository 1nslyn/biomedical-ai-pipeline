# Pathology -- histopathology, whole-slide imaging and computational pathology.
#
# Source of truth for pathology.md. After editing, run:
#     python scripts/build.py
# CI will reject the PR if the generated markdown is out of date.
#
# Field reference: CONTRIBUTING.md

- date: 2026-09
  title: Ensemble learning of pathology foundation models for precision oncology
  # _source: bibliographic fields from scripts/fetch_meta.py (Crossref); the url is the
  #          publisher landing page, matching the KEEP entry below. That page was
  #          deliberately not fetched -- see the first verify note.
  url: https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00385-5
  doi: 10.1016/j.ccell.2026.08.008
  venue: Cancer Cell
  authors:
    first:
      name: Xiangde Luo
      # _source: the profile itself, opened sorted by publication date. Its newest entry
      #          is "Ensemble learning of pathology foundation models for precision
      #          oncology / X Luo, X Wang, F Eweje, X Zhang, JLG Marti, S Cascarino,
      #          S Yang, Y Li, ... / Cancer Cell, 2026" -- this paper, with this author
      #          string. Profile titled "Xiangde Luo", affiliation "Stanford University",
      #          email verified at stanford.edu, interests include "computational
      #          pathology". ORCID 0000-0001-8574-0005 lists no researcher-urls, so the
      #          link did not come from there.
      scholar: https://scholar.google.com/citations?user=dD4HLS4AAAAJ&hl=en
    last:
      name: Ruijiang Li
      # _source: the profile itself. Titled "Ruijiang Li", affiliation "Stanford
      #          University", email verified at stanford.edu, interests "Foundation
      #          models, histopathology, spatial transcriptomics, spatial proteomics,
      #          oncology". This paper is not yet listed on it, but the publication list
      #          is unambiguously this lab's: "nnMIL: A generalizable multiple instance
      #          learning framework for computational pathology / X Luo, J Xiang, Y Ji,
      #          R Li" (2025), plus 2026 Cell and Nat. Med. papers carrying the same ELF
      #          co-author roster. ORCID 0000-0002-0232-5998 lists no researcher-urls.
      scholar: https://scholar.google.com/citations?user=Y89JnCYAAAAJ&hl=en
  model:
    name: ELF
    # _source: article Data and code availability -- "All original code is publicly
    #          available at https://github.com/lilab-stanford/ELF, including pretraining,
    #          inference, and evaluation code." The repo description is "Ensemble
    #          Learning of Foundation Models".
    repo: https://github.com/lilab-stanford/ELF
    # _source: the repository README, Step 2 -- "Pretrained inference weights:
    #          huggingface.co/luoxd96/ELF". luoxd96 is first author Xiangde Luo's own
    #          account, and the model card opens "ELF (Ensemble Learning of Foundation
    #          models) is a slide-level pathology encoder from the Li Lab at Stanford".
    #          The article's own Data and code availability instead gives a Google Drive
    #          file, https://drive.google.com/file/d/1t79jlus2ZfVe6RGS4bqX1oJhmypdxyGb/view
    #          -- both are author-published; the Hugging Face repo is the versioned one.
    weights: https://huggingface.co/luoxd96/ELF
    # _source: repository README, License -- "This code is made available under the GPLv3
    #          License and is available for non-commercial academic purposes".
    #          Corroborated by https://huggingface.co/api/models/luoxd96/ELF ->
    #          cardData.license "gpl-3.0". The GitHub API reports no license only because
    #          the repo ships no LICENSE file.
    license: GPL-3.0
  # _source: STAR Methods, "Slide encoder" -- "ELF contains only 14.3 million (M)
  #          parameters, fewer than the other evaluated slide encoders, including
  #          COBRAII (15.5 M), TITAN (48.5 M), and Prov-GigaPath (86.3 M)." This is the
  #          only parameter count anywhere in the article. It covers ELF's own ensemble
  #          slide encoder; the five tile-level foundation models stay frozen and are not
  #          counted. See the verify note on the released checkpoint's smaller figure.
  params: 14.3M
  params_scope: ensemble slide enc.
  # Scan-table copy. Both summarise fields that already appear below and add no claim.
  pretraining_short: MoCo v3 contrastive + weak supervision
  # 53,699 is the pretraining corpus; the authors split it "90% for training and 10% for
  # validation". Every number in `performance` comes from separate evaluation cohorts.
  training_slides: 53.7K (90/10 train/val)
  # _source: STAR Methods, "Slide encoder" -- "ELF employs the attention-based multiple
  #          instance learning (ABMIL) model with multiple attention heads as a
  #          backbone"; "input patch embeddings from different foundation models with
  #          varying dimensions X in R^(Nx768), R^(Nx1024), R^(Nx1280), R^(Nx1536) are
  #          dynamically resized to a unified dimensional space X768 in R^(Nx768) using
  #          linear interpolation ... normalized with a LayerNorm layer before the
  #          attention computation"; "a fixed 8-head attention mechanism where input
  #          features X768 are reshaped into R^(Nx96x8) ... Each head employs a separate
  #          ABMIL network with hidden dimensions of 96, following the gated attention
  #          formulation with two parallel branches"; "These slide embeddings are fused by
  #          concatenation as the final slide representation". Constituent models from
  #          "Model design and pretraining" -- "patch-level features were extracted using
  #          five state-of-the-art foundation models with their default settings: UNI,
  #          CONCHV1.5, GigaPath, H-optimus-08, and Virchow2".
  backbone: >-
    An 8-head gated ABMIL slide encoder of 14.3M parameters sitting on top of five frozen
    tile-level pathology foundation models -- UNI, CONCH v1.5, Prov-GigaPath, Virchow2 and
    H-optimus-0. Their 768- to 1,536-dimensional patch embeddings are linearly interpolated
    to a common 768 dimensions and LayerNormed; attention is averaged across the eight
    heads and applied to both the unified and the native-width features, and the five
    per-model slide embeddings are concatenated into the final slide representation.
  pretraining: [MoCo, contrastive, weakly supervised]
  # _source: STAR Methods, "Contrastive pretraining" -- "We trained ELF with the momentum
  #          contrastive learning framework (MoCoV3), which consists of a base encoder and
  #          a momentum encoder"; the dual positive-sampling description; "The contrastive
  #          loss follows the InfoNCE formulation ... tau = 0.2". "Weakly-supervised
  #          pretraining" -- "a binary cancer classification head ... and a multi-class
  #          organ classification head that predicts the anatomical tissue of origin
  #          across 20 different organs", combined as L_total = L_cont + lambda * L_cls.
  #          "Pretraining settings" -- "We pretrained ELF with 53,699 WSIs (90% for
  #          training and 10% for validation) and the combination objective function
  #          L_total for 300 epochs using distributed training across 8 NVIDIA H100 GPUs
  #          with a total effective batch size of 768 samples. Each sample consisted of up
  #          to 4,096 patch embeddings"; AdamW, cosine decay from a peak learning rate of
  #          1e-4 with a 10-epoch warm-up, weight decay 0.05, key-encoder momentum
  #          cosine-scheduled from 0.996 to 0.999, lambda = 1.
  pretraining_detail: >-
    No tile encoder is trained here: the five foundation models stay frozen and only the
    slide-level ensemble module is pre-trained. MoCo v3 momentum contrastive learning
    aligns slide embeddings under a dual positive-sampling scheme -- the same tissue region
    embedded by two different foundation models, giving model invariance, and two spatially
    overlapping regions embedded by the same model, giving view consistency -- with
    non-overlapping regions, both across and within models, as negatives. InfoNCE loss at
    temperature 0.2. Two auxiliary weakly supervised heads predict cancer versus normal and
    the anatomical site among 20 organs, weighted equally with the contrastive loss. 300
    epochs on 8 NVIDIA H100 GPUs at an effective batch size of 768 slides and up to 4,096
    patch embeddings per sample.
  data:
    # _source: STAR Methods, "Data curation for pretraining" -- "we collected 53,699
    #          whole-slide images (WSIs) and their corresponding clinical information (such
    #          as tissue of origin and tissue type: cancer vs normal) from 11 publicly
    #          available datasets, including ACROBAT, BCNB, COBRA, DHMC, GTEx, IMP-CRS,
    #          IPD-Brain, NMI-Bladder, PAIP, PANDA, TCGA. In the TCGA, we only used four
    #          cohorts: TCGA-THCA, TCGA-CESC, TCGA-ESCA, and TCGA-UCEC ... All images of
    #          this training set are formalin-fixed paraffin-embedded tissues stained with
    #          haematoxylin and eosin (H&E) and come from 20 anatomic sites".
    description: >-
      Formalin-fixed paraffin-embedded H&E whole-slide images from 11 public datasets
      (ACROBAT, BCNB, COBRA, DHMC, GTEx, IMP-CRS, IPD-Brain, NMI-Bladder, PAIP, PANDA and
      four TCGA cohorts) across 20 anatomic sites, carrying only coarse clinical labels --
      tissue of origin, and cancer versus normal. Downstream evaluation uses separate
      public benchmarks plus retrospective Stanford and MSKCC treatment cohorts that are
      not publicly available.
    scale:
      # _source: "Data curation for pretraining", quoted above.
      pretraining_whole_slide_images: 53699
      pretraining_datasets: 11
      anatomical_sites: 20
      # _source: Results, "Design and evaluation of ensemble learning of foundation
      #          models" -- "ELF was evaluated on a wide range of clinical applications,
      #          including classification and subtyping of 4,697 tumor samples, 98
      #          combinations of biomarker-indication assessment in 11,530 patients, and
      #          therapeutic response prediction in 21 independent cohorts of 1,736
      #          patients across 9 cancer types". Kept under evaluation_* keys on purpose
      #          so they can never be mistaken for the pretraining corpus.
      evaluation_subtyping_slides: 4697
      evaluation_biomarker_patients: 11530
      evaluation_response_patients: 1736
  tasks: [classification, subtyping, biomarker prediction, mutation prediction, treatment response, regression, risk prediction]
  # _source: STAR Methods, "Model evaluation and datasets" -- "we adopted a linear probing
  #          strategy (logistic regression) for all downstream tasks with the frozen ELF
  #          slide encoder. Additionally, we also evaluated the performance of ELF in the
  #          aneuploidy regression task using XGB with the same linear probing strategy";
  #          plus the per-task subsections and the Results sections for each application.
  tasks_detail: >-
    Everything is linear probing on the frozen ELF slide embedding -- logistic regression,
    or XGBoost for the regression task. Disease classification and subtyping on BCCC skin
    (2/3/5 classes), BRACS breast (7 classes) and EBRAINS brain (12/30 classes). Molecular
    biomarker detection over 84 TCGA biomarker-indication combinations spanning 28
    clinically actionable alterations and 14 cancer types, plus BRAF, KRAS and MSI status
    across four colorectal cohorts, pan-cancer aneuploidy-score regression, whole-genome
    doubling and tumour mutational burden classification. Response prediction for platinum
    chemotherapy, trastuzumab and bevacizumab, and durable response to immune checkpoint
    inhibitors across 13 cohorts and 8 cancer types, with Kaplan-Meier stratification of
    progression-free and recurrence-free survival from the ELF risk score.
  # A pure vision model: the authors call ELF and Prov-GigaPath "both pure vision
  # encoders". PD-L1, TMB and CD8 enter only as separate covariates in downstream logistic
  # regressions, never as model input, so they are not a modality of this model.
  modalities: [histopathology]
  performance:
    # _source: Results, "Disease classification and subtyping" -- "ELF consistently
    #          achieved the highest performance across all tasks, surpassing the
    #          second-best model, TITAN, by an average of 2.2% across all datasets and up
    #          to 16.3% on BRACS"; "On the BRACS dataset (7 cls breast subtyping), ELF
    #          achieved a BA of 0.457 (95% CI: 0.359-0.566), representing a 16.3% relative
    #          improvement over TITAN (0.393), and substantially outperforming other models
    #          such as CHIEF (0.384) and Prov-GigaPath (0.323)"; "for brain tumour
    #          subtyping on EBRAINS, ELF achieved 0.907 (95% CI: 0.869-0.944) BA (12 cls)
    #          and 0.757 (95% CI: 0.716-0.795) (30 cls)"; "on EBRAINS (30 classes), ELF
    #          achieved a BA of 0.757, outperforming the best individual model, Virchow2,
    #          with a BA of 0.702".
    - benchmark: BRACS 7-class breast and EBRAINS 30-class brain subtyping (held-out test sets)
      metric: balanced accuracy
      value: "0.457 / 0.757"
      note: >-
        BRACS (n = 87) 0.457 against TITAN 0.393, CHIEF 0.384 and Prov-GigaPath 0.323;
        EBRAINS 30-class (n = 573) 0.757 against 0.702 for Virchow2, the best single
        foundation model. Across all six subtyping tasks ELF beats TITAN by 2.2% on average.
    # _source: Results, "Molecular biomarker detection" -- "On the TCGA, ELF achieved a mean
    #          area under the receiver operating characteristic curve (AUC) of 0.719 +/-
    #          0.142 across 84 biomarker-indication combinations, significantly surpassing
    #          prior foundation models, including TITAN (0.701 +/- 0.154), CHIEF (0.676 +/-
    #          0.162), and Prov-GigaPath (0.678 +/- 0.149) (P < 0.05)". Cohort size from the
    #          Figure 3A caption -- "14 cancer types and 28 biomarkers (n = 6,510 patients
    #          represented by 7,721 WSIs)".
    - benchmark: TCGA pan-cancer biomarker detection, 84 biomarker-indication combinations
      metric: mean AUC
      value: "0.719"
      note: >-
        standard deviation 0.142, over 28 actionable alterations in 14 cancer types (6,510
        patients, 7,721 WSIs); TITAN 0.701, Prov-GigaPath 0.678, CHIEF 0.676 (P < 0.05)
    # _source: Results, "Molecular biomarker detection" -- "For BRAF mutation prediction,
    #          ELF consistently outperformed competing models across four cohorts with an
    #          average AUC of 0.806 +/- 0.021 ... These represented notable AUC improvements
    #          ranging up to 13% compared to the existing model CHIEF (P<0.01)"; "For MSI
    #          status prediction, ELF achieved excellent performance with an average AUC of
    #          0.886 +/- 0.015 across the four cohorts ... consistently exceeding the
    #          second-best model (CHIEF) up to 7%".
    - benchmark: Colorectal cancer MSI and BRAF status, four cohorts (SR386, SR1482, MCO, TCGA-CRC)
      metric: mean AUC
      value: "0.886 / 0.806"
      note: >-
        MSI 0.886 and BRAF 0.806 averaged over the four cohorts, three of which are
        external; up to 7% (MSI) and 13% (BRAF) above the second-best model, CHIEF
    # _source: Results, "Anticancer therapy response prediction" -- "ELF demonstrated strong
    #          performance in metastatic breast cancer (Metastatic breast (Platinum), n =
    #          77) and high-grade serous ovarian cancer (Ovary (Platinum), n = 158),
    #          achieving AUCs of 0.710 +/- 0.032 and 0.761 +/- 0.018 ... ELF achieved
    #          similarly high performance in Breast (Trastuzumab, Yale) cohort treated with
    #          trastuzumab (AUC = 0.749 +/- 0.040, n = 85) and Ovary (Bevacizumab) patients
    #          treated with bevacizumab (AUC = 0.817 +/- 0.076, n = 36). Across all four
    #          cohorts, ELF achieved an overall mean AUC of 0.759, outperforming two
    #          existing slide-level foundation models by 7%-9% (Prov-GigaPath and CHIEF)".
    - benchmark: Anticancer therapy response, four cohorts (platinum, trastuzumab, bevacizumab)
      metric: mean AUC
      value: "0.759"
      note: >-
        metastatic breast/platinum 0.710 (n = 77), ovary/platinum 0.761 (n = 158),
        breast/trastuzumab 0.749 (n = 85), ovary/bevacizumab 0.817 (n = 36); 7-9% above
        Prov-GigaPath and CHIEF
    # _source: Results, "Immunotherapy response prediction" -- "Across all eight cancer
    #          types, ELF achieved a mean AUC of 0.724, with a higher mean AUC than the
    #          evaluated foundation models (Prov-GigaPath, CHIEF, and TITAN) with mean AUCs
    #          ranging from 0.612 to 0.664 (P < 0.05)". Cohort count and n from the same
    #          section and the Figure 5A caption -- "13 cohorts (n = 1,057)". Endpoint
    #          definition -- "Durable response was defined as PFS >= 6 months for
    #          advanced-disease cohorts and PFS >= 24 months for non-advanced-disease
    #          cohorts. For the breast neoadjuvant cohort, response was instead defined as
    #          pathological complete response (pCR) at surgery."
    - benchmark: Immune checkpoint inhibitor durable response, 13 cohorts across 8 cancer types
      metric: mean AUC
      value: "0.724"
      note: >-
        n = 1,057 patients; baselines 0.612-0.664 for Prov-GigaPath, CHIEF and TITAN
        (P < 0.05). Durable response is PFS >= 6 months in advanced disease, PFS >= 24
        months otherwise, and pCR in the breast neoadjuvant cohort.
  verify:
    - >-
      every field here was read from the NIH author manuscript deposited at PMC13564370,
      which PMC labels "Published before final editing as: Cancer Cell. 2026 Sep 10" -- an
      accepted, pre-copyedit version, not the version of record. The publisher page
      (cell.com / ScienceDirect) was deliberately NOT attempted: add-paper.md says Elsevier
      sits behind Cloudflare or a CAPTCHA and must be flagged for a human rather than
      worked around. Re-check the quoted numbers against the final VOR when someone has
      browser access.
    - >-
      params 14.3M is the article's own figure and covers ELF's ensemble slide encoder
      only. The five constituent tile-level foundation models are frozen, are not retrained
      and are not included; a reader wanting total inference cost must add them. The
      released inference checkpoint disagrees in scope rather than in fact: config.json at
      huggingface.co/luoxd96/ELF reports "n_params": 151304 for the inference-only forward
      path the card describes as "momentum_enc.norm+attn", which excludes the per-model
      ABMIL branches and the training-only heads. The paper's figure is the one recorded.
    - >-
      an arXiv preprint of this work exists, 2508.16085, cited by the authors' own GitHub
      README and Hugging Face card. It was NOT used as a source for anything in this record
      -- every quoted number comes from the Cancer Cell author manuscript -- and its
      abstract wording already differs from the published one, so preprint figures may
      differ too.
    - >-
      the supplement (Figures S1-S19, Tables S1-S17, NIHMS2205925-supplement-1.pdf) was not
      read. Europe PMC refuses it ("Article with id PMC13564370 is not open access one")
      and the PMC copy is served behind a proof-of-work bot check, which was not defeated.
      So no per-table number appears here: Tables S1-S3 (aggregation and ensemble
      ablations), S4 (KRAS and PPV/NPV), S5 (per-cohort immunotherapy AUCs) and S7
      (pretraining data distribution) are all unverified.
    - >-
      the article's own counts for the evaluation set are stated at two different
      granularities and were not reconciled: the summary and Results say "98 combinations of
      biomarker-indication assessment in 11,530 patients" and the Discussion says "125
      diverse tasks", while the headline TCGA analysis in Figure 3A is 84 combinations in
      6,510 patients / 7,721 WSIs. The 98/11,530 figure appears to span all biomarker work
      (TCGA plus the CRC, aneuploidy, WGD and TMB analyses); data.scale records 11,530 and
      performance records the 84/6,510 figure, each with its own source.
    - >-
      model.weights points at the first author's Hugging Face repo, which the authors'
      README names. The article's Data and code availability instead gives a Google Drive
      file (drive.google.com/file/d/1t79jlus2ZfVe6RGS4bqX1oJhmypdxyGb). Neither was
      downloaded; the two were not checked against each other.
  added: {date: 2026-09, by: Leo Yin}
- date: 2026-09
  title: SlideChat is a multimodal generative artificial intelligence assistant for whole-slide computational pathology across cancer types
  url: https://www.nature.com/articles/s43018-026-01220-4
  doi: 10.1038/s43018-026-01220-4
  venue: Nat. Cancer
  authors:
    first:
      name: Ying Chen
      # _source: no verified profile. The article lists no ORCID for this author, the
      #          name is too common to disambiguate, and a Google Scholar author search
      #          returned a CAPTCHA interstitial, which was not worked around.
      scholar: null
    last:
      name: Yuanfeng Ji
      # _source: the author's ORCID record, 0000-0001-6799-5493 (given on the article
      #          page), carries no researcher-urls, so there is no author-asserted
      #          Scholar link to copy. Google Scholar search returned a CAPTCHA page.
      scholar: null
  model:
    name: SlideChat
    # _source: article Code availability -- "The source code for model training and
    #          inference is publicly available at https://github.com/uni-medical/SlideChat.
    #          The model weights are available at
    #          https://huggingface.co/General-Medical-AI/SlideChat_Weight."
    repo: https://github.com/uni-medical/SlideChat
    # NOTE: the weights repo is gated -- an unauthenticated fetch of its model card
    #       returns HTTP 401 "Access to model ... is restricted".
    weights: https://huggingface.co/General-Medical-AI/SlideChat_Weight
    # _source: https://api.github.com/repos/uni-medical/SlideChat -> license.spdx_id
    #          on the repository the article's Code availability names as official.
    license: Apache-2.0
  # params: deliberately absent -- see the verify notes for every route worked.
  params: null
  params_status: not published
  # _source: the authors' README on the repo named in Code availability -- "SlideChat
  #          was trained for two stages: (1) Cross-Domain Alignment ... (2) Visual
  #          Instruction Learning". 43 characters.
  pretraining_short: cross-domain alignment → instruction tuning
  # Stage-1 WSI-caption count, not an evaluation figure. SlideBench's 8,836 closed
  # questions and 3,149 reports are evaluation sets and are deliberately not used here.
  training_slides: 8,583 (TCGA)
  # _source: the authors' GitHub README (Training) -- "SlideChat serializes each input
  #          WSI into a sequence of patches, converting each into visual embeddings with
  #          a patch-level encoder CONCH. A slide-level encoder then interacts with these
  #          features to generate contextual embeddings. Then, a multimodal projector maps
  #          the visual features from the slide-level encoder into a unified space, aligned
  #          seamlessly with the LLM." The slide encoder is identified in the peer-review
  #          file (MOESM3), authors' response to Comment 6: "a LongNet-based encoder with
  #          sparse attention enables efficient processing of the resulting token sequence".
  #          The LLM is Qwen2.5-7B-Instruct per the authors' arXiv/CVPR preprint
  #          (arXiv:2410.11761v3): "the patch-level encoder CONCH, the slide-level encoder
  #          LongNet, and utilizes the Qwen2.5-7B-Instruct"; Reviewer #2's summary of this
  #          manuscript likewise calls it "a Qwen2.5-7B large language model (LLM)". See the
  #          verify note -- the published article's own architecture text is paywalled.
  backbone: >-
    Frozen CONCH patch-level encoder over 224x224 tiles, a LongNet slide-level encoder with
    sparse dilated attention that contextualises the tile tokens, and a multimodal projector
    ("connector") mapping slide tokens into the embedding space of a Qwen2.5-7B-Instruct LLM
  pretraining: [next-token prediction, instruction tuning]
  # _source: stage names and what is frozen from the authors' GitHub README -- "(1)
  #          Cross-Domain Alignment: SlideChat is trained to generate descriptive captions
  #          using WSI-caption pairs from SlideInstruction. Specifically, only the
  #          slide-level encoder and projection are updated, while the patch-level encoder
  #          and LLM weights remain fixed; (2) Visual Instruction Learning: we utilize WSI
  #          VQAs from SlideInstruction, allowing the slide encoder, projection layer, and
  #          large language model components to be fully trainable". Sample counts and
  #          hyperparameters from the revised Methods (page 26) quoted verbatim by the
  #          authors in the peer-review file, MOESM3: "in the first stage, we use 8,583
  #          WSI-caption pairs ... Only the parameters of the slide-level encoder Eslide and
  #          LLM connector Econn are updated. This stage runs for 3 epochs on 8 A100 GPUs
  #          (80GB) with a batch size of 1 per GPU, taking approximately 3 hours ... AdamW
  #          optimizer with a learning rate of 1e-3 ... In the second stage, the slide-level
  #          encoder, the connector, and the LLM are jointly optimized. We use 265,650 QA
  #          pairs ... trained for 1 epoch ... learning rate of 2e-5 ... approximately 24
  #          hours", corroborated by Supplementary Table 19 (MOESM1).
  pretraining_detail: >-
    No pathology pre-training of its own: the CONCH tile encoder is reused frozen and the
    work trains the slide encoder, connector and LLM in two supervised generative stages.
    Stage 1, Cross-Domain Alignment, fits 8,583 WSI-caption pairs with only the LongNet
    slide encoder and the LLM connector unfrozen (3 epochs, AdamW, lr 1e-3, ~3 h). Stage 2,
    Visual Instruction Learning, tunes the slide encoder, connector and LLM jointly on
    265,650 instruction/QA pairs (1 epoch, AdamW, lr 2e-5, ~24 h). Both stages ran on
    8 x A100 80GB with a per-GPU batch size of 1.
  data:
    # _source: abstract -- "Using 274,233 multimodal instruction samples ... Evaluated on
    #          8,836 closed-ended questions, 129 open-ended questions and 3,149 WSI reports
    #          from five cohorts spanning 31 cancer types". Supplementary Table 2 (MOESM1)
    #          itemises SlideInstruction over 31 TCGA cancer types; its Caption column sums
    #          to 8,583 and its Stage-2 total to 265,650 (120,146 open + 145,504 closed),
    #          and 8,583 + 265,650 = 274,233 exactly. Supplementary Table 3 itemises
    #          SlideBench, whose closed subsets sum to 8,836 (TCGA 3,176 + BCNB 4,232 +
    #          CPTAC 240 + HISTAI 769 + MOP 419) and whose report subsets sum to 3,149
    #          (TCGA 1,547 + CPTAC 38 + HISTAI 1,145 + MOP 419).
    description: >-
      SlideInstruction, built by prompting GPT-4 over TCGA whole-slide images and their
      paired pathology reports across 31 cancer types, giving one caption per slide for
      stage 1 and open-ended plus multiple-choice instruction pairs for stage 2. Evaluation
      uses SlideBench, the accompanying benchmark, over five cohorts: TCGA, BCNB, CPTAC, the
      public HISTAI set and MOP, a private Eastern Hepatobiliary Surgery Hospital cohort.
    scale:
      whole_slide_images: 8583
      captions: 8583
      vqa_pairs: 265650
      instruction_samples: 274233
      cancer_types: 31
      benchmark_closed_questions: 8836
      benchmark_open_questions: 129
      benchmark_reports: 3149
  tasks: [visual question answering, report generation, captioning, classification, subtyping, grading, biomarker prediction, benchmarking]
  # _source: Supplementary Table 4 (MOESM1) lists the SlideBench-Closed TCGA categories --
  #          Microscopy (tissue architecture, tumour characteristics, cytomorphology,
  #          histopathological changes), Diagnosis (disease detection, disease
  #          classification, staging, grading, differential diagnosis) and Clinical
  #          (treatment guidance, biomarker analysis, risk factors, prognostic assessment);
  #          Supplementary Table 3 gives the open-ended and report subsets; the authors'
  #          README reports BCNB ER/PR/HER2 status and CPTAC subtype classification.
  tasks_detail: >-
    Slide-level multiple-choice visual question answering across microscopy, diagnosis and
    clinical question categories (disease detection and classification, staging, grading,
    differential diagnosis, biomarker analysis, treatment guidance, prognostic assessment);
    free-text open-ended question answering scored by pathologists on five dimensions;
    free-text pathology report generation; and WSI captioning as the stage-1 objective.
    The work also releases SlideBench, a five-cohort WSI benchmark, and evaluates GPT-4o,
    MedDr, Quilt-LLaVA, LLaVA-Med, HistoGPT and PRISM on it.
  modalities: [histopathology, text]
  performance:
    # _source: abstract, verbatim -- "SlideChat outperformed leading baselines by 19.1% in
    #          closed-ended accuracy and by 7.7% in report-generation Metric for Evaluation
    #          of Translation with Explicit Ordering score and received the highest expert
    #          ratings across five dimensions in open-ended question answering".
    - benchmark: SlideBench, five cohorts (8,836 closed questions, 129 open questions, 3,149 reports)
      metric: margin over leading baselines
      value: "+19.1% accuracy / +7.7% METEOR"
      note: >-
        the abstract's headline margins, for closed-ended accuracy and report-generation
        METEOR respectively; SlideChat also took the highest expert ratings on all five
        open-ended scoring dimensions
    # _source: the authors' GitHub README, closed-ended table, under the heading "The
    #          results below correspond to the expanded journal version of SlideChat":
    #          TCGA Overall SlideChat 0.741 +/- 0.008, GPT-4o 0.557, MedDr 0.490,
    #          Quilt-LLaVA 0.256, LLaVA-Med 0.298. Supplementary Table 20 (MOESM1)
    #          independently gives 0.741 for turn 1 over the same N = 3,176.
    - benchmark: SlideBench-Closed (TCGA, N = 3,176)
      metric: accuracy
      value: "0.741"
      note: >-
        versus GPT-4o 0.557, MedDr 0.490, LLaVA-Med 0.298 and Quilt-LLaVA 0.256. Averaged
        over five conversational turns rather than turn 1, Supplementary Table 20 reports
        0.720 +/- 0.011.
    # _source: the authors' GitHub README, closed-ended table, Overall rows -- BCNB 0.789
    #          +/- 0.006 (best baseline GPT-4o 0.602), CPTAC 0.517 +/- 0.033 (best baseline
    #          MedDr 0.358), HISTAI 0.761 +/- 0.016 (best baseline GPT-4o 0.505). Cohort
    #          sizes from Supplementary Table 3 (MOESM1).
    - benchmark: SlideBench-Closed external cohorts (BCNB / CPTAC / HISTAI)
      metric: accuracy
      value: "0.789 / 0.517 / 0.761"
      note: >-
        N = 4,232 / 240 / 769; best baseline per cohort 0.602 (GPT-4o), 0.358 (MedDr) and
        0.505 (GPT-4o). The private MOP cohort (N = 419) is evaluated in the paper but no
        per-cohort figure is quotable from a reachable source.
    # _source: the authors' GitHub README, "Report Generation" METEOR table, Overall rows --
    #          TCGA SlideChat 0.214 +/- 0.001 vs HistoGPT 0.097 and PRISM 0.025; CPTAC 0.140
    #          vs 0.139 and 0.059; HISTAI 0.106 vs 0.065 and 0.018.
    - benchmark: SlideBench-Report (TCGA, N = 1,547)
      metric: METEOR
      value: "0.214"
      note: >-
        versus HistoGPT 0.097 and PRISM 0.025. On the external sets SlideChat scores 0.140
        on CPTAC (HistoGPT 0.139, PRISM 0.059) and 0.106 on HISTAI (0.065, 0.018).
  verify:
    - >-
      Journal full text not reachable: the article is subscription content. nature.com with
      a browser User-Agent 303s and then serves only the abstract, Data/Code availability,
      the Extended Data figure captions and the reference list -- Results, Methods and
      Figs. 1-5 are behind the paywall. Europe PMC has the record (PMID 42680939) but
      isOpenAccess N, inEPMC N, no PMCID; OpenAlex reports oa_status "closed" with no
      repository copy, and Semantic Scholar likewise "CLOSED". Every field here therefore
      rests on the abstract, the Extended Data captions, the Springer supplements
      (MOESM1 Supplementary Tables 1-28, MOESM3 peer-review file) and the authors' own
      GitHub README -- not on the published Results or Methods text.
    - >-
      params not published. No author source states a parameter count for the released
      SlideChat. Routes worked: the article page (no count in the reachable text), the
      Supplementary Information PDF (its only "Parameter" heading is Supplementary Table 19,
      a hyperparameter table), the peer-review file, the GitHub README, the arXiv/CVPR
      preprint, and the Hugging Face weights repo -- which is gated (HTTP 401 on the model
      card) and whose file listing is DeepSpeed .pt shards with no config.json and no
      safetensors index, so no count could be read there either. The LLM is Qwen2.5-7B-
      Instruct, but that is a backbone name rather than a stated count for the released
      model, and the LongNet slide encoder and connector sizes are stated nowhere. Do not
      promote "7B" into this field without an author statement.
    - >-
      Backbone LLM identity is corroborated, not published-article-sourced. For the journal
      model, "a Qwen2.5-7B large language model (LLM)" appears only in Reviewer #2's summary
      in the peer-review file; the authors' own Methods text quoted in their rebuttal never
      names the LLM, and the README gives "internlm/internlm2-chat-7b or
      Qwen/Qwen2.5-7B-Instruct" only as examples of the llm_name_or_path config value. The
      authors' arXiv:2410.11761v3 / CVPR 2025 preprint does state they use Qwen2.5-7B-
      Instruct. Confirm against the published Methods when someone has access.
    - >-
      Performance rows 2-4 come from the authors' GitHub README, which labels its tables
      "the results below correspond to the expanded journal version of SlideChat". They
      could not be checked against Figs. 2-4 or the Results text, which are paywalled.
      Supplementary Table 20 independently reproduces the TCGA closed-ended 0.741 at turn 1,
      which is the only cross-check available.
    - >-
      Preprint/earlier-version numbers deliberately excluded. The peer-review file summarises
      an earlier manuscript with different headline margins (21.7% accuracy, 11.4% METEOR);
      the published abstract's 19.1% / 7.7% are what is recorded. The arXiv/CVPR version is
      a smaller study -- its README note says the Nature Cancer work "substantially extends
      our original CVPR 2025 work with a larger instruction dataset" -- so none of its data
      or benchmark numbers are used here, only the architecture.
    - >-
      Scholar profiles left null for both authors. Yuanfeng Ji's ORCID (0000-0001-6799-5493)
      lists no researcher-urls, Ying Chen has no ORCID on the article and the name is not
      disambiguable, and a Google Scholar author search returned a CAPTCHA interstitial,
      which was not worked around.
  added: {date: 2026-09, by: Leo Yin}
- date: 2026-08
  title: Histological aging signatures for monitoring tissue-specific aging and disease
  url: https://www.nature.com/articles/s41591-026-04566-5
  doi: 10.1038/s41591-026-04566-5
  venue: Nat. Med.
  authors:
    first:
      name: Ernesto Abila
      # _source: the author's own ORCID record, 0009-0005-5995-4815 (researcher-urls,
      #          "Google Scholar"). Confirmed: the profile is titled "Ernesto Abila",
      #          is verified at cemm.oeaw.ac.at -- the affiliation on this paper -- and
      #          lists this exact article.
      scholar: https://scholar.google.com/citations?user=EaXz-AIAAAAJ&hl=en
    last:
      name: André F. Rendeiro
      # _source: the author's own ORCID record, 0000-0001-9362-5373 (researcher-urls,
      #          "Google scholar"). Confirmed: titled "André F Rendeiro", verified at
      #          cemm.oeaw.ac.at, and lists this article when sorted by date.
      scholar: https://scholar.google.at/citations?user=lj17pqEAAAAJ&hl=en
  model:
    name: Tissue Clocks
    # _source: article Code availability -- "Source code is publicly available at the
    #          GitHub repository https://github.com/rendeirolab/tissue-clocks". No
    #          checkpoint is released: the Zenodo deposits carry the fine-tuning
    #          datasets and the processed GTEx features, so `weights` stays absent.
    repo: https://github.com/rendeirolab/tissue-clocks
    # _source: the repository LICENSE file, read directly. The GitHub API reports
    #          NOASSERTION only because PolyForm is not in its SPDX list; the file
    #          reads "PolyForm Noncommercial License 1.0.0".
    license: PolyForm-Noncommercial-1.0.0
  # params: deliberately absent -- see the verify note for what was checked.
  params: null
  params_status: not published
  pretraining_short: none — ImageNet ConvNeXt, fine-tuned
  # The 25,712 GTEx slides are both the fitting and the internal evaluation set --
  # the clocks are trained cross-validated over the cohort, then applied unchanged
  # to separate external brain, lung and skin cohorts.
  training_slides: 25.7K (cross-validated)
  # _source: Methods, "we fine-tuned a variety of vision model architectures in a
  #          tissue classification task ... We built upon well-established and
  #          pretrained models (AlexNet, VGG16, ResNet50, ResNet152, ResNet50,
  #          ConvNeXt tiny and ConvNeXt base), with a classifier head corresponding
  #          to the tissue classes. To train the new classifier head layer, we first
  #          froze all layers of the pretrained model and trained one epoch, followed
  #          by up to 100 epochs of fine-tuning". Extended Data Fig. 1d-f identify the
  #          fine-tuned ConvNeXt base as the model carried forward.
  backbone: >-
    ImageNet-pretrained ConvNeXt base, fine-tuned as a tissue-type classifier and then
    frozen as a feature extractor; a slide is represented by its mean tile embedding at
    three magnifications, and regularised linear or ensemble regressors map that to age
  pretraining: [supervised]
  # _source: Methods as quoted above, plus "Inference was run on a high-performance
  #          computing cluster using CPUs for all tiles in all slides at three levels
  #          of magnification (~480 million tiles). We worked with three different tile
  #          widths (224, 448 and 896 pixels at ~0.5 microns per pixel)".
  pretraining_detail: >-
    Supervised transfer learning rather than pathology-specific pretraining. ImageNet
    architectures (AlexNet, VGG16, ResNet50, ResNet152, ConvNeXt tiny and ConvNeXt base)
    were fine-tuned to classify tissue type on a dataset balanced across tissue, age
    bracket and sex -- one epoch with the backbone frozen, then up to 100 epochs of
    fine-tuning -- and the fine-tuned ConvNeXt base was carried forward. Tiles of 224,
    448 and 896 pixels at roughly 0.5 microns per pixel are embedded and averaged per
    slide, and the age regressor is fitted on those features.
  data:
    # _source: abstract -- "25,712 whole-slide histopathological images from 40 tissue
    #          types across 983 individuals in the Genotype-Tissue Expression cohort";
    #          Fig. 1a caption -- "spans 29 organs and 40 tissues from 983 individuals";
    #          Methods -- "~480 million tiles".
    description: >-
      GTEx post-mortem H&E whole-slide images spanning 40 tissue types and 29 organs,
      paired with the cohort's transcriptomic, methylation and phenotypic records.
      Validated on separate brain, lung and skin cohorts.
    scale:
      whole_slide_images: 25712
      individuals: 983
      tissue_types: 40
      image_tiles: 480000000
  tasks: [regression, risk prediction, benchmarking]
  tasks_detail: >-
    Predicts chronological age from tissue morphology and treats the residual -- the
    "age gap" -- as a measure of biological aging; relates tissue-specific age
    acceleration to telomere length, subclinical pathology, comorbidities and lifestyle
    factors; predicts tissue-specific age gaps from blood gene expression via ridge
    regression; and benchmarks 7 classical vision models and 18 pathology foundation
    models as feature extractors for the same task.
  modalities: [histopathology, transcriptomics]
  performance:
    # _source: Results -- "We used the model predictions to assess their performance and
    #          found an average mean absolute error (MAE) of 4.88 years across all
    #          tissues and a coefficient of determination of 0.69".
    - benchmark: GTEx, biological age from histology (cross-validated, all tissues)
      metric: mean absolute error
      value: "4.88 years"
      note: coefficient of determination 0.69
    # _source: Results -- "The classical models, which were never trained on tissue
    #          images, showed predictive power but were not on par with our model
    #          (mean MAE across organs and models of 8.67), whereas the performance of
    #          foundation models was more comparable to our own model (mean MAE across
    #          organs and models of 5.74)." Caveat quoted from the same section.
    - benchmark: Feature-extractor comparison, 7 classical vision and 18 pathology foundation models
      metric: mean MAE across organs and models
      value: "8.67 vs 5.74"
      note: >-
        classical ImageNet models 8.67, pathology foundation models 5.74, against 4.88
        for this paper's fine-tuned model. The authors caution that some foundation
        models were pretrained on data that includes GTEx, which may flatter them here.
    # _source: Results -- "we validated the histological predictors in external cohorts
    #          of brain (n = 70), lung (n = 40) and skin (n = 185) donors ... (Pearson
    #          correlation coefficients of 0.56, 0.76 and 0.46 for brain, lung and skin,
    #          respectively)".
    - benchmark: External cohorts, GTEx-trained clocks applied unchanged
      metric: Pearson correlation with chronological age
      value: "0.56 / 0.76 / 0.46"
      note: brain (n = 70), lung (n = 40) and skin (n = 185)
  verify:
    - >-
      params not published. The open-access full text states no parameter count -- its
      only two uses of "parameter" are the PCA and ridge hyperparameters -- no
      checkpoint is released, and the repository ships analysis code rather than
      weights. Do not infer a count from "ConvNeXt base".
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-08
  title: Deep-learning triage of three-dimensional pathology datasets for comprehensive and efficient pathologist assessments
  url: https://www.nature.com/articles/s41551-026-01760-1
  doi: 10.1038/s41551-026-01760-1
  venue: Nat. Biomed. Eng.
  authors:
    first:
      name: Gan Gao
      # _source: no verified profile found. The author carries no ORCID on this paper
      #          (Crossref author list), so the ORCID researcher-urls route used for the
      #          other entries is unavailable, and no Google Scholar profile could be
      #          confirmed as his. Left null rather than guessed -- his identity is
      #          otherwise confirmed (GitHub user `alecgao066`, name "Gan Gao", company
      #          "University of Washington", owner of the repo the paper cites).
      scholar: null
    last:
      name: Jonathan T. C. Liu
      # _source: profile is titled "Jonathan T.C. Liu", carries a *verified* stanford.edu
      #          email, and lists "Nondestructive 3D pathology" and "Computational
      #          pathology" as interests. Confirmed against this paper: its affiliation
      #          list places Liu at "Department of Pathology, Stanford University School
      #          of Medicine" and "Department of Bioengineering, Stanford University"
      #          alongside UW, and the profile's top papers are the Liu lab's own OTLS /
      #          3D-pathology work ("Light-sheet microscopy for slide-free non-destructive
      #          pathology of large clinical specimens", "Harnessing non-destructive 3D
      #          pathology").
      scholar: https://scholar.google.com/citations?user=p-JSi6IAAAAJ&hl=en
  model:
    # _source: article Abstract -- "we present TRICARE, a deep-learning triage framework
    #          that identifies high-risk 2D cross sections within 3D pathology datasets".
    #          Note the bioRxiv preprint and the code call the same method CARP3D; TRICARE
    #          is the published name and is the one recorded. See the verify note.
    name: TRICARE
    # _source: article Code availability -- "TRICARE code is available at
    #          https://github.com/alecgao066/TRICARE". Verified as the authors' own: the
    #          GitHub account `alecgao066` is named "Gan Gao" with company "University of
    #          Washington", and the README's contact is gangao@uw.edu.
    repo: https://github.com/alecgao066/TRICARE
    # No checkpoint is released. The repository ships training code (built on the CLAM
    # framework) and expects the user to generate CONCH patch features themselves; the
    # Zenodo deposit carries images and annotations, not weights.
    weights: null
    # _source: the repository LICENSE file, read directly -- "This work is licensed under
    #          a Creative Commons Attribution-NonCommercial 4.0 International License".
    #          The GitHub API reports NOASSERTION only because the file is the CC text
    #          rather than a recognised SPDX template.
    license: CC-BY-NC-4.0
  # params: deliberately absent -- see the verify note for the routes worked.
  params: null
  params_status: not published
  # _source: the work pre-trains nothing of its own. CONCH is reused frozen -- the
  #          repository README instructs the user to "generate patch-level features and
  #          save them" offline before training, so the encoder is never updated. Per the
  #          house rule for this shape, the trained MIL head is not described here.
  pretraining_short: none — frozen CONCH
  # Two separate task-specific models, each trained by leave-one-out cross-validation over
  # its own development cohort: 121 annotated 2D levels for prostate and 334 for esophagus.
  # The model never sees a whole slide -- its unit is a 2D level extracted from an OTLS 3D
  # biopsy volume. These are development (training) counts, not the independent test
  # cohorts (81 prostate / 77 esophagus levels), which are recorded separately below.
  training_slides: none (121+334 2D levels)
  # _source: preprint Methods, "Model architecture" -- CONCH is "selected as the patch
  #          feature encoder", producing d = 512 embeddings; "we apply a fully-connected
  #          layer with ReLU nonlinearity ... to adapt original patch features to better
  #          align with the target domain"; lateral aggregation uses "a gated attention
  #          mechanism" parameterised by "V ∈ ℝ 512×256 , U ∈ ℝ 512×256 , and W ∈ ℝ 256×1";
  #          depth aggregation uses "a simpler non-gated attention mechanism" with
  #          "K ∈ ℝ 512×256 and L ∈ ℝ 256×1"; the head is "C ∈ ℝ 512× N ... N = 2 for this
  #          study". The published Extended Data Fig. 2 caption confirms the encoder and
  #          aggregator choices survived review: CONCH beat UNI and CTransPath, "with CONCH
  #          achieving the best performance", and ABMIL beat TransMIL and DTFD-MIL.
  backbone: >-
    2.5D multiple-instance learning on a frozen CONCH patch encoder (512-d embeddings),
    adapted by a trained fully-connected ReLU layer; gated-attention ABMIL pools patches
    laterally within each 2D level, then a non-gated attention module fuses the target
    level with one neighbouring level above and below into a context-aware feature for a
    two-class linear head
  pretraining: [none, weakly supervised]
  # _source: preprint Methods, "Patch feature encoding" and "Training". CONCH is used as
  #          released; only the adapter, the two attention modules and the classifier are
  #          trained. "we employed a leave-one-out cross-validation strategy ... In each
  #          fold, 2D levels from one patient were held out as the testing set, while the
  #          remaining images were used to train the model." Prostate: 256 × 256 patches
  #          (~200 µm), Adam, lr 2 × 10⁻⁴, weight decay 10⁻⁵, cross-entropy, weighted
  #          sampling. Esophagus: 512 × 512 patches (~300 µm), SGD, lr 2 × 10⁻⁵, weight
  #          decay 10⁻⁵. Both select over 50/100/150 epochs by AUC. Depth context is one
  #          pair of neighbouring levels (m = 1), 60 µm apart for prostate and 10 µm for
  #          esophagus -- three levels in total including the target.
  pretraining_detail: >-
    No pre-training of its own. A frozen CONCH pathology foundation model supplies 512-d
    patch embeddings, chosen over UNI and CTransPath in an ablation and preferred partly
    for its lower dimensionality in a low-data regime; only a small domain-adaptation
    layer, the lateral and depth attention modules and a two-class head are trained, using
    pathologist labels attached to whole 2D levels rather than to patches. Training is
    leave-one-out cross-validation by patient, separately per organ, with class-weighted
    sampling to offset the imbalance between high- and low-risk levels.
  data:
    # _source: preprint Methods, "Dataset description". Prostate development -- FFPE
    #          prostatectomy specimens from "54 prostate cancer patients" at UWMC, one
    #          simulated core-needle biopsy (~1 mm × 1 mm × 15 mm) per block, of which
    #          "112 biopsies were identified as containing cancer"; six pathologists set a
    #          majority label "at 121 2D levels for model development (53 low-grade, 68
    #          higher-grade)". Prostate validation -- "proctectomy specimens from 29
    #          patients ... from the University of Pennsylvania (UPenn)", three levels per
    #          case labelled by three pathologists "(63 low-grade, 18 higher-grade)" = 81
    #          levels; the reader study extends this "to 59 punch biopsies from 59
    #          patients". Esophagus development -- specimens "from 24 patients ... A total
    #          of 95 specimens were imaged in 3D", with "334 2D levels for model
    #          development, where 64 contained dysplasia/cancer and 270 levels were
    #          benign". Esophagus validation -- "30 specimens collected from five
    #          patients ... A total of 77 levels ... (34 benign, 43 dysplasia/cancer)".
    #          CORROBORATED IN THE PUBLISHED VERSION: Extended Data Fig. 1 and Fig. 2
    #          captions give "prostate (n = 121 images)" and "esophagus (n = 334 images)"
    #          development cohorts, and the Peer Review File's Reviewer #1 writes of "54
    #          patients for prostate development, and 24 for esophagus".
    description: >-
      Non-destructive open-top light-sheet (OTLS) 3D pathology volumes of intact biopsies,
      fluorescence-stained with TO-PRO-3 and eosin, optically cleared, and false-coloured
      to mimic H&E. Two cohorts: simulated core-needle prostate biopsies from UW
      prostatectomies (with an independent UPenn punch-biopsy cohort imaged on a different
      OTLS generation and a modified staining protocol) and endoscopic biopsy / EMR
      specimens of Barrett's esophagus from UW. Pathologist panels label individual 2D
      depth levels low- versus high-risk; images and annotations are released on Zenodo
      and the full prostate development volumes on TCIA.
    scale:
      prostate_patients: 54
      prostate_biopsies: 112
      prostate_2d_levels_labelled: 121
      prostate_2d_levels_test: 81
      prostate_biopsies_reader_study: 59
      esophagus_patients: 24
      esophagus_specimens: 95
      esophagus_2d_levels_labelled: 334
      esophagus_2d_levels_test: 77
      esophagus_specimens_reader_study: 30
  tasks: [classification, grading, risk prediction, detection]
  # _source: article Abstract -- "TRICARE assigns risk scores to all 2D levels within a
  #          tissue volume by leveraging context from a subset of neighbouring depth
  #          levels"; "two use cases—risk stratification based on prostate cancer biopsies
  #          and screening for dysplasia/cancer in endoscopic biopsies of Barrett's
  #          esophagus"; "improve the detection of high-risk diseases compared with
  #          slide-based 2D histopathology while optimizing pathologist workloads".
  tasks_detail: >-
    Binary risk classification of every 2D depth level inside a 3D biopsy volume, yielding
    a risk-versus-depth profile from which the highest-risk levels are triaged for
    pathologist review. Two use cases: prostate cancer grading (Grade Group 1 versus > 1)
    and screening for dysplasia/cancer in Barrett's esophagus. The model triages rather
    than diagnoses -- pathologists render the final diagnosis on the selected levels -- and
    patch attention heatmaps localise the morphology driving each score.
  # histopathology: the content is histology. Levels are false-coloured to an H&E analogue,
  # labelled by pathologist panels under Gleason and Barrett's dysplasia criteria, encoded
  # by CONCH (pre-trained on 2D H&E whole-slide images), and benchmarked head-to-head
  # against slide-based 2D histopathology.
  # microscopy: the acquisition is open-top light-sheet fluorescence microscopy of intact
  # cleared biopsies, not slide scanning -- a distinct modality worth filtering on.
  modalities: [histopathology, microscopy]
  # EVERY ROW BELOW COMES FROM THE bioRxiv PREPRINT (CARP3D, 10.1101/2025.07.20.665804v1),
  # NOT THE PUBLISHED TEXT, which is behind a subscription -- see the verify note. Each row
  # repeats the flag so a value can never be quoted without it.
  performance:
    # _source: preprint Results, "Engineering a 2.5D MIL pipeline" -- "CARP3D L→D achieved
    #          the highest AUC of 0.939, exceeding the 2D baseline (AUC 0.871; p < 0.005)";
    #          balanced accuracy and F2 from the same paragraph, "Acc.: 0.826 vs. 0.750 for
    #          prostate ... F2 0.882 vs. 0.862 for prostate".
    - benchmark: Prostate development cohort, higher-grade vs low-grade (leave-one-out CV, 121 levels)
      metric: AUC
      value: "0.939 vs 0.871"
      note: >-
        TRICARE L→D versus the 2D single-level ABMIL baseline, p < 0.005; balanced accuracy
        0.826 vs 0.750 and F2 0.882 vs 0.862. Preprint (CARP3D) figure, not yet checked against the published Results.
    # _source: preprint Results, same paragraph -- "CARP3D L→D demonstrated the largest
    #          performance gain (AUC 0.921 vs. 0.895, p < 0.005)"; "Acc.: ... 0.833 vs.
    #          0.779 for esophagus; F2 ... 0.765 vs. 0.711 for esophagus".
    - benchmark: Esophagus development cohort, dysplasia/cancer screening (leave-one-out CV, 334 levels)
      metric: AUC
      value: "0.921 vs 0.895"
      note: >-
        TRICARE L→D versus the 2D baseline, p < 0.005; balanced accuracy 0.833 vs 0.779 and
        F2 0.765 vs 0.711. Preprint (CARP3D) figure, not yet checked against the published Results.
    # _source: preprint Results, "Validation of CARP3D with independent test cohorts" --
    #          "CARP3D L→D demonstrated the greatest margin of AUC improvement over the 2D
    #          baseline, with an AUC of 0.847 vs 0.779 (p < 0.005) for prostate cancer risk
    #          stratification".
    - benchmark: Prostate independent test cohort (UPenn, different OTLS system and staining protocol)
      metric: AUC
      value: "0.847 vs 0.779"
      note: >-
        TRICARE L→D versus the 2D baseline, p < 0.005, on 81 levels from 29 patients. The
        authors attribute the drop from 0.939 to staining-protocol and microscope
        differences between cohorts. Preprint (CARP3D) figure, not yet checked against the published Results.
    # _source: preprint Results, same paragraph -- "an AUC of 0.917 vs. 0.882 (p < 0.01)
    #          for esophageal dysplasia/cancer screening".
    - benchmark: Esophagus independent test cohort (held-out patients, same site and microscope)
      metric: AUC
      value: "0.917 vs 0.882"
      note: >-
        TRICARE L→D versus the 2D baseline, p < 0.01, on 77 levels from 30 specimens.
        Preprint (CARP3D) figure, not yet checked against the published Results.
    # _source: preprint Results, "Comparison with standard-of-care 2D histopathology" --
    #          "AI-triaged 3D pathology yields higher balanced accuracy (0.633 vs. 0.614)
    #          and F2 scores (0.654 vs. 0.588)".
    - benchmark: Prostate reader study, 5-year biochemical recurrence predicted from pathologist diagnoses
      metric: balanced accuracy
      value: "0.633 vs 0.614"
      note: >-
        AI-triaged 3D pathology versus conventional 2D histopathology, 59 biopsies read by
        five pathologists with a one-month washout; F2 0.654 vs 0.588. Eight prostate cases
        were upgraded and five esophageal cases upgraded with none downgraded. Preprint (CARP3D) figure, not yet checked against the published Results.
  verify:
    - >-
      Published full text is NOT open access -- nature.com serves "This is a preview of
      subscription content". Routes worked: (1) nature.com with a browser User-Agent (303
      to ?error=cookies_not_supported, 200, 550 KB) yielded the abstract, Data and Code
      availability, the eight Extended Data figure captions, affiliations and funding, but
      no Results or Methods; (2) Springer supplements MOESM1-3 all fetched -- MOESM1 is the
      two clinical-validation tables, MOESM2 (Reporting Summary) is a form PDF that
      extracts to no text, MOESM3 is the 20-page Peer Review File; (3) Europe PMC returns
      the abstract only (no PMCID, inEPMC N); (4) the authors' repo github.com/alecgao066/
      TRICARE and its README; (5) OpenAlex and Semantic Scholar both report oa_status
      "closed" with no repository copy, but the repo README linked a bioRxiv preprint.
    - >-
      EVERY `performance` value, and the cohort breakdown in `data.scale`, comes from the
      bioRxiv preprint 10.1101/2025.07.20.665804v1, which presents this work under the
      earlier name CARP3D. Numbers may differ from the published article. Three checks
      support them but do not replace reading the published Results: the published Extended
      Data Fig. 1 and Fig. 2 captions still give the development cohorts as "n = 121
      images" (prostate) and "n = 334 images" (esophagus); the published Peer Review File's
      Reviewer #1 still cites "54 patients for prostate development, and 24 for esophagus"
      and that "8 AI-triaged levels outperformed 3"; and across both review rounds the
      referees asked only for text, discussion, citation and figure-presentation changes,
      never for re-analysis or retraining. Anyone with institutional access should confirm
      Fig. 2b/2c against these five rows.
    - >-
      params not published. No author source states a count: the reachable published text
      uses "parameter" only in "key design parameters" (Extended Data Fig. 2, meaning
      hyperparameters), the three supplementary PDFs contain none, the preprint Methods give
      only weight-matrix shapes, the README documents CLI flags rather than model size, and
      no checkpoint is released. Do NOT compute one from the published matrix dimensions
      (V, U ∈ ℝ512×256, W ∈ ℝ256×1, K ∈ ℝ512×256, L ∈ ℝ256×1, C ∈ ℝ512×2) and do NOT
      attribute CONCH's count to TRICARE -- CONCH is frozen and separately published.
    - >-
      The method is named CARP3D in the preprint, in the CLAM-derived code (`--model_type
      carp3d_ld`) and in the Zenodo record's earlier text, and TRICARE in the published
      article. Recorded under the published name. Searching the catalogue for "CARP3D" will
      not find this entry.
    - >-
      A precursor exists -- Gao et al., "Triage of 3D pathology data via 2.5D multiple-
      instance learning to guide pathologist assessments", CVPR 2024 Workshop (CVMI),
      arXiv:2406.07061. It was deliberately NOT used as a source for any field here, since
      it is a different (earlier, smaller) paper. Someone deciding whether it warrants its
      own entry should look at it separately.
    - >-
      authors.first.scholar is null: Gan Gao carries no ORCID on this paper, so the ORCID
      researcher-urls route used elsewhere in this file is unavailable, and no Google
      Scholar profile could be verified as his. Not guessed.
    - >-
      Routing: filed under pathology by rule 1 (built for one imaging modality). The
      modality is arguable -- acquisition is open-top light-sheet microscopy, which is
      biomedical_images scope -- but the content, labels, encoder and comparator are all
      histopathology. Recorded with both `histopathology` and `microscopy` modalities so
      the entry surfaces either way.
  added: {date: 2026-09, by: Leo Yin}
- date: 2026-08
  title: "nnMIL: a generalizable multiple instance learning framework for computational pathology"
  url: https://www.nature.com/articles/s41551-026-01767-8
  doi: 10.1038/s41551-026-01767-8
  venue: Nat. Biomed. Eng.
  authors:
    first:
      name: Xiangde Luo
      # _source: the author's own homepage, https://luoxd1996.github.io ("Google Scholar"
      #          in the profile sidebar, beside his email and GitHub). That homepage is
      #          the `blog` link on github.com/Luoxd1996, the account that owns the
      #          repository named in this paper's Code availability. Confirmed: the
      #          profile is titled "Xiangde Luo", affiliation "Stanford University",
      #          "Verified email at stanford.edu" -- the affiliation on this paper.
      scholar: https://scholar.google.com/citations?user=dD4HLS4AAAAJ&hl=en
    last:
      name: Ruijiang Li
      # _source: linked from the first author's homepage -- "supervised by Prof. Ruijiang
      #          Li" -- i.e. this paper's first author naming this paper's last author.
      #          Confirmed: titled "Ruijiang Li", "Stanford University", "Verified email
      #          at stanford.edu", and the profile lists this group's earlier pathology
      #          foundation-model and vision-language oncology papers.
      scholar: https://scholar.google.com/citations?user=Y89JnCYAAAAJ&hl=en
  model:
    name: nnMIL
    # _source: article Code availability -- "The implementation of this project,
    #          including training, inference and evaluation pipelines as well as a usage
    #          tutorial, is publicly available on GitHub at
    #          https://github.com/Luoxd1996/nnMIL". Verified as the authors' own: the
    #          repo owner is "Xiangde Luo", company "Stanford Medicine", and the README
    #          gives `luoxd96 at stanford dot edu` as the contact. No checkpoint is
    #          released and the repository carries no LICENSE file, so `weights` and
    #          `license` are both absent rather than guessed.
    repo: https://github.com/Luoxd1996/nnMIL
  # params: deliberately absent -- see the verify note for the routes worked.
  params: null
  params_status: not published
  pretraining_short: none — frozen UNI/GigaPath/H0/Virchow2
  # nnMIL trains one aggregator per task on that task's own development split; the
  # ~40,000 WSIs are the pooled benchmark (development plus evaluation) across 35 tasks
  # and 40 cohorts, and no source sums the training splits. Recorded honestly rather
  # than copied out of data.scale.
  training_slides: not stated (40K WSIs pooled)
  # _source: Methods, "Architecture" -- "a subset of feature dimensions S ... with
  #          |S| = H is randomly sampled, where H is the hidden dimension ... although
  #          the attention weights are computed in a sampled feature subspace,
  #          slide-level aggregation is performed directly in the original
  #          foundation-model embedding space ... The final prediction is produced by a
  #          linear prediction head ... By default, nnMIL uses a hidden dimension of
  #          H = 256 and a dropout rate of 0.25"; and "Stride for sliding-window
  #          inference" -- "the full D-dimensional feature space is covered by multiple
  #          overlapping chunks of size H ... By default, the stride is set to H/4".
  backbone: >-
    Gated-attention MIL aggregator over frozen foundation-model patch embeddings:
    attention is computed in a randomly sampled 256-dimensional feature subspace while
    aggregation stays in the encoder's full D-dimensional embedding space, followed by a
    linear head. At inference the full feature space is tiled by overlapping subspaces
    (stride H/4) whose predictions are ensembled, which also yields the uncertainty score
  pretraining: [none]
  # _source: Methods, "Feature extraction" -- "Four pathology foundation models were
  #          used: GigaPath (1,536-dimensional embeddings), H0 (1,536-dimensional), UNI
  #          (1,024-dimensional), and Virchow2 (2,560-dimensional)", all preprocessed
  #          "within the CLAM toolbox"; "Training protocol" -- "AdamW optimizer with a
  #          learning rate of 3 x 10-4 (1 x 10-4 for prognosis tasks) ... cosine
  #          annealing schedule with a warmup period of 5 epochs ... up to 100 epochs
  #          with early stopping ... The default batch size was 32 for all tasks. We used
  #          cross-entropy loss for classification tasks, Cox loss for prognosis
  #          prediction, and mean squared error loss for regression tasks"; "Rule-based
  #          parameter design" -- "M is set to half of the median number of patches per
  #          slide in the training set"; "Computing hardware" -- "8 x 48 GB NVIDIA L40
  #          GPUs". The four encoders are the public released checkpoints (Hugging Face
  #          links given in Methods), used as-is.
  pretraining_detail: >-
    nnMIL pre-trains nothing of its own. Patch features come from four public pathology
    foundation models used frozen -- GigaPath, H-optimus-0, UNI and Virchow2 -- extracted
    through the CLAM pipeline; only the lightweight gated-attention aggregator and its
    linear head are trained, from slide-level labels alone, with cross-entropy for
    classification, Cox loss for survival and MSE for regression. AdamW at 3e-4 (1e-4 for
    prognosis), cosine schedule with a 5-epoch warm-up, batch size 32 and up to 100
    epochs with early stopping, on 8 x 48 GB NVIDIA L40 GPUs. Following nnU-Net, every
    setting -- bag size (half the median patch count per slide), hidden dimension,
    dropout, sampler, optimizer and inference stride -- is derived by rule from a
    per-dataset fingerprint rather than searched.
  data:
    # _source: abstract -- "Across 40,000 WSIs encompassing 35 clinical tasks and 4
    #          pathology foundation models"; Methods, "Benchmark datasets" -- "over 35
    #          datasets and nearly 40,000 unique whole-slide images (WSIs) across three
    #          major clinical tasks"; Supplementary Tables 22-25 -- "across all 35 tasks
    #          (totally 40 cohorts)", split as diagnosis 8 / biomarker 12 / prognosis 20;
    #          Methods, "Baseline MIL methods" -- "nnMIL was compared against seven
    #          existing MIL methods". Data availability names every source listed below.
    description: >-
      Public H&E whole-slide benchmarks only, grouped into 35 clinical tasks over 40
      cohorts: BCCC, BRACS, EBRAINS, IMP-CRC2024 and PANDA for diagnosis and subtyping;
      BCNB, SURGEN, MCO, TCGA-CRC, MUV, TCGA-GBM/LGG and pan-cancer TCGA for molecular
      biomarkers; TCGA pan-cancer plus PLCO, NLST, MCO, SURGEN and TCGA-CRC for
      prognosis; CAMELYON16/17 for cross-institution generalization. No private cohort.
    scale:
      whole_slide_images: 40000
      clinical_tasks: 35
      evaluation_cohorts: 40
      foundation_models: 4
      baseline_mil_methods: 7
  tasks: [classification, subtyping, grading, biomarker prediction, mutation prediction, survival prediction, regression, benchmarking]
  # _source: abstract -- "disease diagnosis, histologic subtyping, molecular biomarker
  #          detection and pan-cancer prognosis prediction"; Results -- eight subtyping
  #          tasks (BCCC 2/3/5-class, BRACS 7-class, EBRAINS 12/30-class, IMP-CRC2024,
  #          PANDA Gleason grading), "nine clinically relevant molecular biomarkers
  #          across 12 datasets ... three protein expression biomarkers (ER, PR, and
  #          HER2), three gene mutations (BRAF, KRAS, and IDH), and three pan-cancer
  #          genomic biomarkers (whole-genome doubling (WGD), tumor mutational burden
  #          (TMB), and aneuploidy)" with aneuploidy scored by Pearson correlation, and
  #          "a pan-cancer cohort of 6,602 patients from The Cancer Genome Atlas (TCGA),
  #          comprising 7,927 diagnostic hematoxylin and eosin (H&E) whole-slide images"
  #          over 16 cancer types.
  tasks_detail: >-
    A slide-level aggregator trained per task on frozen patch features: multi-class
    disease diagnosis and subtyping, Gleason grading, protein-expression and mutation
    prediction (ER/PR/HER2, BRAF/KRAS/IDH), pan-cancer genomic biomarkers (WGD, TMB, and
    aneuploidy as regression), and disease-specific survival across 16 TCGA cancer types
    plus four external colorectal and lung cohorts. Every task is also a benchmark of
    seven prior MIL methods under identical splits and hyperparameters, and the
    subspace-ensemble inference adds an uncertainty score used for selective prediction
    and for sub-stratifying the high-risk survival group.
  modalities: [histopathology]
  performance:
    # _source: all five rows from the published Supplementary Information PDF
    #          (41551_2026_1767_MOESM1_ESM.pdf, header "https://doi.org/10.1038/
    #          s41551-026-01767-8"). Rows 1 and 5 are the "Average (40 cohorts)" column,
    #          which pools mixed metrics -- BACC (Cohen's kappa for PANDA) for the 8
    #          diagnosis cohorts, AUC (Pearson's r for aneuploidy) for the 12 biomarker
    #          cohorts, C-Index for the 20 prognosis cohorts -- so it is a summary score,
    #          not one metric. Significance stars are the authors' two-sided Wilcoxon
    #          signed-rank tests.
    - benchmark: All 35 tasks / 40 cohorts, per frozen foundation model (Supplementary Tables 22-25)
      metric: mean pooled score across 40 cohorts
      value: "0.722 / 0.728 / 0.727 / 0.741"
      note: >-
        GigaPath / H-optimus-0 / UNI / Virchow2, all P < 0.01 against the baselines. Best
        competing method per encoder, already given nnMIL's batch size of 32 by gradient
        accumulation, reaches 0.703, 0.715, 0.710 and 0.718 respectively.
    # _source: Supplementary Tables 1-4, "Average" row; corroborated by Results --
    #          "Compared with the second-best method, ABMIL, nnMIL improved performance
    #          by 2.6-3.8% across four pathology foundation models ... The overall
    #          performance of nnMIL was highly consistent across different pathology
    #          foundation models, falling within a narrow range of 80.7% and 82.0%".
    - benchmark: Disease diagnosis and subtyping, 8 cohorts (BCCC, BRACS, EBRAINS, IMP-CRC2024, PANDA)
      metric: mean balanced accuracy
      value: "0.807 - 0.820"
      note: >-
        0.807 GigaPath, 0.818 H-optimus-0, 0.820 UNI, 0.818 Virchow2, against 0.786,
        0.798, 0.789 and 0.799 for the second-best method ABMIL. PANDA is scored with
        Cohen's kappa, where nnMIL is slightly behind ABMIL.
    # _source: Supplementary Table 25, "Biomarker (12 cohorts)" column; Results -- "nnMIL
    #          with Virchow2 as the feature extractor achieved the highest performance
    #          with a mean performance of 0.794, surpassing ABMIL and DSMIL by 3.3-4.1%
    #          (P < 0.001)".
    - benchmark: Molecular biomarker detection, 12 cohorts, Virchow2 features
      metric: mean AUC
      value: "0.794"
      note: >-
        nine biomarkers; P < 0.01. ABMIL reaches 0.767 and DSMIL 0.762 at their best
        setting. Aneuploidy is scored by Pearson's r, where nnMIL is second best
        (0.630 vs 0.637 for TransMIL).
    # _source: Supplementary Table 12, "Average" row -- nnMIL 0.670 +/- 0.019 vs DSMIL
    #          0.626 +/- 0.019; Results -- "When trained with Virchow2 as the feature
    #          extractor, nnMIL achieved the highest mean C-Index of 0.670, significantly
    #          outperforming the second-best method, DSMIL, which achieved a mean C-Index
    #          of 0.626 (P < 0.001)".
    - benchmark: TCGA pan-cancer prognosis, 16 cancer types, five-fold cross-validation, Virchow2 features
      metric: mean C-index
      value: "0.670"
      note: >-
        disease-specific survival over 7,927 WSIs from 6,602 patients; second-best DSMIL
        0.626, P < 0.001.
    # _source: Supplementary Table 27 -- "Performance comparison of different MIL methods
    #          across all 35 tasks (totally 40 cohorts) based on the CONCHV1.5", nnMIL
    #          0.721 +/- 0.020 vs DTFD 0.698 +/- 0.022; Discussion -- "nnMIL can be
    #          readily applied to aggregate features from other patch-level foundation
    #          models for slide-level prediction, without being restricted to a specific
    #          feature representation (e.g., CONCH, Supplementary Table 27)".
    - benchmark: Cross-encoder transfer to a fifth foundation model, CONCHv1.5, all 40 cohorts
      metric: mean pooled score across 40 cohorts
      value: "0.721"
      note: >-
        P < 0.001; best competing method DTFD 0.698. Held out from the four encoders the
        framework was developed on.
  verify:
    - >-
      The publisher version is not open access. nature.com with a browser User-Agent
      serves only the abstract, Data availability, Code availability, figure titles and
      references; OpenAlex reports the sole OA copy as the arXiv preprint. Methods,
      Results and Discussion quoted in this record were therefore read from arXiv:2511.14907v2
      (5 Aug 2026, "Second Version: 1 July 2026"), not from the published article. That
      version tracks the published one closely: its supplementary tables are byte-identical
      to the published Supplementary Information on every row spot-checked, and its main-text
      claims (EBRAINS-Fine 0.724 vs 0.656, BRACS 0.444 vs 0.414, biomarker 0.794, prognosis
      0.670 vs 0.626) match the published Supplementary Tables 3, 12 and 25 exactly. Every
      `performance` value above is nevertheless quoted from the published Supplementary
      Information PDF, not from the preprint. A reader with institutional access should
      still confirm the Methods wording against the final text.
    - >-
      params not published. No parameter count appears anywhere in the published
      Supplementary Information (28 tables), the published Peer Review File, the preprint
      full text including Methods and Extended Data, the GitHub README or TUTORIAL.md.
      The aggregator's size is implicit in the architecture (two H x D projections plus a
      scoring vector and a linear head, H = 256, D = 1,024-2,560 depending on the encoder)
      and therefore varies by feature extractor, but the authors state no number and this
      record does not compute one.
    - >-
      training_slides is not stated. nnMIL trains one aggregator per task on that task's
      own development split; the ~40,000 WSIs in data.scale are the pooled benchmark
      across 35 tasks and 40 cohorts, development and evaluation together, and no source
      sums the training splits. 40,000 is the abstract's rounded figure -- Methods says
      "nearly 40,000 unique whole-slide images".
    - >-
      data.scale records four foundation models because that is what the abstract claims.
      Supplementary Table 27 evaluates a fifth, CONCHv1.5, as a cross-encoder
      generalization check; it is recorded in `performance` but not counted in the scale.
    - >-
      No model weights are released -- the repository ships training and inference code,
      and the Google Drive bundles linked from its README hold precomputed patch features
      and experiment outputs rather than a distributable checkpoint. The repository also
      carries no LICENSE file, so model.license is absent rather than guessed.
  added: {date: 2026-09, by: Leo Yin}
- date: 2026-07
  title: End-to-end multimodal pathology foundation model with clinical dialogue
  url: https://www.nature.com/articles/s41591-026-04521-4
  doi: 10.1038/s41591-026-04521-4
  venue: Nat. Med.
  authors:
    first:
      name: Eugene Vorontsov
      scholar: https://scholar.google.com/citations?user=5o1gS_sAAAAJ&hl=en
    last:
      name: Siqi Liu
      scholar: https://scholar.google.com/citations?hl=en&user=ADyo_cAAAAAJ
  model:
    name: PRISM2
    weights: https://huggingface.co/paige-ai/Prism2
    # _source: https://huggingface.co/api/models/paige-ai/Prism2 -> cardData.license
    #          (same value on paige-ai/Prism2-survival); the paper's Code availability
    #          section names both Hugging Face repos as the official weight release.
    license: CC-BY-NC-ND-4.0
  # _source: https://www.nature.com/articles/s41591-026-04521-4 (Discussion, OA full
  #          text): "It is the largest model (4.6 billion parameters) trained on the
  #          most comprehensive dataset to date". CONFIRMED -- was previously flagged
  #          UNCONFIRMED. See the verify note for the second-source disagreement.
  params: 4.6B
  # Scan-table copy. These three summarise fields that already appear below --
  # they add no claim, they only choose what fits in a cell. See schema.py.
  pretraining_short: contrastive → next-token
  training_slides: 2.35M
  # _source: https://www.nature.com/articles/s41591-026-04521-4 (Methods, "Model
  #          architecture"): perceiver slide encoder (one cross-attention block +
  #          six self-attention layers, 256 latent queries) 541M params, attention
  #          pooler 79M, two-layer MLP adapter 29M, Phi-3 Mini "a 3.8-bilion-parameter
  #          decoder-only LLM", BioGPT as the contrastive language encoder, Virchow2
  #          tile embeddings at 0.5 microns-per-pixel.
  backbone: >-
    Virchow2 tile encoder, Perceiver slide encoder (541M, plus a 79M attention pooler),
    BioGPT language encoder and a Phi-3 Mini 3.8B decoder-only LLM reached through a
    29M-parameter MLP adapter
  pretraining: [contrastive, next-token prediction]
  # _source: https://www.nature.com/articles/s41591-026-04521-4 (Methods, "Training"):
  #          stage 1 updates slide encoder, attention pooler, LLM adapter and BioGPT
  #          with Phi-3 Mini frozen; stage 2 discards the contrastive objective, freezes
  #          the slide encoder and fine-tunes the LLM adapter and Phi-3 Mini.
  pretraining_detail: >-
    Two-stage language-supervised multimodal pre-training: contrastive slide-report
    alignment against BioGPT text embeddings plus an autoregressive dialogue objective,
    then a second stage in which the contrastive objective is dropped, the slide encoder
    is frozen and Phi-3 Mini is fine-tuned. Trained on 56 A100 40GB GPUs in bf16.
  data:
    description: H&E whole-slide images with paired clinical reports, converted into question-answer pairs
    # _source: https://www.nature.com/articles/s41591-026-04521-4 (Methods, "Data"):
    #          "The training data comprise 685,507 specimens collected from 200,692
    #          patients ... totaling 685,507 reports and 2,350,518 slides"; and
    #          (Methods, "Dialogue data"): "we create 685,000 report rewrites for as
    #          many specimens and 14 million question-answer pairs". All four existing
    #          counts verified exactly against the published Methods.
    scale:
      whole_slide_images: 2350518
      specimens: 685507
      patients: 200692
      qa_pairs: 14000000
  # _source: `grading` and `question answering` added -- Fig. 4a evaluates PANDA-SI /
  #          PANDA-MI prostate grading and IMP-CRS colorectal grading, and prompt-based
  #          inference is literally yes/no and multiple-choice question answering
  #          (https://www.nature.com/articles/s41591-026-04521-4, Results).
  tasks: [detection, subtyping, grading, biomarker prediction, survival prediction, question answering, report generation]
  tasks_detail: >-
    Prompt-based cancer detection and subtyping via yes/no and multiple-choice question
    answering; diagnostic, biomarker and survival prediction by linear probing on the
    base and diagnostic embeddings; staging and grading on external public data;
    pathology report completion following CAP guidelines.
  modalities: [histopathology, text]
  performance:
    # _source: all five rows from https://www.nature.com/articles/s41591-026-04521-4
    #          (Results, OA full text). Row 1 = "For pan-cancer detection, PRISM2
    #          diagnostic embeddings (0.967 AUC) substantially outperform both PRISM2
    #          base (0.956 AUC) and all other embeddings (0.947 AUC with PRISM, 0.931
    #          AUC with TITAN)."
    - benchmark: MSK pan-cancer detection (linear probing)
      metric: AUC
      value: "0.967"
      note: >-
        diagnostic embedding; 0.956 with the base embedding, 0.947 with PRISM and 0.931
        with TITAN. Drop on rare cancers is modest, 0.967 to 0.957.
    # _source: "PRISM2 survival embeddings outperform the survival specialist model
    #          (Fig. 4b), especially for MSK CRC RFS (0.809 versus 0.773 concordance
    #          index (C-index))."
    - benchmark: MSK colorectal cancer recurrence-free survival
      metric: C-index
      value: "0.809"
      note: >-
        PRISM2 survival embeddings, versus 0.773 for a survival specialist model trained
        from scratch on the same 225,597-case survival dataset
    # _source: "with PRISM2 diagnostic and base (0.881 and 0.888) significantly
    #          (P < 0.05) outperforming PRISM (0.852) and TITAN (0.641)."
    - benchmark: CAMELYON17 tumour staging (external, five-fold across source institutions)
      metric: quadratic weighted kappa
      value: "0.888 / 0.881"
      note: base / diagnostic embeddings, versus 0.852 for PRISM and 0.641 for TITAN
    # _source: "PRISM2 diagnostic embeddings significantly (P < 0.05) outperformed all
    #          other embeddings, achieving 0.862 quadratic weighted (compared to 0.836
    #          with base, 0.841 with PRISM and 0.750 with TITAN)."
    - benchmark: PANDA-SI prostate cancer grading (external, cross-institution transfer)
      metric: quadratic weighted kappa
      value: "0.862"
      note: diagnostic embedding; 0.836 base, 0.841 PRISM, 0.750 TITAN
    # _source: "average AUCs on MSK TCGA tasks are highest for PRISM2 base embeddings,
    #          the next-best-performing models are close: 0.846 (versus 0.854) AUC with
    #          COBRA on MSK and 0.781 (versus 0.784) AUC on TCGA with TITAN."
    - benchmark: Biomarker prediction, 10 tissue-specific MSK datasets (linear probing)
      metric: mean AUC
      value: "0.854"
      note: >-
        PRISM2 base embedding; next best is COBRA at 0.846. On the seven overlapping
        TCGA biomarkers PRISM2 base reaches 0.784 against 0.781 for TITAN.
  verify:
    - >-
      params 4.6B is the paper's own figure, quoted in the Discussion and consistent
      with the per-component counts in the Methods. The authors' released checkpoint
      totals 4.47B because it omits training-only components; the paper's figure is
      the one recorded.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-04
  title: PRET is a few-shot system for pan-cancer recognition without example training
  url: https://www.nature.com/articles/s43018-026-01141-2
  doi: 10.1038/s43018-026-01141-2
  venue: Nat. Cancer
  authors:
    first:
      name: Yi Li
      scholar: https://scholar.google.com/citations?user=qGsK180AAAAJ&hl=en
    last:
      name: Xiaomeng Li
      scholar: https://scholar.google.com/citations?user=uVTzPpoAAAAJ&hl=en
  model:
    name: PRET
    repo: https://github.com/xmed-lab/PRET
    # _source: https://www.nature.com/articles/s43018-026-01141-2 (Code availability,
    #          free on the paywalled page): "All the involved model weights and Python
    #          packages are available online. Our work is publicly available from GitHub".
    #          The GitHub README names the Hugging Face mirror as the original release
    #          ("This repo is originally relased at (HF Code)"), and that repo carries
    #          model.pth. License from https://huggingface.co/api/models/yili7eli/PRET
    #          cardData.license and the Apache-2.0 block at the end of the README.
    weights: https://huggingface.co/yili7eli/PRET
    license: Apache-2.0
  # params: deliberately absent. No source states a count -- see the verify note.
  params_status: not published
  pretraining_short: none — frozen DINO ViT-S/8
  # PRET fits no task-specific parameters at all; the 4,484 WSIs in data.scale are
  # the evaluation set, not a training set.
  training_slides: none (training-free)
  # _source: PRET Supplementary Information PDF, "Algorithms of PRET / Feature extractor
  #          based on pathological foundation models" (43018_2026_1141_MOESM1_ESM.pdf,
  #          linked from the article page): "the default foundation model proposed by
  #          Zhang et al. is trained via DINO in a self-supervised manner on TCGA without
  #          labels using the backbone network of ViT-S/8". Six components confirmed by
  #          Extended Data Fig. 1a: "extractor, tagger, miner, classifier, aggregator,
  #          and post processor".
  backbone: >-
    Default feature extractor is a DINO-pretrained ViT-S/8 pathology encoder; PRET adds
    an in-context tagger, in-context classifier, instance miner, attention aggregator
    and postprocessor
  pretraining: [DINO, self-supervised]
  # _source: same Supplementary Information section -- "we do not fine-tune these
  #          parameters, since fixed parameters ensure that the model is flexible".
  #          Extendable to UNI, GPFM, CONCH, TITAN, mSTAR and Prov-GigaPath (Fig. 2e).
  pretraining_detail: >-
    Training-free for downstream tasks; the feature extractor holds all model parameters
    and is never fine-tuned. The default encoder was pretrained self-supervised with DINO
    on unlabelled TCGA pathology images, and the framework also runs on UNI, GPFM, CONCH,
    TITAN, mSTAR and Prov-GigaPath.
  data:
    description: >-
      No task-specific training images for PRET itself. Evaluated on 4,484 WSIs across
      23 benchmarks. The paper does not state a numeric TCGA pretraining image count for
      the default encoder.
    scale:
      evaluation_wsi: 4484
      benchmarks: 23
  tasks: [detection, subtyping, segmentation, classification]
  tasks_detail: Cancer screening, cancer subtyping, tumour segmentation, lymph node metastasis detection.
  modalities: [histopathology]
  performance:
    # _source rows 1-3: published abstract, https://www.nature.com/articles/s43018-026-01141-2
    #          (also PMID 41933183 via Europe PMC). Full text is paywalled; these are the
    #          numbers the authors lead with and the only ones stated outside figures.
    - benchmark: 23 international benchmarks (4,484 WSIs)
      metric: AUC
      value: ">97%"
      note: reached on 15 of the 23 benchmarks; PRET outperforms existing approaches across 20 tasks
    - benchmark: 23 international benchmarks (4,484 WSIs)
      metric: maximum improvement over existing approaches
      value: "36.76%"
      note: abstract does not state which metric the improvement is measured in
    - benchmark: Lymph node metastasis detection, 8 slide examples
      metric: comparison against pathologists
      value: "outperforms 11 pathologists"
      note: >-
        abstract calls this clinical-grade diagnostic performance but gives no underlying
        AUC; the per-benchmark figures live in Figs. 4 and 5, which are behind the paywall
    # _source: PRET Supplementary Table 2 ("Slide label visual prompt for pan-cancer
    #          screening and subtyping tasks with multiple metrics"),
    #          43018_2026_1141_MOESM1_ESM.pdf. 8-shot Average row: PRET 93.8+-1.9 AUC,
    #          MI-SimpleShot 90.9+-2.2, KNN-Mean 90.9+-2.4, KNN-Max 83.5+-5.4,
    #          MI-Prototype 64.1+-7.8.
    - benchmark: Pan-cancer screening and subtyping, 11 datasets, slide-label prompt, 8-shot
      metric: mean AUC
      value: "93.8% (+-1.9)"
      note: >-
        Supplementary Table 2, mean over ESCC, PTC, CRC, GC, LC, BC, lymphoma, ESCA, SARC,
        RCC and NSCLC; best baselines MI-SimpleShot and KNN-Mean both reach 90.9%
  verify:
    - >-
      params not published. The free Supplementary Information was read in full and
      states no count; the Methods are paywalled, there is no PMC deposit, no preprint,
      and the repo and gated HuggingFace release expose only an architecture name.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-03
  title: Confounding factors and biases abound when predicting molecular biomarkers from histological images
  url: https://www.nature.com/articles/s41551-026-01616-8
  doi: 10.1038/s41551-026-01616-8
  venue: Nat. Biomed. Eng.
  authors:
    first:
      name: Muhammad Dawood
      scholar: https://scholar.google.com/citations?hl=en&user=a-szm64AAAAJ
    last:
      name: Fayyaz ul Amir Afsar Minhas
      scholar: https://scholar.google.com/citations?hl=en&user=cQ6eO_kAAAAJ
  model:
    name: HistBiases
    repo: https://github.com/imuhdawood/HistBiases
  # params: correctly absent. Confirmed by full-text search -- see the verify note.
  # `n/a` rather than `not published`: this paper introduces no model, so there is
  # no count for anyone to fill in later.
  params_status: n/a
  pretraining_short: none — frozen CTransPath / ShuffleNet
  # The cohort is reported in patients; no slide count appears in the full text.
  training_slides: not stated (8.2K patients)
  backbone: >-
    Benchmarking study rather than a new model. Evaluates CLAM, SlideGraph-infinity and
    TITAN, with CTransPath and ShuffleNet patch encoders.
  pretraining: [self-supervised, weakly supervised]
  # _source: https://www.nature.com/articles/s41551-026-01616-8 (Results and Methods, OA
  #          full text): "ShuffleNet pretrained on ImageNet as a patch-level encoder to
  #          extract the 1,024-dimensional feature representation"; "a 768-dimensional
  #          self-supervised feature representation ... using CTransPath (a transformer-based
  #          self-supervised model trained on histology images)".
  pretraining_detail: >-
    CTransPath pretrained on histology via self-supervised learning, giving 768-dimensional
    patch features; ShuffleNet pretrained on ImageNet, giving 1,024-dimensional patch
    features; TITAN trained on 330,000 image-text pairs.
  data:
    # _source: same article, Discussion: "significant interdependencies among molecular
    #          factors across tissue types and datasets (TCGA, METABRIC, MSK and DFCI)";
    #          Results: "we retrospectively analysed n = 8,221 patients with breast cancer
    #          (BRCA), colorectal cancer (CRC), endometrial cancer (UCEC) and lung cancer
    #          across four cohorts". Both existing values verified verbatim.
    description: >-
      H&E WSIs from TCGA, METABRIC, MSK and DFCI. Weakly supervised models trained on
      TCGA and validated on CPTAC and ABCTB.
    scale:
      patients: 8221
  tasks: [biomarker prediction, mutation prediction, benchmarking]
  tasks_detail: >-
    Molecular biomarker and gene mutation prediction from WSIs, plus a
    confounding/stratification analysis against biomarker interdependency, grade and TMB.
  modalities: [histopathology]
  performance:
    # _source rows 1-4: https://www.nature.com/articles/s41551-026-01616-8, OA full text.
    # Row 1: "In BRCA, CLAM with CTransPath features predicts receptor status with average
    #        AUROCs of 0.87 and 0.90 for ER and 0.79 and 0.78 for PR, in cross-validation
    #        (TCGA-BRCA) and independent validation (ABCTB) cohorts, respectively."
    - benchmark: TCGA-BRCA (cross-validation) and ABCTB (independent validation)
      metric: AUROC, ER status
      value: "0.87 / 0.90"
      note: CLAM with CTransPath features; the same models reach 0.79 / 0.78 for PR
    # Row 2: "SlideGraph-infinity predicts colorectal tumours' MSI status ... with an AUROC
    #        of 0.88 (0.873-0.886). However, when the same patient set is divided into
    #        hypermutated and non-hypermutated subgroups ... the AUROC for MSI status
    #        prediction drops to 0.72 within each subgroup."
    - benchmark: TCGA-CRC, MSI status
      metric: AUROC, whole cohort vs stratified subgroups
      value: "0.88 -> 0.72"
      note: >-
        SlideGraph-infinity; 0.88 (0.873-0.886) over the whole cohort falls to 0.72
        within both the hypermutated and the non-hypermutated subgroup
    # Row 3: "In BRCA, grade-based ER and PR classifiers achieved AUROCs of 0.76 and 0.70
    #        in the TCGA-BRCA cohort and 0.79 and 0.71 in the ABCTB cohort ... Grade also
    #        predicts TP53 mutations with an AUROC of 0.75, nearly matching the 0.81
    #        achieved by weakly supervised ML models." Fig. 6 caption confirms the
    #        classifier is "a support vector machine classifier trained to predict a
    #        biomarker/gene mutation from one-hot encoded histological grades".
    - benchmark: TCGA-BRCA, grade-only baseline
      metric: AUROC
      value: "ER 0.76, PR 0.70, TP53 0.75"
      note: >-
        SVM on one-hot pathologist-assigned grade; the weakly supervised TP53 predictor
        reaches only 0.81, so the added value of the ML model is modest. ABCTB gives
        0.79 for ER and 0.71 for PR.
    # Row 4 REPLACES the previous "TCGA-BRCA, PR status stratified by CDH1 / 0.79 -> 0.50"
    #        row, which is not supported anywhere in the full text -- see the verify note.
    # _source: "WSI-based models infer BRAF and TP53 mutations in colorectal tumours
    #          (TCGA-CRC) from WSIs with high confidence, achieving AUROCs 0.774
    #          (0.764-0.785) and 0.717 (0.711-0.722) ... the TP53 predictor AUROC drops to
    #          0.50 for high TMB cases."
    - benchmark: TCGA-CRC, TP53 mutation stratified by tumour mutational burden
      metric: AUROC, whole cohort vs high-TMB subgroup
      value: "0.717 -> 0.50"
      note: >-
        0.717 (0.711-0.722) over the cohort falls to chance in high-TMB cases; the BRAF
        predictor falls from 0.774 (0.764-0.785) to 0.65 in low-TMB cases
  note: Benchmarking and bias study, not a new foundation model.
  verify:
    - >-
      params correctly absent: this is a benchmarking study and the word "parameter"
      does not occur in the full text, the Supplementary Information, the figures or
      the Peer Review File. It reports feature dimensions, never model sizes.
    - >-
      a previous record carried a row reading "PR status stratified by CDH1, 0.79 ->
      0.50". It conflated two results -- the paper names CDH1 only for the ER
      predictor, and that 0.50 belongs to TP53 under TMB stratification. Removed and
      replaced with the sourced version.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-02
  title: >-
    Classification accuracy of a hierarchical molecular inference-based deep-learning
    system for CNS tumour diagnosis: a multi-institutional, retrospective study
  url: https://www.thelancet.com/journals/lanonc/article/PIIS1470-2045(25)00661-8/abstract
  doi: 10.1016/S1470-2045(25)00661-8
  venue: Lancet Oncol.
  authors:
    first:
      name: H. Lalchungnunga
      # No Google Scholar author profile found. Searched ORCID (three same-name
      # records, all Mizoram/Serkawn in India, none at the NCI) and the web; a
      # ResearchGate profile exists for the NCI postdoc but is not a Scholar
      # profile. Left null rather than attach the wrong person.
      scholar: null
    last:
      name: Kenneth Aldape
      # _source: scholar.google.com/citations?user=vZM9E_AAAAAJ -- profile named
      #          "Kenneth Aldape", verified email at nih.gov, matching the paper's
      #          NCI Laboratory of Pathology affiliation, and its entire 2026 output
      #          is CNS tumour neuropathology and DNA methylation classification,
      #          which is this paper's subject. His ORCID (0000-0001-5119-7550)
      #          lists no researcher URLs, so this was confirmed from the profile
      #          itself. NOTE: this Lancet Oncol. paper is not yet indexed on the
      #          profile -- Elsevier indexing lag -- so the match rests on identity,
      #          not on the article appearing there.
      scholar: https://scholar.google.com/citations?user=vZM9E_AAAAAJ&hl=en
  model:
    name: Neuropath-AI
    weights: https://methylscape.ccr.cancer.gov/
  # params: deliberately absent. No source states a count -- see the verify note.
  params_status: not published
  # The informative part of this method is the hierarchy, not the supervision:
  # WSIs -> predicted methylation/expression -> 9 families -> 52 terminal types.
  pretraining_short: not disclosed
  # The abstract counts samples, not slides -- see the data.scale comment.
  training_slides: 5.8K samples (not slides)
  # _source: this line has been rewritten to only what is sourced. Published abstract
  #          (PMID 41643698, Europe PMC): the model was "trained ... to infer molecular
  #          features from whole slide images and to use these to predict tumour types
  #          with associated confidence scores", against reference labels "determined by
  #          DNA methylation-based tumour classification to match one of 52 tumour types".
  #          Authors' own SNO 2025 abstract (PMC12601992, open in PMC): "We trained
  #          pan-CNS tumor models to predict DNA methylation and gene expression from
  #          whole-slide images (WSIs). These molecular predictions were then used in a
  #          hierarchical machine learning framework, termed Neuropath-AI, to predict nine
  #          broad tumor families and 52 tumor types". The previous record's "UNI large
  #          vision transformer plus MLPs and ensemble classifiers (random forest, SVM,
  #          KNN, logistic regression)" could not be confirmed -- see the verify note.
  backbone: >-
    Hierarchical molecular inference: deep-learning models predict DNA methylation and
    gene expression from H&E whole-slide images, and a hierarchical classifier maps those
    predictions to nine tumour families and 52 terminal CNS tumour types
  pretraining: [self-supervised]
  pretraining_detail: >-
    WSI-pretrained encoder followed by molecular inference-based hierarchical
    classification.
  data:
    # _source: published abstract (PMID 41643698): "The Neuropath-AI model was trained on
    #          5835 samples from the National Cancer Institute (NCI; USA), the Children's
    #          Brain Tumor Network (USA), and the Digital Brain Tumour Atlas (Austria)";
    #          "The test cohort comprised 5516 samples ... from the NCI, Northwestern
    #          Medicine (USA), University of Pittsburgh Medical Center (USA), and
    #          University College London (UK)"; "52 tumour types".
    # The key was `whole_slide_images: 5835`, which the abstract does not support -- it
    # counts samples, not slides. Renamed and the test cohort and type count added.
    description: >-
      Multi-institutional retrospective CNS tumour cohort. Training data from the NCI,
      the Children's Brain Tumor Network and the Digital Brain Tumour Atlas; test data
      from the NCI, Northwestern Medicine, UPMC and University College London, drawn from
      laboratory archives between May 17, 2024 and May 13, 2025.
    scale:
      training_samples: 5835
      test_samples: 5516
      tumour_types: 52
  tasks: [classification, mutation prediction, gene expression prediction]
  tasks_detail: >-
    CNS tumour family-level classification, 52 terminal CNS tumour types, IDH mutation
    prediction, inferred gene expression and DNA methylation.
  modalities: [histopathology]
  performance:
    # _source: all four rows from the published structured abstract, PMID 41643698, read
    #          via Europe PMC (https://www.ebi.ac.uk/europepmc/webservices/rest/search
    #          ?query=DOI:"10.1016/S1470-2045(25)00661-8"&resultType=core). Findings:
    #          "Family-level classifications were reached in 5299 (96%) of 5516 samples.
    #          Predictions to one of the terminal classifications with at least moderate
    #          confidence were reached for 4772 (87%) samples. The single highest-scoring
    #          classification matched the reference label in 3817 ... (80% [95% CI 79-81])
    #          of 4772 samples (balanced accuracy 66% [95% CI 63-70]). The two
    #          highest-scoring classifications contained the reference label in 4103 ...
    #          (86% [95% CI 85-87]) of 4772 samples (balanced accuracy 75% [95% CI 71-78])."
    #          Corroborated by the authors' SNO 2025 abstract (PMC12601992): "moderate-
    #          confidence (and above) predictions for 87% of test samples, for which it
    #          achieved a diagnostic accuracy of 80% for the top-1 prediction and 86%
    #          accuracy for a top-2 predictions".
    # The previous record split top-1/top-2 accuracy and balanced accuracy across five
    # rows and omitted the 96% family-level coprimary endpoint; folded to four rows.
    - benchmark: Multi-institutional CNS tumour test cohort (5,516 samples)
      metric: family-level sample coverage
      value: "96%"
      note: family-level classifications reached in 5,299 of 5,516 samples
    - benchmark: Multi-institutional CNS tumour test cohort (5,516 samples)
      metric: terminal-classification sample coverage
      value: "87%"
      note: 4,772 samples reached a terminal classification at moderate confidence or better
    - benchmark: Multi-institutional CNS tumour test cohort (4,772 covered samples)
      metric: top-1 prediction accuracy
      value: "80%"
      note: 3,817 of 4,772 samples, 95% CI 79-81; balanced accuracy 66% (95% CI 63-70)
    - benchmark: Multi-institutional CNS tumour test cohort (4,772 covered samples)
      metric: top-2 prediction accuracy
      value: "86%"
      note: 4,103 of 4,772 samples, 95% CI 85-87; balanced accuracy 75% (95% CI 71-78)
  verify:
    - >-
      params not published in any reachable source. The Lancet full text is behind
      Cloudflare, there is no PMC deposit, no preprint and no code release; the
      authors' SNO 2025 abstract (PMC12601992) states none either.
    - >-
      backbone is narrowed to what the published abstract supports. The previous
      record named UNI, MLP submodules and an ensemble of random forest, SVM, KNN
      and logistic regression, none of which appears in any reachable source.
      Restore with a citation if someone reads the Methods.
    - >-
      trained on 5,835 samples per the Lancet Oncology abstract, which is what this
      record uses. The authors' SNO 2025 abstract says 5,715; the peer-reviewed
      figure takes precedence.
    - >-
      model.weights points at a login-gated NIH analysis service, not a weight
      download. The abstract promises public release with no artifact yet.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-02
  title: Knowledge-enhanced pretraining for vision-language pathology foundation model on cancer diagnosis
  url: https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00058-9
  doi: 10.1016/j.ccell.2026.01.019
  venue: Cancer Cell
  authors:
    first:
      name: Xiao Zhou
      # No Google Scholar profile attached on purpose. The name is very common,
      # neither the arXiv preprint, the GitHub repo nor the project page links an
      # author profile, and the one ORCID record matching "Xiao Zhou" with a
      # Shanghai Jiao Tong query is actually at EPFL/McGill. Guessing here would
      # credit the wrong researcher.
      scholar: null
    last:
      name: Weidi Xie
      scholar: https://scholar.google.com/citations?user=Vtrqj4gAAAAJ&hl=zh-CN
  model:
    name: KEEP
    repo: https://github.com/MAGIC-AI4Med/KEEP
    # _source: https://huggingface.co/api/models/Astaxanthin/KEEP
    weights: https://huggingface.co/Astaxanthin/KEEP
    params_note: >-
      414M is the released checkpoint's own total, not a figure from the paper: the
      HuggingFace API reports safetensors total 414,210,816 for Astaxanthin/KEEP and the
      model page renders "Model size 0.4B params". It covers both towers (ViT-L/16 vision
      encoder plus the BERT-family text encoder) at F32. Neither the Cancer Cell abstract
      nor the arXiv preprint states a parameter count anywhere.
  # _source: https://huggingface.co/api/models/Astaxanthin/KEEP (safetensors total
  # 414,210,816) and https://huggingface.co/Astaxanthin/KEEP ("Model size 0.4B params")
  params: 414M
  pretraining_short: knowledge-enhanced contrastive
  # KEEP trains on tile-level image-text pairs from OpenPath and Quilt-1M; no whole
  # slide enters pretraining.
  training_slides: none (tile–text pairs)
  # _source: ARXIV 2412.13126v2 methods -- "KEEP consists of a vision encoder based on the
  # backbone of ViT-L-16 and a text encoder based on the architecture of PubMedBERT. We
  # adopt UNI to initialize the image encoder ... the text encoder of KEEP is initialized
  # by the pre-trained knowledge encoder."
  # Corroborated by HF config.json: vision hidden 1024 / 24 layers / patch 16 / img 224,
  # text model_type bert, hidden 768 / 12 layers / vocab 30522.
  # Replaces the vaguer "ViT-L/16 vision encoder with a BERT text encoder".
  backbone: >-
    ViT-L/16 vision encoder initialised from UNI, paired with a PubMedBERT text encoder
    initialised from a disease-knowledge encoder
  # _source: pretraining terms -- ARXIV 2412.13126v2 methods. "CLIP" dropped: the preprint
  # never calls the objective CLIP (its only CLIP mention is a BioCLIP citation for the
  # hierarchical disease chains); the loss is a group-level metric-learning objective.
  pretraining: [contrastive]
  pretraining_detail: >-
    Knowledge-enhanced vision-language pretraining. A BERT-family knowledge encoder is
    first trained by metric learning over a disease knowledge graph, then used to align
    visual and textual representations within hierarchical semantic spaces, so alignment
    happens at the level of a semantic group rather than a single noisy image-text pair.
  data:
    # _source: EPMC abstract (PMID 41720085), which matches the arXiv v2 abstract verbatim
    description: >-
      Pathology image-text pairs from OpenPath and Quilt-1M, reorganized into
      semantically structured groups aligned with disease ontology hierarchies
    scale:
      # _source: EPMC abstract -- "143,000 semantically structured groups"
      semantic_groups: 143000
      # _source: EPMC abstract -- "a comprehensive disease knowledge graph encompassing
      # 11,454 diseases and 139,143 attributes"
      diseases: 11454
      disease_attributes: 139143
  tasks: [segmentation, detection, subtyping, retrieval, classification]
  tasks_detail: >-
    Zero-shot slide-level cancer region segmentation, cancer detection and subtyping;
    tile-level cross-modal retrieval and zero-shot image classification.
  modalities: [histopathology, text]
  performance:
    # _source: GH README "What is KEEP?" -- "an average sensitivity of 89.8% for cancer
    # detection across 7 cancer types".
    # Cross-check ARXIV 2412.13126v2 results: "it achieves an average sensitivity of 0.898
    # (at 0.95 specificity) in tumor detection across 7 cancer types". AGREE. The
    # specificity operating point comes from the preprint sentence.
    - benchmark: Zero-shot cancer detection, 7 CPTAC cohorts
      metric: average sensitivity at 0.95 specificity
      value: "0.898"
      note: reported by the authors as 89.8% in the repository README
    # _source: GH README, "Zero-shot Cancer Subtyping (BACC)" table, EBRAINS row: KEEP
    # 0.456 vs CONCH 0.371.
    # Cross-check ARXIV v2: "surpasses CONCH by 8.5 points in balanced accuracy for
    # subtyping 30 rare brain cancers" -- 0.456 - 0.371 = 0.085. AGREE exactly.
    - benchmark: EBRAINS, zero-shot subtyping (30 rare brain cancer types)
      metric: balanced accuracy
      value: "0.456"
      note: next-best model CONCH 0.371
    # _source: GH README, "Zero-shot Cancer Region Segmentation (DICE)" table, AGGC22 row:
    # KEEP 0.530 vs CONCH 0.449.
    # Cross-check ARXIV v2: "an average DICE score improvement of 6.8 and 8.1 points over
    # ... CONCH on the CAMELYON16 and AGGC22 datasets" -- 0.530 - 0.449 = 0.081. AGREE exactly.
    - benchmark: AGGC22, zero-shot cancer region segmentation
      metric: DICE
      value: "0.530"
      note: next-best model CONCH 0.449; before post-processing
    # _source: GH README, same segmentation table, CAMELYON16 row: KEEP 0.361 vs CONCH 0.292.
    # Cross-check ARXIV v2 gives the gap as 6.8 points; the README rows differ by 6.9.
    # MINOR DISAGREEMENT, recorded rather than resolved -- see the note and verify.
    - benchmark: CAMELYON16, zero-shot cancer region segmentation
      metric: DICE
      value: "0.361"
      note: >-
        next-best model CONCH 0.292, a 6.9-point gap; the preprint states 6.8 points, so
        one of the two is rounded differently
  verify:
    - >-
      performance comes from the authors' own GitHub README, cross-checked against
      arXiv 2412.13126v2, whose abstract is byte-identical to the published one. The
      Cancer Cell full text is unreachable -- cell.com and ScienceDirect both answer
      403 and there is no PMC deposit -- so no row was read from it.
    - >-
      the README warns its numbers are updated with each model iteration, so re-read
      them against the Cancer Cell PDF when someone has browser access.
    - >-
      params 414M is the released checkpoint's total from HuggingFace and covers both
      towers. The paper states no count. Not comparable with a tile-encoder-only
      figure such as UNI's 307M.
  added: {date: 2026-08, by: Leo Yin}
- date: 2026-02
  title: >-
    Development and validation of a computational histology artificial
    intelligence-powered predictive biomarker for selection of chemotherapy in advanced
    pancreatic cancer
  url: https://ascopubs.org/doi/10.1200/JCO-25-02199
  doi: 10.1200/JCO-25-02199
  venue: J. Clin. Oncol.
  authors:
    first:
      name: Andrew Hendifar
      scholar: https://scholar.google.com/citations?hl=en&user=XwWT-TMAAAAJ
    last:
      name: Jennifer J. Knox
      scholar: https://scholar.google.com/citations?user=6aEaHzcAAAAJ&hl=en
  model:
    name: CHAI
  # _source: not published. See the verify note for the routes tried.
  params: null
  params_status: not published
  pretraining_short: not disclosed
  # The abstract counts patients; the development cohort is 178 of the 477.
  training_slides: not stated (178 patients)
  # _source: EPMC abstract (PMID 41671529). Replaces "Not stated in the paper", which
  # asserted something about a full text nobody in this repo has been able to read.
  backbone: >-
    Not described in any reachable source; the abstract says only that the CHAI platform
    extracts quantitative histomorphologic features from whole-slide images
  pretraining: [supervised]
  # _source: EPMC abstract (PMID 41671529)
  pretraining_detail: >-
    Histomorphologic features extracted from H&E whole-slide images of diagnostic
    biopsies were screened in a development cohort for association with differential
    time to next treatment or death between F-chemo- and G-chemo-treated patients; the
    resulting continuous score was dichotomised and the threshold locked before validation.
  data:
    # _source: EPMC abstract (PMID 41671529)
    description: >-
      H&E-stained diagnostic biopsy whole-slide images from patients with advanced
      pancreatic ductal adenocarcinoma
    scale:
      # _source: EPMC abstract -- "There were 477 patients (development: 178; validation: 299)"
      patients: 477
      development_patients: 178
      validation_patients: 299
  tasks: [biomarker prediction, treatment response]
  # _source: EPMC abstract (PMID 41671529)
  tasks_detail: >-
    Predicts which of two first-line chemotherapy backbones -- fluoropyrimidine-based
    (F-chemo) or gemcitabine-based (G-chemo) -- a patient will benefit from, reported as a
    binary F-pref or G-pref result.
  modalities: [histopathology]
  # _source (all four rows): EPMC abstract (PMID 41671529), quoted verbatim.
  # Unchanged from the existing record -- every figure re-checked against the abstract.
  performance:
    - benchmark: Validation cohort (COMPASS + Know Your Tumor), F-pref patients
      metric: median overall survival
      value: "14.4 vs 11.7 months"
      note: F-chemo vs G-chemo, n = 173, P = .003
    - benchmark: Validation cohort (COMPASS + Know Your Tumor), F-pref patients
      metric: median time to next treatment or death
      value: "8.6 vs 7.5 months"
      note: F-chemo vs G-chemo, n = 173, P = .035
    - benchmark: Validation cohort (COMPASS + Know Your Tumor), G-pref patients
      metric: median time to next treatment or death
      value: "9.6 vs 7.2 months"
      note: >-
        G-chemo vs F-chemo, n = 126, P = .038; OS showed no difference (14.3 vs 12.4
        months, P = .5)
    - benchmark: Validation cohort, propensity score-weighted
      metric: biomarker-treatment interaction
      value: "TNTD P < .001, OS P = .005"
  verify:
    - >-
      params and backbone are not published anywhere reachable. ascopubs.org answers
      403, there is no PMC deposit, preprint, repo or model release, and the four
