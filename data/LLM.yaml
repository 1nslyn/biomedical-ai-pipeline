- date: 2024-06
  title: "Large language models for preventing medication direction errors in online pharmacies"
  url: https://www.nature.com/articles/s41591-024-02933-8
  doi: 10.1038/s41591-024-02933-8
  venue: Nat. Med.
  authors:
    first:
      name: Cristobal Pais
      scholar: null
    last:
      name: Mohsen Bayati
      scholar: null
  model:
    name: MEDIC
    repo: null
  summary:
    - MEDIC (medication direction copilot) emulates pharmacist reasoning by fine-tuning a first-generation LLM on 1,000 expert-annotated and augmented medication directions from Amazon Pharmacy to extract core components such as dosage and frequency, then assembling complete directions with pharmacy logic and safety guardrails.
    - On 1,200 expert-reviewed prescriptions, two LLM-based benchmarks recorded 1.51 (CI 1.03, 2.31) and 4.38 (CI 3.13, 6.64) times more near-miss events than MEDIC.
    - Deployed in a production online pharmacy system, MEDIC reduced near-miss events by 33% (CI 26%, 40%).
  summary_short: MEDIC, an LLM-based medication direction copilot, produced fewer near-miss medication direction errors than LLM benchmarks and cut near-miss events by 33% in a production online pharmacy.
  params: null
  params_status: not published
  dataset_scale_short: 1,200 expert-reviewed prescriptions
  backbone: >-
    MEDIC fine-tunes a first-generation large language model with
    expert-annotated and augmented medication directions, combining
    extraction of core prescription components with pharmacy logic and
    safety guardrails.
  pretraining: [supervised]
  pretraining_detail: >-
    Fine-tuned a first-generation LLM on 1,000 expert-annotated and
    augmented medication directions from Amazon Pharmacy.
  data:
    description: >-
      1,000 expert-annotated and augmented medication directions from
      Amazon Pharmacy for fine-tuning; evaluation on 1,200 expert-reviewed
      prescriptions; one comparison benchmark leveraged 1.5 million
      medication directions, the other used state-of-the-art LLMs.
    scale:
      annotated_directions: 1000
      benchmark_directions: 1500000
      expert_reviewed_prescriptions: 1200
  tasks: [information extraction, generation]
