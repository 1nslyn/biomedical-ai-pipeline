  model:
    name: Nine LLMs (evaluated)
    repo: null
  summary:
    - Nine LLMs were evaluated on 1,000 emergency department cases (500 real and 500 synthetic), each presented in 32 variations (31 sociodemographic groups plus a control) with clinical details held constant, yielding over 1.7 million model-generated outputs.
    - Compared with a physician-derived baseline and each model's own control case, cases labeled as Black, unhoused, or LGBTQIA+ were more frequently directed toward urgent care, invasive interventions, or mental health evaluations; certain LGBTQIA+-labeled cases received mental health assessment recommendations approximately six to seven times more often than clinically indicated.
    - High-income-labeled cases received significantly more advanced imaging recommendations such as CT and MRI (P < 0.001), while low- and middle-income-labeled cases were often limited to basic or no further testing; differences persisted after multiple-hypothesis correction in both proprietary and open-source models and were not supported by clinical reasoning or guidelines.
  summary_short: Nine LLMs exhibited medically unjustified sociodemographic biases in emergency department decisions, directing Black, unhoused, LGBTQIA+, and income-labeled cases toward more invasive, urgent, or mental health care across 1.7 million outputs.
