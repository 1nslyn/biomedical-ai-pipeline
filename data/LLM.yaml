- date: 2026-06
  title: Evaluating the robustness and readiness of large frontier models in health AI applications
  url: https://www.nature.com/articles/s41591-026-04501-8
  doi: 10.1038/s41591-026-04501-8
  venue: Nat. Med.
  authors:
    first:
      name: Yu Gu
      scholar: https://scholar.google.co.uk/citations?user=1PoaURIAAAAJ&hl=en&oi=ao
    last:
      name: Paul Vozila
      scholar: null
  model:
    name: Health AI robustness stress-test suite
    repo: null
    weights: https://doi.org/10.5281/zenodo.20047288
  summary:
    - Adversarial stress tests were applied to 10 flagship frontier models (GPT-5, Gemini 2.5 Pro, Claude 3.5 Sonnet, MedGemma and others) across popular health AI benchmarks.
    - Models could often guess correct answers with key inputs removed, yet were derailed by trivial prompt changes and fabricated plausible-sounding but flawed reasoning.
    - Popular health benchmarks vary widely in what they actually measure, exposing a gap between benchmark scores and real robustness.
  summary_short: Adversarial stress tests on ten frontier models exposed brittle reasoning and fabricated explanations behind popular health AI benchmarks.
  params: null
  params_status: n/a
  dataset_scale_short: 10 models tested
  backbone: >-
    Adversarial stress-test suite applied to flagship frontier models (GPT-4o,
    GPT-5, OpenAI o3, OpenAI o4-mini, Gemini 2.5 Pro, Claude 3.5 Sonnet,
    DeepSeek-VL2, Qwen3-VL, LLaVA-Med 1.5, MedGemma) rather than a new model
    itself.
  data:
    description: >-
      Clinician-guided rubrics applied to popular health AI benchmarks under a
      series of adversarial transformations (key-input removal, prompt
      alterations) to probe multimodal medical reasoning robustness.
  tasks: [benchmarking, reasoning]
  tasks_detail: >-
    Adversarial stress testing reveals brittleness: models can guess correct
    answers with key inputs removed, yet are confused by minor prompt changes
    and fabricate convincing but flawed reasoning traces. Popular health
    benchmarks vary widely in what they actually measure.
  modalities: [multimodal, text]
  performance: []
  verify:
    - >-
      Filled from the Europe PMC abstract only. The list of ten frontier
      models tested is carried over from the earlier hand-maintained table
      (sourced from the paper's Zenodo code release, not re-verified this
      pass) -- flag for confirmation against the paper itself.
    - No quantitative results are stated in the abstract, so `performance` is left empty.
  added: {date: 2026-08, by: Leo Chen}

- date: 2026-06
  title: General-purpose large language models outperform specialized clinical AI tools on medical benchmarks
  url: https://www.nature.com/articles/s41591-026-04431-5
  doi: 10.1038/s41591-026-04431-5
  venue: Nat. Med.
  authors:
    first:
      name: Krithik Vishwanath
      scholar: null
    last:
      name: Eric Karl Oermann
      scholar: null
  model:
    name: Frontier LLM vs. clinical AI tool benchmark
    repo: null
  summary:
    - A head-to-head evaluation pits three frontier LLMs (GPT-5.2, Gemini 3.1 Pro, Claude Opus 4.6) against two proprietary clinical AI tools (OpenEvidence, UpToDate Expert AI) across MedQA, HealthBench and 100 real clinical queries.
    - Frontier LLMs beat clinical AI tools in all three evaluations; Gemini scored highest on MedQA at 97.4% vs. OpenEvidence's 89.6% and UpToDate's 88.4%.
    - On real clinical queries reviewed blindly by 12 clinicians, specialized clinical AI tools performed no better than Google Search's AI Overview.
  summary_short: Frontier LLMs (GPT-5.2, Gemini 3.1 Pro, Claude Opus 4.6) beat specialized clinical AI tools (OpenEvidence, UpToDate) across three medical benchmarks.
  params: null
  params_status: n/a
  dataset_scale_short: 1,800 clinician annotations
  backbone: >-
    Comparative evaluation of two proprietary clinical AI tools (OpenEvidence,
    UpToDate Expert AI; architectures undisclosed) against three frontier
    LLMs (GPT-5.2, Gemini 3.1 Pro, Claude Opus 4.6), plus Google Search AI
    Overview as a real-world control. Introduces no new model.
  data:
    description: >-
      Three-stage evaluation: 500 MedQA (USMLE-style) questions, 500
      HealthBench items measuring clinician alignment, and a new real
      clinical queries (RCQ) benchmark of 100 de-identified physician queries
      from live clinical deployment, reviewed blindly by 12 US clinicians
      (1,800 model-question annotations).
    scale:
      medqa_questions: 500
      healthbench_items: 500
      real_clinical_queries: 100
      clinician_annotations: 1800
      clinician_reviewers: 12
  tasks: [question answering, benchmarking, reasoning]
  tasks_detail: >-
    Compares frontier general-purpose LLMs against specialized proprietary
    clinical AI tools on medical knowledge (MedQA), clinician alignment
    (HealthBench) and real-world physician queries (RCQ), finding frontier
    LLMs outperform clinical tools at every stage and that clinical tools
    matched only Google's AI Overview.
  modalities: [text]
  performance:
    - benchmark: MedQA (500 USMLE-style questions)
      metric: accuracy
      value: Gemini 3.1 Pro 97.4% > GPT-5.2 94.2% > Claude Opus 4.6 90.2% > OpenEvidence 89.6% > UpToDate 88.4%
      note: Gemini outperformed all others (P < 1e-4 vs. OpenEvidence/UpToDate/Claude, P = 0.02 vs. GPT)
    - benchmark: RCQ clinician rating, rater-leniency adjusted (1,800 annotations, 12 clinicians)
      metric: odds of a higher rating vs. Gemini
      value: clinical AI tools (incl. Google AI Overview) had 49-87% lower odds (OR 0.13-0.51)
      note: all P < 0.0001; frontier models beat clinical tools on individual questions, not just averages (rank-biserial r = 0.5-0.9)
    - benchmark: RCQ vs. Google Search AI Overview
      metric: comparative clinician rating
      value: clinical AI tools scored no better than Google AI Overview
      note: null
  verify:
    - Filled from the full-text PDF (open access, downloaded directly).
  added: {date: 2026-08, by: Leo Chen}

