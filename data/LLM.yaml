- date: 2026-02
  title: "Reliability of LLMs as medical assistants for the general public: a randomized preregistered study"
  url: https://www.nature.com/articles/s41591-025-04074-y
  doi: 10.1038/s41591-025-04074-y
  venue: Nat. Med.
  authors:
    first:
      name: Andrew M. Bean
      scholar: null
    last:
      name: Adam Mahdi
      scholar: null
  model:
    name: LLM medical-assistant human-factors RCT
    repo: null
  summary:
    - In a 1,298-participant RCT, LLMs alone (GPT-4o, Llama 3, Command R+) correctly identified conditions in up to 99% of cases, but participants using those same LLMs did no better than a control group using internet search.
    - Participants assisted by LLMs identified relevant conditions in under 34.5% of cases and chose the correct disposition in under 44.2%, both underperforming the unassisted control group.
    - Standard medical benchmarks and simulated patient interactions failed to predict these real human-user failures, arguing for mandatory human user testing before public deployment.
  summary_short: An RCT found LLMs diagnose accurately alone, but public users of the same LLMs performed no better than unassisted controls.
  params: null
  params_status: n/a
  dataset_scale_short: 1,298 participants
  backbone: >-
    Human-factors RCT using three off-the-shelf LLMs (GPT-4o, Llama 3,
    Command R+) as assistant conditions, compared against an internet-search
    control. Introduces no new model.
  pretraining_detail: >-
    All three LLMs used off-the-shelf via their consumer/API interfaces, not
    fine-tuned for this study.
  data:
    description: >-
      1,298 UK-based adult participants across 10 medical scenarios (5-point
      disposition scale plus condition identification), randomized to one of
      three LLM-assisted arms (GPT-4o, Llama 3, Command R+) or an
      internet-search control; 600 responses collected per experimental
      condition.
    scale:
      participants: 1298
      scenarios: 10
      responses_per_condition: 600
  tasks: [diagnosis, triage]
  tasks_detail: >-
    Participants chose a disposition (5-point scale, staying home to calling
    an ambulance) and listed suspected conditions for 10 medical scenarios,
    with or without LLM assistance (GPT-4o, Llama 3, Command R+) versus an
    internet-search control.
  modalities: [text]
  performance:
    - benchmark: LLM standalone task validation (60 responses/model/scenario), relevant condition identified
      metric: accuracy
      value: GPT-4o 94.7%, Llama 3 99.2%, Command R+ 90.8%
      note: null
    - benchmark: LLM standalone disposition accuracy
      metric: accuracy
      value: GPT-4o 64.7%, Llama 3 48.8%, Command R+ 55.5%
      note: null
    - benchmark: Human participants assisted by LLMs vs. control, relevant condition identification
      metric: odds ratio (control vs. aggregate LLM-assisted)
      value: control had 1.76x higher odds (95% CI 1.45-2.13)
      note: P < 0.001 for all three models; LLM-assisted participants identified conditions in under 34.5% of cases
    - benchmark: Human participants assisted by LLMs vs. control, correct disposition
      metric: rate
      value: LLM-assisted under 44.2%, no better than control
      note: null
  verify:
    - Filled from the full-text PDF (open access, downloaded directly).
  added: {date: 2026-08, by: Leo Chen}

- date: 2026-02
  title: ChatGPT Health performance in a structured test of triage recommendations
  url: https://doi.org/10.1038/s41591-026-04297-7
  doi: 10.1038/s41591-026-04297-7
  venue: Nat. Med.
  authors:
    first:
      name: Ashwin Ramaswamy
      scholar: https://scholar.google.co.uk/citations?user=p80HpI0AAAAJ&hl=en&oi=ao
    last:
      name: Girish N. Nadkarni
      scholar: null
  model:
    name: ChatGPT Health
    repo: https://github.com/ashwinra-code/gpt-health-eval
  summary:
    - A structured stress test of OpenAI's ChatGPT Health (gpt-5-mini backbone) across 60 clinician-authored vignettes found systematic under-triage of emergencies (52%) and over-triage of non-urgent cases.
    - Anchoring bias was significant, when family/friends minimized symptoms, triage recommendations shifted toward less urgent care (OR 11.7).
    - Crisis-intervention safeguards for suicidal ideation activated unpredictably, raising safety concerns ahead of consumer-scale deployment.
  summary_short: A stress test of ChatGPT Health, built on gpt-5-mini, found systematic under-triage of emergencies and anchoring bias from family framing.
  params: null
  params_status: not published
  dataset_scale_short: 960 responses
  backbone: >-
    ChatGPT Health web interface, running the gpt-5-mini thinking backbone.
  data:
    description: >-
      60 clinician-authored triage vignettes across 21 clinical domains under
      16 factorial conditions, yielding 960 total responses.
    scale:
      vignettes: 60
      clinical_domains: 21
      total_responses: 960
  tasks: [triage]
  tasks_detail: >-
    Structured stress test of triage recommendations; failures concentrated at
    clinical extremes (nonurgent and emergency presentations), with anchoring
    bias from family/friends' framing and unpredictable crisis-intervention
    activation.
  modalities: [text]
  performance:
    - benchmark: Dangerous triage failures by presentation type
      metric: failure rate
      value: 35% (nonurgent) / 48% (emergency)
      note: inverted U-shaped pattern across the severity spectrum
    - benchmark: Gold-standard emergencies (e.g. DKA, impending respiratory failure)
      metric: undertriage rate
      value: 52%
      note: directed to 24-48h evaluation rather than the emergency department
    - benchmark: Anchoring bias (family/friends minimizing symptoms)
      metric: odds ratio for a less-urgent triage shift
      value: 11.7 (95% CI 3.7-36.6)
      note: null
  verify:
    - >-
      Backbone (gpt-5-mini thinking) confirmed from the open-access full
      text's Methods section.
    - >-
      params_status not published: OpenAI does not disclose parameter counts
      for gpt-5-mini; the linked eval repo (github.com/ashwinra-code/
      gpt-health-eval) was checked and contains only analysis code and data,
      no model card or parameter count.
  added: {date: 2026-08, by: Leo Chen}

