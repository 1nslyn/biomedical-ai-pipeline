- date: 2026-05
  title: A cognitive layer architecture to support large-language model performance in psychotherapy interactions
  url: https://www.nature.com/articles/s41591-026-04278-w
  doi: 10.1038/s41591-026-04278-w
  venue: Nat. Med.
  authors:
