- date: 2026-01
  title: "MedHELM: Holistic Evaluation of Large Language Models for Medical Tasks"
  url: https://www.nature.com/articles/s41591-025-04151-2
  doi: 10.1038/s41591-025-04151-2
  venue: Nat. Med.
  authors:
    first:
      name: Suhana Bedi
      scholar: https://scholar.google.com/citations?user=jiu9TasAAAAJ&hl=en
    last:
      name: Nigam H. Shah
      scholar: https://scholar.google.com/citations?user=n63DmP8AAAAJ&hl=en
  model:
    name: MedHELM
    repo: https://github.com/stanford-crfm/helm
  summary:
    - MedHELM introduces a clinician-validated taxonomy of 5 categories / 22 subcategories / 121 real clinical tasks, plus a 37-evaluation benchmark suite for medical LLMs.
    - Nine frontier LLMs were compared via an automated LLM-jury method; reasoning models DeepSeek R1 and o3-mini led with 66% win rates.
    - Claude 3.5 Sonnet achieved comparable results at 15% lower computational cost, highlighting a cost/performance tradeoff for real-world deployment.
  summary_short: A clinician-validated LLM benchmark found DeepSeek R1 and o3-mini leading, with Claude Sonnet close behind at meaningfully lower computational cost.
  params: null
  params_status: n/a
  dataset_scale_short: 121 tasks, 9 models
  backbone: >-
    Extensible evaluation framework, not a trained model. Systematically
    compares nine frontier LLMs (Claude 3.5 Sonnet, Claude 3.7 Sonnet, DeepSeek
    R1, Gemini 1.5 Pro, Gemini 2.0 Flash, GPT-4o, GPT-4o mini, Llama 3.3,
    o3-mini) using an automated LLM-jury method.
  data:
    description: >-
      Clinician-validated taxonomy of 5 categories / 22 subcategories / 121
      tasks mirroring real clinical practice, with a 37-evaluation benchmark
      suite covering every subcategory.
    scale:
      categories: 5
      subcategories: 22
      tasks: 121
      evaluations: 37
      models_evaluated: 9
  tasks: [clinical decision support, clinical note generation, patient communication, medical research assistance, administration, benchmarking]
  tasks_detail: >-
    Five categories mirroring real clinical tasks: clinical decision support
    (diagnostic decisions, treatment planning), clinical note generation
    (visit documentation, procedure reports), patient communication (education
    materials, care instructions), medical research (literature analysis,
    clinical data analysis) and administration (scheduling, workflow
    coordination).
  modalities: [text]
  performance:
    - benchmark: LLM-jury evaluation across 37 evaluations, 9 frontier LLMs
      metric: win rate
      value: 66% (DeepSeek R1, o3-mini)
      note: Claude 3.5 Sonnet achieved comparable results at 15% lower computational cost
  verify:
    - Filled from the Europe PMC abstract only; full text not fetched this pass.
  added: {date: 2026-08, by: Leo Chen}
