  dataset_scale_short: 107 patient cases
  backbone: >-
    AMIE, an LLM-based system built upon Gemini 2.0 Flash.
  data:
    description: >-
      Randomized controlled trial on a real-world dataset of complex cases
      from a subspecialist cardiology practice, with clinical text reports
      plus raw diagnostic data (ECG, echocardiogram, cardiac MRI,
      cardiopulmonary exercise testing).
    scale:
      patient_cases: 107
      cardiologists: 9
  tasks: [triage, diagnosis, treatment response]
  tasks_detail: >-
    Nine general cardiologists managed complex suspected-cardiomyopathy cases
    with or without AMIE assistance; three blinded subspecialists rated
    triage, diagnosis and management quality on a ten-domain rubric.
  modalities: [text, ECG, ultrasound, MRI, physiological signals]
  performance:
    - benchmark: Subspecialist preference, AMIE-assisted vs. cardiologist-alone assessments
