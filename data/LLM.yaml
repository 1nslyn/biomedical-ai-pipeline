# Large Language Models -- benchmarks of LLMs, medical language models and
# clinical NLP.
#
# Source of truth for LLM.md. After editing, run:
#     python scripts/build.py
# CI will reject the PR if the generated markdown is out of date.
#
# Field reference: CONTRIBUTING.md
#
# This first batch was migrated from the old hand-maintained LLM.md table.
# Bibliographic fields (date, title, url, doi, venue, authors) come from
# Crossref via fetch_meta.py. The fields that need the paper read were filled
# from the Europe PMC abstract only -- full text was not fetched for this
# pass -- so `performance` is limited to numbers stated directly in the
# abstract, `params_status` is `unchecked` rather than `not published`, and
# each entry carries a `verify` note saying so.

- date: 2026-08
  title: Divergent impacts of explainable AI for dermatological diagnosis on clinicians versus lay people
  url: https://www.nature.com/articles/s41591-026-04553-w
  doi: 10.1038/s41591-026-04553-w
  venue: Nat. Med.
  authors:
    first:
      name: Xuhai 'Orson' Xu
      scholar: null
    last:
      name: Marzyeh Ghassemi
      scholar: null
  model:
    name: Dermatology XAI human-factors study (CDANN + GPT-4V)
    repo: null
  summary:
    - LLM-generated explanations (GPT-4V) boosted diagnostic accuracy more than other XAI methods when the AI was right, but hurt it most when the AI was wrong -- a "double-edged sword" effect.
    - A fairness-constrained diagnostic model (CDANN) narrowed skin-tone accuracy disparities by ~47% for lay people and ~36% for physicians.
    - Experienced PCPs were more resilient to misleading AI explanations than lay users, who showed stronger automation bias.
  summary_short: LLM explanations were a double-edged sword for diagnostic accuracy, while fairness-constrained training reduced skin-tone disparities for lay users and physicians.
  params: null
  params_status: not published
  dataset_scale_short: 108,585 images
  backbone: >-
    ViT-B/32 trained with CDANN (conditional domain adversarial neural
    network) fairness-constrained training for study 1's binary
    nevus/melanoma classification; DenseNet-121 for study 2's differential
    diagnosis (5-class primary + 30-class secondary). Post hoc explanations
    (GradCAM, CBIR, and a multimodal LLM -- GPT-4V) generated from the same
    trained models' outputs; the paper studies XAI's effect on human
    diagnostic decisions rather than introducing a new diagnostic model
    architecture.
  pretraining: [supervised]
  pretraining_detail: >-
    Supervised training with a CDANN domain-adversarial fairness constraint
    across skin tones (study 1) and standard supervised training (study 2,
    DenseNet-121). GPT-4V used off-the-shelf for explanation generation, not
    fine-tuned.
  data:
    description: >-
      108,585 clinical dermatology images (16 combined public/private
      datasets) spanning multiple skin tones and conditions (nevus, melanoma,
      atopic dermatitis, pityriasis rosea, Lyme disease, CTCL, others), with
      18,265 images carrying expert-annotated Fitzpatrick skin-tone labels.
      Evaluated via two human studies: 623 lay people (binary nevus/melanoma
      task) and 153 primary care physicians plus 320 medical students
      (differential diagnosis task).
    scale:
      images: 108585
      images_with_fitzpatrick_labels: 18265
      lay_participants: 623
      physicians: 153
      medical_students: 320
  tasks: [classification, diagnosis]
  tasks_detail: >-
    Randomized 4x2 factorial study (4 XAI methods: basic, GradCAM, CBIR,
    multimodal-LLM x 2 decision paradigms: Human-First, AI-First) measuring
    how explanation type and decision order affect diagnostic accuracy,
    automation bias and anchoring bias, comparing lay people against
    experienced PCPs.
  modalities: [clinical photography, text]
  performance:
    - benchmark: PCP differential diagnosis, top-1 / top-3 accuracy with AI assistance
      metric: accuracy increase over no-AI baseline
      value: top-1 +21.4pp (from 11.5%), top-3 +43.5pp (from 16.1%)
      note: null
    - benchmark: General public nevus/melanoma detection with AI assistance
      metric: accuracy increase
      value: +6.1pp (69.7% to 75.8%)
      note: null
    - benchmark: Skin-tone diagnostic accuracy disparity, with vs. without fairness-constrained AI
      metric: relative reduction in disparity
      value: 46.9% (general public), 35.6% (PCPs)
      note: general public disparity 3.2% to 1.7%; PCP disparity 4.5% to 2.7%
    - benchmark: Binary nevus/melanoma classifier (ViT-B/32 + CDANN)
      metric: weighted AUROC
      value: 0.930
      note: 0.933 light skin / 0.898 dark skin (Delta = 0.035)
    - benchmark: LLM (GPT-4V) explanation effect on general public accuracy
      metric: accuracy change vs. no explanation
      value: +7.7% when AI correct-leaning trust; -21.1% when AI incorrect
      note: largest swing of the four XAI methods in both directions -- the paper's "double-edged sword" finding
  verify:
    - >-
      Filled from the full-text PDF (not abstract-only) obtained via
      manual download of the open-access-marked article. Parameter counts
      for ViT-B/32 and DenseNet-121 are standard architecture names, not
      counts the authors themselves state for their fine-tuned checkpoints,
      so params is left null per house rules rather than computed from the
      backbone name.
    - >-
      Routing: this paper's core diagnostic model is image-based (dermatology
      falls under biomedical_images.md's scope per CONTRIBUTING.md's routing
      rule 1), but the maintainer chose to file it under LLM.md instead since
      the paper's actual contribution is about multimodal-LLM explanation
      behavior. Flagged here in case biomedical_images's maintainers want it
      cross-referenced.
  added: {date: 2026-08, by: Leo Chen}

- date: 2026-08
  title: A clinically validated framework for auditing AI chatbot behavior in mental health interactions
  url: https://www.nature.com/articles/s41591-026-04577-2
  doi: 10.1038/s41591-026-04577-2
  venue: Nat. Med.
  authors:
    first:
      name: Veith Weilnhammer
      scholar: null
    last:
      name: Matthew M. Nour
      scholar: null
  model:
    name: SIM-VAIL
    repo: null
  summary:
    - A clinically validated auditing framework simulates vulnerable users in multi-turn conversations to test 9 frontier chatbots for mental-health safety failures.
    - Concerning behavior was widespread across all 9 chatbots tested (Claude, GPT, Gemini, Grok, Llama), though reduced in newer model versions.
    - Risk was highest in a pattern the authors call a VAIL, when supportive-seeming chatbot behavior reinforces the user's underlying psychological vulnerability.
  summary_short: A validated framework audits nine chatbots for mental-health safety, finding widespread concerning behavior that eased in newer models.
  params: null
  params_status: n/a
  dataset_scale_short: 810 conversations
  backbone: >-
    An auditing framework, not a trained model. A claude-sonnet-4.5 auditor
    LLM simulates vulnerable users against nine target chatbots
    (claude-sonnet-3.7, claude-sonnet-4.5, gemini-2.5-flash, gemini-2.5-pro,
    llama-3.1-70b-instruct, gpt-4o, gpt-5, grok-3, grok-4, accessed via
    OpenRouter), scored by an automated safety judge (claude-opus-4.5 for
    conversation-level scores, claude-sonnet-4.5 for turn-level scores).
  data:
    description: >-
      810 simulated multi-turn conversations (30 clinically grounded user
      profiles x 9 target chatbots x 3 repetitions), spanning 6,329 turns;
      over 10,000 conversation-level and 90,000 turn-level mental-health risk
      ratings across 13 clinically grounded risk dimensions. Validated against
      488 turn-level ratings from 27 clinician annotators.
    scale:
      conversations: 810
      turns: 6329
      user_profiles: 30
      target_chatbots: 9
      clinician_annotators: 27
  tasks: [benchmarking, risk prediction]
  tasks_detail: >-
    Audits mental-health safety behavior of nine frontier consumer AI
    chatbots via simulated vulnerable users across 30 vulnerability x intent
    profiles. Concerning behavior was widespread across target chatbots
    (reduced in newer models), accumulated over conversation turns, and was
    highest when otherwise-supportive chatbot behavior reinforced the
    psychological mechanism underlying the simulated vulnerability -- a
    pattern the authors term a VAIL.
  modalities: [text]
  performance:
    - benchmark: Safety-judge inter-judge agreement (claude-opus-4.5 vs. gpt-5.2)
      metric: correlation
      value: r = 0.91
      note: null
    - benchmark: Safety judge vs. curated high/low-risk conversations
      metric: median AUC
      value: '0.98'
      note: null
    - benchmark: Human-LLM vs. human-human turn-level agreement (27 clinician annotators, 488 ratings)
      metric: correlation
      value: human-LLM r=0.49 vs. human-human r=0.41
      note: automated ratings were at least as reliable as an independent clinical judgment
    - benchmark: Simulated-conversation realism (27 clinician annotators)
      metric: rated "broadly plausible" or "reads as genuine"
      value: 80% (36% + 44%)
      note: only 1% rated "clearly artificial"
  verify:
    - >-
      Filled from the full-text PDF (open access, downloaded directly).
      Per-model and per-vulnerability behavior breakdowns exist throughout
      the paper; only headline validation/safety results were extracted here.
  added: {date: 2026-08, by: Leo Chen}

- date: 2026-06
  title: Towards conversational artificial intelligence for disease management
  url: https://www.nature.com/articles/s41586-026-10764-5
  doi: 10.1038/s41586-026-10764-5
  venue: Nature
  authors:
    first:
      name: Valentin Liévin
      scholar: null
    last:
      name: Mike Schaekermann
      scholar: null
  model:
    name: AMIE (disease management)
    repo: null
  summary:
    - AMIE's successor extends diagnostic dialogue to multivisit disease management -- treatment planning, monitoring and medication reasoning grounded in clinical guidelines via Gemini's long-context retrieval.
    - In a randomized blinded OSCE study, AMIE was non-inferior to 21 PCPs and scored better on treatment preciseness and guideline grounding.
    - On RxQA, a new drug-formulary reasoning benchmark, AMIE outperformed PCPs on the hardest medication questions.
  summary_short: AMIE's successor was non-inferior to twenty-one primary care physicians on multivisit disease management and outperformed them on hard medication-reasoning questions.
  params: null
  params_status: not published
  dataset_scale_short: 100 case scenarios
  backbone: >-
    LLM-based agentic system built on Gemini 2.5 Flash (evolved from earlier
    AMIE versions built on Gemini 1.5 Flash), combining long-context
    in-context retrieval of clinical guidelines and drug formularies with
    structured reasoning, agent scaffolding, and reinforcement learning from
    human/AI feedback for multivisit management dialogue.
  pretraining: [supervised, reinforcement learning]
  pretraining_detail: >-
    Dialogue agent trained via supervised fine-tuning plus reinforcement
    learning from human/AI feedback (reward model on human and LLM
    preferences), with an agentic "Mx" management-reasoning module performing
    guideline retrieval, draft generation, critique and revision, layered on
    the Gemini 2.5 Flash long-context backbone.
  data:
    description: >-
      Randomized, blinded virtual OSCE study: 100 multivisit case scenarios
      across five medical specialties (built from UK NICE guidance and BMJ
      Best Practice guidelines), AMIE vs. 21 primary care physicians,
      evaluated by specialist physicians and patient actors. Medication
      reasoning separately benchmarked via RxQA, a multiple-choice question
      set derived from US and UK national drug formularies and validated by
      board-certified pharmacists.
    scale:
      case_scenarios: 100
      medical_specialties: 5
      pcps: 21
  tasks: [diagnosis, treatment response, question answering, planning]
  tasks_detail: >-
    Multivisit disease-management reasoning (treatment planning, investigation
    selection, guideline-grounded monitoring and plan adjustment) compared
    against 21 PCPs in a randomized blinded OSCE; separately benchmarks
    medication/drug-formulary reasoning via RxQA.
  modalities: [text]
  performance:
    - benchmark: OSCE management reasoning, AMIE vs. 21 PCPs (100 multivisit cases, 5 specialties)
      metric: specialist-assessed outcome
      value: non-inferior overall; better on treatment/investigation preciseness and guideline grounding
      note: null
    - benchmark: RxQA medication reasoning, higher-difficulty subset (pharmacist-rated)
      metric: accuracy vs. PCPs
      value: AMIE outperformed PCPs
      note: both benefited significantly from access to external drug information
    - benchmark: Backbone hallucination rate (Hughes Hallucination Evaluation Model leaderboard)
      metric: hallucination rate
      value: Gemini 1.5 Flash >5% -> Gemini 2.0 Flash 0.7%
      note: illustrates rapid backbone improvement cited by the authors, not a result of this paper's own training
  verify:
    - >-
      Filled from the full-text PDF (open access, downloaded directly). The
      RxQA benchmark has a public repo (github.com/google-health/rxqa); AMIE
      itself has no public repo, so model.repo is left null rather than
      pointing to the benchmark repo.
  added: {date: 2026-08, by: Leo Chen}

- date: 2026-06
  title: "Generative AI-enabled clinical decision support system in primary care: a pragmatic, cluster-randomized trial"
  url: https://www.nature.com/articles/s41591-026-04503-6
  doi: 10.1038/s41591-026-04503-6
  venue: Nat. Med.
  authors:
    first:
      name: Ambrose Agweyu
      scholar: null
    last:
      name: Bilal A. Mateen
      scholar: null
  model:
    name: AI Consult (v2.0)
    repo: null
  summary:
    - A GPT-4o-based clinical decision support tool embedded in the EMR was tested in a real-world cluster-randomized trial across 16 Kenyan primary care facilities.
    - LLM assistance did not significantly reduce 14-day treatment failure (2.2% vs. 2.0% control, P = 0.13) -- a rare rigorously tested null result for this kind of tool.
    - No safety signal was identified, and the intervention cost about 4 cents per patient in LLM inference.
  summary_short: A GPT-4o-based decision support tool in a Kenyan primary-care trial did not reduce treatment failure; it caused no safety signal.
  params: null
  params_status: not published
  dataset_scale_short: 9,691 patients
  backbone: >-
    Custom LLM-based CDSS ("AI Consult", version 2.0) embedded in Penda
    Health's EMR, built on GPT-4o (May 2025 release; temperature 0.1, top-p
    1.0, 1024-token max output), with structured system prompts defining
    clinical role and scope aligned to Kenyan national treatment guidelines,
    and rule-based, version-controlled prompt logic for color-coded severity
    alerts.
  pretraining_detail: >-
    Uses GPT-4o off-the-shelf (not fine-tuned); clinical alignment is achieved
    entirely through structured system prompts and version-controlled
    prompt-based alert logic rather than model training.
  data:
    description: >-
      Pragmatic cluster-randomized trial across 16 primary care facilities in
      Nairobi/Kiambu, Kenya (Penda Health network). 103 clinical officers (52
      intervention, 51 control) randomized; 9,691 patients analyzed (4,693
      intervention, 4,654 control) between 22 April and 16 July 2025.
    scale:
      facilities: 16
      clinical_officers: 103
      patients_analyzed: 9691
  tasks: [clinical decision support, diagnosis, treatment response]
  tasks_detail: >-
    Cluster-randomized (by clinical officer) trial of an always-on,
    prompt-triggered LLM clinical decision support tool embedded in the EMR
    for real-world low-resource primary care, measuring 14-day treatment
    failure, documentation quality, prescribing, patient satisfaction and
    safety.
  modalities: [text, EHR]
  performance:
    - benchmark: Primary outcome, 14-day treatment failure, intervention vs. control (9,691 patients, 103 clinical officers)
      metric: adjusted odds ratio
      value: 'OR 0.77 (95% CI 0.55-1.08), P = 0.13'
      note: 2.2% intervention vs. 2.0% control; not statistically significant
    - benchmark: Safety
      metric: adverse events attributed to the intervention
      value: '0 serious adverse events; no safety signal on independent review'
      note: null
    - benchmark: Per-patient LLM cost (intervention arm)
      metric: mean cost
      value: US$0.04 (95% CI 0.04-0.04)
      note: null
  verify:
    - Filled from the full-text PDF (open access, downloaded directly).
  added: {date: 2026-08, by: Leo Chen}

