  summary:
    - Google's AMIE (built on Gemini 2.0 Flash) assisted general cardiologists managing complex suspected-cardiomyopathy cases, judged by 9 subspecialists.
    - Subspecialists preferred AMIE-assisted assessments 46.7% of the time vs. 32.7% for cardiologists alone, with fewer clinically significant errors and less missing content.
    - AMIE occasionally hallucinated findings (e.g. fabricating left ventricular hypertrabeculation), but self-corrected when directly challenged by cardiologists.
  summary_short: AMIE, built on Gemini 2.0 Flash, helped cardiologists outperform unassisted peers on complex cases, though it occasionally hallucinated self-corrected findings.
