- date: 2024-10
  title: "Integrated image-based deep learning and language models for primary diabetes care"
  url: https://www.nature.com/articles/s41591-024-03139-8
  doi: 10.1038/s41591-024-03139-8
  venue: Nat. Med.
  authors:
    first:
      name: Jiajia Li
      scholar: null
    last:
      name: Tien Yin Wong
      scholar: null
  model:
    name: DeepDR-LLM
    repo: null
  summary:
    - DeepDR-LLM combines a large language model module with an image-based deep learning system (DeepDR-Transformer) to provide individualized diabetes management recommendations and diabetic retinopathy (DR) screening support to primary care physicians.
    - In retrospective evaluation, the LLM module performed comparably to primary care physicians (PCPs) and endocrinology residents in English, and outperformed PCPs with performance comparable to endocrinology residents in Chinese.
