    - Med-PaLM, a 540-billion-parameter LLM adapted from PaLM for the medical domain, was the first LLM to exceed a passing score on United States Medical Licensing Examination style questions.
    - On MultiMedQA, a benchmark combining seven existing open question answering datasets, Med-PaLM achieved 67.6% accuracy on MedQA-USMLE, below clinician performance (86.5%).
