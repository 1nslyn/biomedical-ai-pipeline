  # Most LLM.md entries are not a named model at all -- a benchmark, an RCT,
  # a perspective piece -- so the scan table links by paper title instead of
  # model name ("Paper" not "Model"), labels the venue column "Journal", and
  # replaces "Training slides" (a pathology-specific concept) with
  # "Datasets" (dataset_scale_short per entry). The detail dropdown also
  # leads with a Summary field and reprioritises tasks/modalities above
  # pre-training/data. See scripts/build.py's render_index_table/render_detail.
  scan_table: paper

