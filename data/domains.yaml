# The nine catalogue pages.
#
# `file` is generated from `data/<slug>.yaml` once that file exists. Until then
# the page stays hand-maintained and the build script only counts its rows for
# the README table -- so pages can migrate one at a time.
#
# MAINTAINERS: fill in your own profile links. Every field is optional; the
# first one present becomes the link on your name and the rest are listed after
# it. Nothing is filled in speculatively -- a wrong profile link is worse than
# no link. Example:
#
#   - name: Jane Doe
#     homepage: https://janedoe.dev
#     scholar: https://scholar.google.com/citations?user=XXXXXXX
#     linkedin: https://www.linkedin.com/in/janedoe
#     twitter: https://x.com/janedoe
#     github: janedoe            # username, not a URL
#
# `pdf_repo` is your own repository of paper PDFs for this page -- clone it into
# NotebookLM in one go instead of uploading files one at a time. `notebooklm` is
# the shared notebook link. Both fill columns in the README table and both are
# optional. Never commit PDFs to *this* repository; see CONTRIBUTING.md.
#
# `groups` splits a long page into several tables instead of one wall of rows.
# List the sub-headings in the order you want them, then tag each entry in
# data/<slug>.yaml with a matching `group:`. Anything untagged lands in a final
# "Other" table. Omit the key entirely for a single-table page.
#
#   groups: [Genomics, Transcriptomics, Proteomics]

